map $http_x_forwarded_proto $iridescently_visitor_https {
    default 0;
    https 1;
}
# Cloudflare overwrites X-Forwarded-Proto with the visitor scheme; anything else is http.
map $http_x_forwarded_proto $iridescently_visitor_proto {
    default http;
    https https;
}
