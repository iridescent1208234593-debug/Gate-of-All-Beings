name: Regression

# Every pushed branch runs the same suite a developer runs locally
# (python tools/checks/regression.py --full), plus clean release builds, manifest
# provenance and dependency audits. Pull requests run it again as `merge-gate` on
# GitHub's merge of the head into the current base, so the check a merge waits on
# covers the merged result, not the head alone.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # A distinct name keeps the merge result's check apart from the head branch's push run.
    name: ${{ github.event_name == 'pull_request' && 'merge-gate' || 'regression' }}
    # One short-lived, isolated Linux runner per job for this reviewed same-repository PR.
    # Routing is not an authorization boundary: keep the custom runner offline otherwise.
    runs-on: >-
      ${{ github.repository == 'iridescent1208234593-debug/Gate-of-All-Beings'
        && github.repository_id == '1405756808'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/fix/fan-approval-attribution')
          || (github.event_name == 'pull_request'
            && github.ref == 'refs/pull/201/merge'
            && github.event.number == 201
            && github.event.pull_request.head.repo.id == 1405756808
            && github.event.pull_request.head.ref == 'fix/fan-approval-attribution'
            && github.event.pull_request.base.repo.id == 1405756808
            && github.event.pull_request.base.ref == 'master'
            && github.event.pull_request.base.sha == '5154cb2f1703c8759e094ae61e7bbba8511bcef1'))
        && 'gate-pr201-full-5ed4c8a3' || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Every build and test step uses disposable storage; CI never sees production data.
    env:
      IRIDESCENTLY_ENVIRONMENT: test
    steps:
      - name: Verify disposable Linux runner prerequisites
        if: runner.environment == 'self-hosted'
        run: |
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          test ! -e /var/run/docker.sock
          ffmpeg -version
          python - <<'PYVER'
          import sys
          import PIL
          assert sys.version_info[:2] == (3, 12), sys.version
          assert PIL.__version__ == "12.3.0", PIL.__version__
          PYVER
          node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1); console.log(process.version)'
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ runner.environment == 'github-hosted' }}
          fetch-depth: ${{ runner.environment == 'self-hosted' && 2 || 1 }}
      - name: Name the merge checkout
        # The merge commit is checked out detached; release manifests must record a branch.
        if: github.event_name == 'pull_request'
        run: git checkout -B "${GITHUB_REF#refs/}"
      - name: Verify the assigned GitHub checkout
        if: runner.environment == 'self-hosted'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$GITHUB_REF" = refs/pull/201/merge
            test "$(git rev-parse HEAD^1)" = 5154cb2f1703c8759e094ae61e7bbba8511bcef1
            expected_pr_head=$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')
            test "$(git rev-parse HEAD^2)" = "$expected_pr_head"
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/fix/fan-approval-attribution
          fi
      - name: Select disposable storage
        # The runner context is not available in job-level env, so it is set here.
        run: echo "IRIDESCENTLY_STORAGE_ROOT=$RUNNER_TEMP/iridescently-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Install Python test image dependency
        if: runner.environment == 'github-hosted'
        run: python -m pip install Pillow==12.3.0
      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/www/gallery-engine/package-lock.json
            apps/cards/package-lock.json
            apps/management/package-lock.json
            apps/ecology/package-lock.json
            apps/softie/package-lock.json
      - name: Install Node dependencies
        run: |
          npm ci
          for module in cards management ecology softie; do
            npm ci --prefix "apps/$module"
          done
          # activation-core is a pnpm project (pnpm-lock.yaml), installed for its route tests.
          npx --yes pnpm@10.28.0 install --frozen-lockfile --dir apps/activation-core
      - if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium
      - name: Verify preinstalled Chromium matches the locked Playwright package
        if: runner.environment == 'self-hosted'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync, accessSync, constants } = require('node:fs');
          const { dirname, join } = require('node:path');
          const { chromium } = require('playwright');
          const pkg = dirname(require.resolve('playwright-core/package.json'));
          const { browsers } = JSON.parse(readFileSync(join(pkg, 'browsers.json'), 'utf8'));
          for (const name of ['chromium', 'chromium-headless-shell']) {
            assert.equal(browsers.find(browser => browser.name === name)?.revision, '1248');
          }
          const browsersPath = process.env.PLAYWRIGHT_BROWSERS_PATH;
          assert.ok(browsersPath && browsersPath.startsWith('/'));
          const binary = join(browsersPath, 'chromium_headless_shell-1248', 'chrome-headless-shell-linux64', 'chrome-headless-shell');
          accessSync(binary, constants.X_OK);
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try { console.log(browser.version()); } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Shell lifecycle browser fixture
        run: node apps/shell/tests/lifecycle.mjs
      - name: Hall registration isolated browser
        run: node apps/huiguan/tests/register-flow.cjs
      - name: Install gallery preview encoder
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Shell navigation isolated browser
        run: node apps/shell/tests/navigation-save-smoke.cjs
      - name: Create isolated gallery build fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gallery"
          python - <<'PY'
          import os, struct, zlib
          from pathlib import Path
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>2I5B', 1, 1, 8, 6, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(b'\x00\x80\x60\x40\xff')) + chunk(b'IEND', b''))
          Path(os.environ['RUNNER_TEMP'], 'gallery', 'ci-fixture.png').write_bytes(png)
          PY
          echo "GALLERY_DIR=$RUNNER_TEMP/gallery" >> "$GITHUB_ENV"
      - name: Build release candidates
        run: |
          npm run build:release
          npm run build:site
      - name: Verify release manifests and output hashes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { verifyCandidate } from './tools/release/release-artifacts.mjs';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          for (const name of ['modules', 'homepage', 'site']) {
            const record = await verifyCandidate(name);
            if (record.sourceHead !== head || record.sourceDirty !== false) throw new Error(`${name} manifest does not match the clean checkout`);
            if (!record.sourceRepository || !record.sourceBranch || !record.buildCommand || !Object.keys(record.files).length) throw new Error(`${name} manifest lacks provenance or output hashes`);
            console.log(`${name}: ${record.sourceRepository} ${record.sourceBranch}@${record.sourceHead} (${Object.keys(record.files).length} hashed files)`);
          }
          NODE
      - name: Built candidates contain no unreviewed own-domain URLs
        # The site candidate is committed source, which the suite scans with its reviewed exceptions.
        run: >-
          python tools/domains/check-domain-hardcodes.py
          "$IRIDESCENTLY_STORAGE_ROOT/test/releases/candidate/modules"
          "$IRIDESCENTLY_STORAGE_ROOT/test/releases/candidate/homepage"
      - name: Regression suite (one module per process; print command diagnostics)
        run: >-
          python tools/checks/regression.py --full
          --modules "$IRIDESCENTLY_STORAGE_ROOT/test/releases/candidate/modules"
          --report "$RUNNER_TEMP/regression-report.json"
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit Gallery Engine build dependencies
        run: npm audit --prefix apps/www/gallery-engine --omit=dev --audit-level=high
      - name: Audit Cards module dependencies
        run: npm audit --prefix apps/cards --omit=dev --audit-level=high
      - name: Keep the regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: ${{ runner.temp }}/regression-report.json
          if-no-files-found: ignore
