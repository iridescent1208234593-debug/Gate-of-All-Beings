<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>西木会馆 LAB</title>
<link rel="stylesheet" href="/static/lab.css">
</head>
<body class="gate">
<main class="card">
  <p class="eyebrow">众生之门 · 测试世界</p>
  <h1>西木会馆 LAB</h1>
  <p class="lede">这里是独立的测试世界，与正式站点的账号和数据完全分开。请输入管理员发给你的测试码。</p>
  <form id="f" autocomplete="off">
    <label for="code">测试码</label>
    <input id="code" name="code" inputmode="text" spellcheck="false" placeholder="ZSZM-XXXX-XXXX-XXXX-XXXX" maxlength="40" required autofocus>
    <button id="go" type="submit">进入会馆</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="fine">登录后 7 天内免输入。你的 OC 图片只保存在这台设备的浏览器里，联机时只临时展示给同一空间的玩家。</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
