<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2e8" />
    <meta name="description" content="展开罗小黑世界地图，寻访各地会馆，阅读山海间的故事。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f5f2e8' stroke='%23365e4b'/%3E%3Cpath d='M3 16h26M16 2c-10 9-10 19 0 28 10-9 10-19 0-28' fill='none' stroke='%23365e4b'/%3E%3C/svg%3E" />
    <title>众生之门 · 世界地图</title>
    <script>
      // Use the same first-paint preference as the shared theme service.
      (function(){try{
        var m=document.cookie.match(/(?:^|;\s*)hx_theme=(light|dark|auto)/);
        var p=m?m[1]:'auto';
        document.documentElement.dataset.theme=p==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;
      }catch(e){}})();
    </script>
    <script src="/shared/shared-ui/theme.js?v=20261025"></script>
  </head>
  <body>
    <main class="observatory" id="app">
      <header class="masthead" data-ui>
        <div class="masthead-title"><span class="atlas-seal" aria-hidden="true">山海</span><div><small>众生之门 · 山海图志</small><h1>世界地图</h1></div></div>
        <p>循着山海，寻访会馆。<span>罗小黑战记世界 · 地点档案</span></p>
      </header>
      <section class="screen" id="screen" aria-label="可交互的幻想世界环形地图" aria-describedby="map-instructions" tabindex="0">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="map-legend hud" data-ui aria-label="地图图例"><span><i class="legend-named"></i>会馆</span><span><i class="legend-unnamed"></i>待归档地点</span></div>
        <div class="nodes" id="nodes" data-ui></div>
        <div class="node-tooltip hud" id="node-tooltip" role="status" aria-live="polite"></div>
        <div class="viewport-controls hud" data-ui role="group" aria-label="地图视角控制">
          <button id="zoom-in" type="button" aria-label="放大地图" title="放大地图（+）">＋</button>
          <button id="zoom-out" type="button" aria-label="缩小地图" title="缩小地图（−）">−</button>
          <button id="reset-view" type="button" title="恢复初始视角（0）">总览</button>
        </div>
        <div class="author-tools hud" data-ui><span id="author-position"></span></div>
        <div class="author-snippet hud" id="author-snippet" data-ui><code id="author-code"></code><button id="author-copy" type="button">复制代码</button></div>
        <div class="author-toast hud" id="author-toast" data-ui role="status"></div>
      </section>
      <aside class="city-panel" id="city-panel" data-ui aria-label="地点档案" aria-live="polite"></aside>
      <div class="atlas-index" data-ui><span class="index-label">寻访会馆</span><nav class="node-rail" id="node-rail" aria-label="会馆索引"></nav></div>
      <footer class="footer" data-ui>
        <span class="footer-status" id="viewport-status">地图载入中…</span>
        <span class="footer-note"></span>
        <div class="footer-actions">
          <details class="map-menu map-help"><summary>如何探索</summary><div class="menu-panel" id="map-instructions"><strong>在山海间行走</strong><p>左右拖动或滚动浏览地图，点击地点或会馆名称查看档案。</p><p>捏合缩放，或按住 Ctrl / ⌘ 滚动。也可以使用地图右下角的 ＋ / −。</p><p>键盘：聚焦地图后，← → 浏览，＋ − 缩放，0 返回总览。</p></div></details>
          <details class="map-menu" id="map-options"><summary>显示与工具</summary><div class="menu-panel"><strong>地图显示</strong><button id="theme-toggle" type="button" aria-label="切换深浅色模式">切换深浅色</button><label id="theme-auto"><input type="checkbox" aria-label="跟随系统" />跟随系统</label><div class="editor-entry"><button id="author-toggle" type="button" aria-pressed="false">节点取坐标</button><small>供地图维护使用，仅复制坐标，不修改地图。</small><span id="cursor-status">X — · Y —</span></div></div></details>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
