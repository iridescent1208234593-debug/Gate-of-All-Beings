<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf3e7">
  <title>OC 小游戏 · 众生之门</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="mini-games">
    <header class="page-header">
      <a id="return-home" href="/#home" target="_top">返回门庭</a>
      <a id="leaderboard" class="ranking-link" target="_top">查看排行榜 <span aria-hidden="true">↗</span></a>
    </header>
    <section id="setup" aria-labelledby="game-title">
      <div class="intro"><h1 id="game-title">OC 快跑</h1><p id="game-description">带上自己的 OC，跑过门后的风景。</p></div>
      <div class="setup-layout">
        <section class="selection" aria-labelledby="oc-title">
          <div class="section-heading"><h2 id="oc-title">谁来出发？</h2><button id="refresh-ocs" type="button">刷新 OC</button></div>
          <p id="oc-status" role="status">正在读取你的 OC…</p>
          <div id="oc-list" class="oc-list" role="group" aria-label="选择出场 OC"></div>
          <div class="oc-actions"><a id="manage-ocs" target="_top">前往会馆管理 OC</a><a id="login" target="_top" hidden>登录会馆</a></div>
          <div id="image-picker" hidden><label for="oc-image">出场图片</label><select id="oc-image"></select><p class="hint">可选择这个 OC 已有的头像或配图。</p></div>
          <p id="image-status" role="status"></p>
        </section>
        <section class="configuration" aria-labelledby="map-title">
          <h2 id="map-title">准备出发</h2>
          <div class="game-options">

          <label id="runner-mode-label" class="difficulty-label" for="runner-mode">玩法<select id="runner-mode"><option value="classic">普通快跑</option><option value="coins">金币快跑</option></select></label>

          <label class="difficulty-label" for="difficulty">难度<select id="difficulty"><option value="easy">轻松</option><option value="normal" selected>普通</option><option value="hard">挑战</option></select></label>
          </div>
          <p id="mode-hint" class="hint"></p>
          <div class="map-heading">选择地图 <span>内置地图</span></div>
          <div id="map-list" class="map-list" role="group" aria-label="选择内置地图"></div>
          <div class="preview"><canvas id="preview" width="720" height="320" role="img" aria-label="所选地图和 OC 的游戏预览"></canvas></div>
          <div class="start-row"><p id="best">本机最佳 · 0 分</p><button type="button" id="start" class="primary" disabled>开始快跑</button></div>
        </section>
      </div>
      <aside class="instructions"><h2>怎么玩</h2><div><p id="instructions"></p><p>切换窗口会自动暂停，本机最佳记录按账户保存。</p></div></aside>
    </section>
    <section id="play" aria-labelledby="play-title" hidden>
      <div class="play-heading"><div><h1 id="play-title">OC 快跑</h1><p id="playing-as"></p></div><button type="button" id="pause">暂停</button></div>
      <div class="hud" aria-live="off"><span>分数 <strong id="score">0</strong></span><span id="coin-stats" hidden></span><span id="crossing-stats" hidden></span></div>
      <div id="board" class="board">
        <canvas id="game-canvas" width="720" height="360" tabindex="0" aria-label="游戏区域。空格或上方向键跳跃；过河使用方向键。"></canvas>
        <div id="overlay" class="overlay" hidden><div><h2 id="overlay-title"></h2><p id="overlay-text"></p><button id="continue" class="primary" type="button">继续游戏</button><button id="choose-again" type="button">返回选择</button></div></div>
      </div>
      <div id="direction-pad" class="direction-pad" role="group" aria-label="过河方向控制" hidden><button type="button" data-move="up" aria-label="向上">上</button><div><button type="button" data-move="left" aria-label="向左">左</button><button type="button" data-move="down" aria-label="向下">下</button><button type="button" data-move="right" aria-label="向右">右</button></div></div>
      <p id="play-message" class="play-message" role="status"></p>
      <button id="leave" class="text-button" type="button">结束本局，返回选择</button>
    </section>
    <p id="save-status" class="save-status" role="status"></p><button id="retry-save" type="button" hidden>重试保存</button>
    <p id="rank-status" role="status"></p><button id="retry-rank" type="button" hidden>重试提交排行榜</button>
    <noscript>小游戏需要启用 JavaScript 才能运行。</noscript>
  </main>
  <script src="./file-mode.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
