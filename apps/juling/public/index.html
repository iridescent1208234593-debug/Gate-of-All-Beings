<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/shared/site-domains/index.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众生之门 · 聚灵</title>
<style>
  :root{--bg:#0d1117;--panel:#151b25;--border:#263041;--text:#dbe2ec;--muted:#8794a8;--gold:#c9a24a;--green:#5fbf6e;--red:#e0605a;--blue:#6a9bd8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:18px;}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  h1{font-size:20px;margin:0;letter-spacing:3px;}
  .sub{color:var(--muted);font-size:12px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:13px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--gold);letter-spacing:1px;}
  .el{display:inline-block;padding:1px 9px;border-radius:20px;border:1px solid;font-size:12px;font-weight:bold;}
  .el-木{color:#5fbf6e;border-color:#5fbf6e;}.el-火{color:#e0605a;border-color:#e0605a;}.el-土{color:#d0a24a;border-color:#d0a24a;}.el-金{color:#dcdcdc;border-color:#dcdcdc;}.el-水{color:#6a9bd8;border-color:#6a9bd8;}
  .sky{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .phase-big{font-size:34px;font-weight:bold;line-height:1;}
  .flavor{color:#c5d0de;font-size:13px;flex:1;min-width:150px;}
  .pbar{height:10px;background:#0a0e14;border-radius:6px;overflow:hidden;flex:1;min-width:100px;}
  .pfill{height:100%;background:linear-gradient(90deg,#c9a24a,#e0c06a);transition:width .4s;}

  #spiritCanvas{width:100%;height:auto;display:block;border-radius:8px;background:#0a0e14;}

  .stage-badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:14px;font-weight:bold;border:1px solid var(--gold);color:var(--gold);}
  .ling{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
  .ling-row{display:flex;align-items:center;gap:10px;}
  .ling-label{width:52px;font-size:13px;flex-shrink:0;}
  .ling-bar{flex:1;height:16px;background:#0a0e14;border-radius:8px;overflow:hidden;}
  .ling-fill{height:100%;border-radius:8px;transition:width .4s;}
  .ling-num{width:80px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;}
  .muted{color:var(--muted);font-size:12px;}
  .relics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .relic{border:1px solid var(--gold);color:#d8c08a;border-radius:8px;padding:3px 9px;font-size:12px;}

  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  button{background:#1b232e;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer;text-align:left;}
  button:hover{border-color:var(--gold);}
  button.primary{background:#233a26;border-color:#5fbf6e;}
  button.gold{background:#3a2f18;border-color:var(--gold);}
  button small{display:block;color:var(--muted);font-size:11px;}
  .log{max-height:300px;overflow-y:auto;font-size:12px;color:#aeb8c8;}
  .log div{padding:3px 0;border-bottom:1px solid #1c222c;}

  .start-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .start-el{background:#10161f;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;}
  .start-el:hover{border-color:var(--gold);}
  .start-el .big{font-size:24px;font-weight:bold;margin-bottom:4px;}
  .start-el .role{font-size:11px;color:var(--muted);}
  .overlay{position:fixed;inset:0;background:rgba(5,8,12,.88);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;}
  .overlay .box{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:26px;max-width:440px;width:100%;text-align:center;max-height:90vh;overflow-y:auto;}
  .overlay .verdict{font-size:30px;margin-bottom:8px;}
  .overlay .stat{color:var(--muted);font-size:14px;margin:4px 0;}
  .hidden{display:none;}
  input[type=range]{width:100%;accent-color:#c9a24a;}
</style>
  <script src="/design-system/game-nav.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>☯ 众生之门 · 聚灵</h1><div class="sub">生灵与物质灵交织 · 精灵化形 · 修炼成仙</div></div>
    <div class="muted" id="soulTag"></div>
  </header>

  <div class="card" id="skyCard"><div class="sky">
    <div class="phase-big" id="phaseBig">—</div>
    <div class="flavor" id="phaseFlavor"></div>
    <div class="pbar"><div class="pfill" id="phaseFill" style="width:0%"></div></div>
    <div class="muted" id="phaseMeta"></div>
  </div></div>

  <div class="card" id="spiritCard"><canvas id="spiritCanvas" width="700" height="260"></canvas></div>

  <div class="card" id="meCard"><h2 id="meTitle">我的状态</h2><div id="meBody"></div></div>
  <div class="card" id="actionCard"><h2>本回合 · 修行</h2><div id="actions"></div></div>
  <div class="card"><h2>聚灵纪事</h2><div class="log" id="log"></div></div>
</div>

<div class="overlay hidden" id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
(function(){
let __disposed=false;
let phase='start',latestState=null,run=null;
let autoGathering=false, autoTimer=null;
function toggleAutoGather(){
  autoGathering=!autoGathering;
  if(autoGathering){
    autoTimer=setInterval(()=>{ if(phase==='playing' && latestState && latestState.status==='running') act('gather'); }, 1500);
  }else{
    if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
  }
  render(latestState);
}
const EL_ROLE={金:'攻击·克木',木:'生长·克土',水:'控制·克火',火:'爆发·克金',土:'防御·克水'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ============ 灵力点云可视化 ============ */
const canvas=document.getElementById('spiritCanvas');
const cctx=canvas.getContext('2d');
let CW=700,CH=260;
const dots=[];
const N=140;
for(let i=0;i<N;i++){
  const life=Math.random()<0.55;
  dots.push({x:Math.random()*CW,y:Math.random()*CH,r:0.8+Math.random()*1.6,life,
    color:life?'hsla(120,70%,65%,':'hsla(45,75%,60%,',
    phase:Math.random()*Math.PI*2,vx:0,vy:0});
}
let visState={shengling:0,wuzhi:0,transformS:40,transformW:40,stage:'精灵',element:null,phase:'木'};
let gatherPulse=0; // >0 时点云汇聚

function triggerGatherPulse(){ gatherPulse=1.0; }

function canvasLoop(){
  if(__disposed)return;
  const cx=CW/2, cy=CH/2;
  cctx.clearRect(0,0,CW,CH);
  // 背景
  const bg=cctx.createRadialGradient(cx,cy,0,cx,cy,CW*0.6);
  bg.addColorStop(0,'#111a16'); bg.addColorStop(1,'#0a0e14');
  cctx.fillStyle=bg; cctx.fillRect(0,0,CW,CH);

  // 灵体成长度：生灵+物质灵 相对化形/成仙进度的比例
  const p=visState.stage==='精灵'
    ? Math.min(1,(visState.shengling+visState.wuzhi)/(visState.transformS+visState.transformW))
    : 1;
  const glowR=(16+p*16)*(1+Math.sin(Date.now()/500)*0.05);

  // 光晕
  const glow=cctx.createRadialGradient(cx,cy,0,cx,cy,glowR*2.4);
  glow.addColorStop(0,`rgba(160,220,160,${0.3+p*0.3})`);
  glow.addColorStop(0.5,`rgba(140,200,140,${0.1+p*0.15})`);
  glow.addColorStop(1,'rgba(0,0,0,0)');
  cctx.fillStyle=glow; cctx.beginPath(); cctx.arc(cx,cy,glowR*2.4,0,Math.PI*2); cctx.fill();

  // 灵体球（化形后带五行色）
  const elColor=visState.element?{木:'#5fbf6e',火:'#e0605a',土:'#d0a24a',金:'#dcdcdc',水:'#6a9bd8'}[visState.element]:'#b8e6b0';
  cctx.beginPath(); cctx.arc(cx,cy,glowR,0,Math.PI*2);
  cctx.fillStyle=visState.stage==='精灵'?`rgba(190,235,180,${0.15+p*0.3})`:elColor+'55';
  cctx.fill();
  cctx.strokeStyle=visState.stage==='精灵'?`rgba(220,255,210,${0.4+p*0.4})`:elColor;
  cctx.lineWidth=1.5; cctx.stroke();

  // 点云
  for(const d of dots){
    if(gatherPulse>0){
      const dx=cx-d.x,dy=cy-d.y,dist=Math.hypot(dx,dy);
      const a=0.05*gatherPulse;
      d.vx+=dx/dist*a; d.vy+=dy/dist*a;
      d.vx+=Math.sin(Date.now()/2600+d.phase)*0.004;
      d.vy+=Math.cos(Date.now()/3100+d.phase)*0.004;
      d.vx*=0.97; d.vy*=0.97; d.x+=d.vx; d.y+=d.vy;
      if(dist<glowR+2){ d.x=Math.random()*CW; d.y=Math.random()*CH; d.vx=0; d.vy=0; }
    }else{
      d.x+=Math.sin(Date.now()/1800+d.phase)*0.25;
      d.y+=Math.cos(Date.now()/2100+d.phase)*0.25;
    }
    const alpha=gatherPulse>0?0.95:0.5+Math.sin(Date.now()/800+d.phase)*0.3;
    cctx.beginPath(); cctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    cctx.fillStyle=d.color+alpha+')';
    cctx.fill();
  }

  if(gatherPulse>0) gatherPulse*=0.94;
  requestAnimationFrame(canvasLoop);
}

function updateVisState(s){
  const p=s.player;
  visState={shengling:p.shengling,wuzhi:p.wuzhiTotal,transformS:p.transformNeed.s,transformW:p.transformNeed.w,stage:p.stage,element:p.element,phase:s.phase};
  // 点云密度随天时微调（木相生灵点更密，金相物质灵点更密）
  const lifeRatio=s.phase==='木'?0.65:s.phase==='金'?0.4:0.55;
  dots.forEach(d=>{ d.life=Math.random()<lifeRatio; d.color=d.life?'hsla(120,70%,65%,':'hsla(45,75%,60%,'; });
}
canvasLoop();

/* ============ 游戏逻辑 ============ */
function showStart(){
  phase='start';
  document.getElementById('soulTag').textContent='境界：精灵 · 魂灵 0';
  ['skyCard','spiritCard','meCard','actionCard'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('overlayBox').innerHTML=`
    <div style="margin-bottom:8px;color:var(--muted)">你是森林中一簇初聚的<b>生灵</b>，尚无实体。<br>聚灵修行，汇聚<b>生灵</b>与<b>物质灵</b>，终可化形为妖。</div>
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
      <div class="muted">难度：<b id="diffLabel" style="color:var(--gold)">普通</b></div>
      <input type="range" id="diffSlider" min="1" max="5" value="3" oninput="onDiff(this.value)">
      <div class="muted" style="font-size:11px">越难，生灵散逸越快</div>
    </div>
    <br><button class="primary" onclick="start()">🌱 降临森林，开始聚灵</button>`;
  document.getElementById('overlay').classList.remove('hidden');
}
function onDiff(v){document.getElementById('diffLabel').textContent={1:'简单',2:'较易',3:'普通',4:'较难',5:'困难'}[v];}
function start(){
  const diff=Number(document.getElementById('diffSlider').value)||3;
  fetch('api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({difficulty:diff})})
    .then(r=>r.json()).then(s=>{
      document.getElementById('overlay').classList.add('hidden');
      phase='playing';render(s);
    });
}
function act(action,element){
  if(action==='gather') triggerGatherPulse();
  fetch('api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,element})})
    .then(r=>r.json()).then(s=>{
      if(s.status!=='running'){render(s);showEnd(s);reportJuling(s);}
      else render(s);
    });
}
// 账户积分 / 排行榜：一世结束时按「境界 × 难度」评分上报（聚灵的魂灵是全服共享状态，不用作个人分数）
function reportJuling(s){
  const ranks=['精灵','妖精','仙','神'];const stage=(s.summary&&s.summary.stage)||(s.player&&s.player.stage)||'';
  const rank=Math.max(1,ranks.findIndex(n=>stage.includes(n))+1);const diff=Number(s.difficulty)||3;
  const score=(s.status==='won'?100:20*rank)*diff;
  import('/shared/shared-session/progress.js').then(m=>m.reportResult('juling',{score,won:s.status==='won',ref:'juling:'+s.run+':'+s.tick+':'+Date.now()})).catch(()=>{});
}
function render(s){
  latestState=s;
  try{window.__mirror&&window.__mirror(s);}catch{}
  updateVisState(s);
  document.getElementById('soulTag').textContent=`境界：${s.realmStage.name} · 魂灵 ${s.soul}`;
  ['skyCard','spiritCard','meCard','actionCard'].forEach(id=>document.getElementById(id).style.display='');
  document.getElementById('phaseBig').textContent=s.phase;
  document.getElementById('phaseBig').className='phase-big el-'+s.phase;
  document.getElementById('phaseFlavor').textContent='「'+s.phaseFlavor+'」';
  document.getElementById('phaseFill').style.width=Math.round(s.phaseProgress/s.phaseLength*100)+'%';
  document.getElementById('phaseMeta').textContent=`第${s.run}世 · T${s.tick} · ${s.phaseProgress}/${s.phaseLength}`;

  const p=s.player;
  document.getElementById('meTitle').innerHTML=`我的状态 <span class="stage-badge">${p.stage}</span>${p.element?` <span class="el el-${p.element}">${p.element}</span>`:''}`;
  const tn=p.transformNeed, an=p.ascendNeed;
  const sPct=Math.min(100,Math.round(p.shengling/p.capacity*100));
  const wPct=Math.min(100,Math.round(p.wuzhiTotal/p.capacity*100));
  document.getElementById('meBody').innerHTML=`
    <div class="ling">
      <div class="ling-row">
        <div class="ling-label" style="color:#5fbf6e">生灵</div>
        <div class="ling-bar"><div class="ling-fill" style="width:${sPct}%;background:#5fbf6e"></div></div>
        <div class="ling-num">${p.shengling}</div>
      </div>
      <div class="ling-row">
        <div class="ling-label" style="color:#c9a24a">物质灵</div>
        <div class="ling-bar"><div class="ling-fill" style="width:${wPct}%;background:#c9a24a"></div></div>
        <div class="ling-num">${p.wuzhiTotal}</div>
      </div>
    </div>
    <div class="muted">五行物质灵：${['金','木','水','火','土'].map(e=>`<span class="el el-${e}" style="margin:0 2px">${e} ${p.wuzhi[e]}</span>`).join('')}</div>
    <div class="muted" style="margin-top:4px">灵质空间 ${p.total}/${p.capacity} · ${p.stage==='精灵'?`化形需 生灵${tn.s} · 物质灵${tn.w}`:p.stage==='妖精'?`成仙需 总灵${an.total}（${p.role}）`:'已证仙道'}</div>
    ${p.ability?`<div class="muted" style="color:var(--gold)">御灵：${p.ability}</div>`:''}
    ${p.secondary?`<div class="muted">辅助系【${p.secondary.name}】：${p.secondary.desc}</div>`:''}
    <div class="relics">${p.relics.map(r=>`<span class="relic" title="${esc(r.desc)}">${esc(r.name)}</span>`).join('')||'<span class="muted">尚未获得法器</span>'}</div>
    ${s.canInnerView?'<button class="gold" style="margin-top:8px" onclick="showInnerView()">🔮 内视灵质空间</button>':''}`;

  let html=`<button class="primary" onclick="act('gather')">🌿 聚灵<small>点云汇聚，生灵与物质灵交织</small></button>`;
  html+=`<button class="${autoGathering?'gold':''}" onclick="toggleAutoGather()">${autoGathering?'🧘 聚灵中…':'🧘 持续聚灵'}<small>${autoGathering?'正在自动聚灵（点击停）':'开启后自动持续聚灵'}</small></button>`;
  if(s.available.includes('transform')){
    html+=`<div style="margin-top:8px;font-size:12px;color:var(--muted)">生灵与物质灵已充盈，可化形：</div>`;
    for(const e of s.elements){ html+=`<button class="gold" onclick="act('transform','${e}')">化形·${e}<small>${EL_ROLE[e]}</small></button>`; }
  }
  if(s.npc){
    const n=s.npc;
    html+=`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">`;
    html+=`<div class="muted">遭遇：<span class="el el-${n.element}">${n.element}</span> ${n.name}（${n.hostile?'敌意':'友善'}）· 灵质${n.spirit}</div>`;
    if(s.available.includes('strike')) html+=`<button class="danger" onclick="act('strike')">⚔️ 克伐<small>攻击相克之敌</small></button>`;
    if(s.available.includes('bond')) html+=`<button onclick="act('bond')">🤝 相生<small>与相生对象结盟</small></button>`;
    if(s.available.includes('seize')) html+=`<button class="danger" onclick="act('seize')">🔥 豪夺<small>强夺其物质灵</small></button>`;
    html+=`</div>`;
  }
  document.getElementById('actions').innerHTML=html;
  document.getElementById('log').innerHTML=s.log.map(l=>'<div>'+esc(l)+'</div>').join('');
}
function showEnd(s){
  const sm=s.summary,win=s.status==='won';
  document.getElementById('overlayBox').innerHTML=`
    <div class="verdict">${win?'🎉 成仙':'🕯️ 散灵'}</div>
    <div class="stat">${sm.cause}</div>
    <div class="stat">阶段 ${sm.stage} · 生灵${sm.shengling} · 物质灵${sm.wuzhi} · ${sm.turns}回合</div>
    <div class="stat" style="color:var(--gold);font-weight:bold">魂灵 +${sm.soulGained}（累计 ${sm.totalSoul}）</div>
    <div class="stat muted">${latestState.realmStage.desc}</div>
    <br><button class="primary" onclick="showStart()">🌌 魂灵转世，再入轮回</button>`;
  document.getElementById('overlay').classList.remove('hidden');
}
function showInnerView(){
  const s=latestState, p=s.player, w=p.wuzhi;
  document.getElementById('overlayBox').innerHTML=`
    <div style="font-size:24px;font-weight:bold;color:var(--gold);margin-bottom:8px">🔮 灵质空间</div>
    <div class="stat muted">灵质空间 ${p.total}/${p.capacity} · ${p.stage}</div>
    <div class="stat" style="margin:10px 0">五行物质灵：${['金','木','水','火','土'].map(e=>`<span class="el el-${e}" style="margin:0 2px">${e} ${w[e]}</span>`).join('')}</div>
    <div class="stat">生灵：${p.shengling}</div>
    <div class="stat muted" style="margin:12px 0 6px">—— 六大系 ——</div>
    ${Object.entries(s.sixSystems).map(([name,info])=>`<div class="stat" style="text-align:left;font-size:13px;margin:4px 0"><b>${name}</b>：${info.desc}</div><div class="stat muted" style="text-align:left;font-size:12px">${info.abilities.join(' · ')}</div>`).join('')}
    <br><button class="primary" onclick="closeInnerView()">返回</button>`;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeInnerView(){
  document.getElementById('overlay').classList.add('hidden');
  if(latestState) render(latestState);
}
showStart();
window.__iridescentlyDispose=()=>{__disposed=true;};
Object.assign(window,{act,closeInnerView,showInnerView,showStart,start,toggleAutoGather,onDiff});
})();
</script>
<script type="module">
import { unifiedStorage } from '/shared/shared-session/kv.js';
const store = unifiedStorage('juling');
window.__mirror = (s) => { try { store.setItem('summary', JSON.stringify({ version:1, run:s.run, tick:s.tick, phase:s.phase, stage:s.realmStage&&s.realmStage.name, soul:s.soul, status:s.status, updatedAt:Date.now() })); } catch {} };
</script>
</body>
</html>
