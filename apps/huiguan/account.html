<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/shared/site-domains/index.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>个人账户 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="/design-system/design-system.css">
<link rel="stylesheet" href="/design-system/ui/lxh-ui.css">
<link rel="stylesheet" href="/avatar-cropper.css?v=20261024">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;padding:48px var(--qc-sp-4) 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:var(--qc-fs-xl);letter-spacing:3px;margin-bottom:var(--qc-sp-4)}
h1 small{font-size:var(--qc-fs-sm);color:var(--qc-dim);margin-left:10px;letter-spacing:1px}
.back{display:inline-block;margin-bottom:14px;color:var(--qc-dim);font-size:var(--qc-fs-md);text-decoration:none}
.back:hover{color:var(--qc-accent)}
.qc-card{margin-bottom:var(--qc-sp-4)}
.qc-hint{line-height:1.6;margin-top:6px}
.qc-err{min-height:18px;margin-top:var(--qc-sp-2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--qc-sp-2);padding:6px 0;font-size:var(--qc-fs-base)}
.row .k{color:var(--qc-dim)}
.field-row{display:flex;gap:var(--qc-sp-2);margin-top:10px}.field-row .qc-input{flex:1;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:var(--qc-sp-2);margin-top:var(--qc-sp-3)}
.schemes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:6px;min-height:var(--qc-tap);padding:6px 8px;border:1px solid var(--qc-border);border-radius:var(--qc-r-md);cursor:pointer;font-family:inherit;font-size:var(--qc-fs-sm);color:var(--qc-text);background:transparent;transition:border-color var(--qc-dur),box-shadow var(--qc-dur)}
.chip:hover{border-color:var(--qc-accent)}
.chip:focus-visible{outline:2px solid var(--qc-focus);outline-offset:2px}
.chip .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--qc-border);flex-shrink:0}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip.on{border-color:var(--qc-accent);box-shadow:0 0 0 1px var(--qc-accent)}
input[type=color]{width:42px;height:var(--qc-tap);border:1px solid var(--qc-border);border-radius:var(--qc-r-md);background:transparent;padding:2px;cursor:pointer}
.row .hex-in{width:96px;flex:none}
.theme-prev{border:1px solid var(--qc-border);border-radius:var(--qc-r-md);padding:12px;margin-top:12px;background:var(--qc-bg);min-height:52px}
.theme-prev .qc-btn{pointer-events:none}
#content>.qc-loading{min-height:240px}
.account-avatar-row{display:flex;align-items:center;gap:14px}.account-avatar-row>img{width:76px;height:76px;flex:none;border-radius:50%;object-fit:cover;background:var(--qc-bg);border:1px solid var(--qc-border)}
.account-avatar-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
@media(max-width:480px){.account-avatar-actions .qc-btn{flex:1 1 auto}.schemes{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body class="qc-body">
<div class="wrap">
  <a class="back" href="/">← 返回会馆</a>
  <h1>个人账户<small>西木会馆 · iridescently.xyz</small></h1>
  <div id="content"><div class="qc-loading" role="status">正在读取账户信息…</div></div>
</div>
<script src="/image-upload.js?v=20261024"></script>
<script src="/avatar-cropper.js?v=20261024"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const roleName={executor:'执行者',elder:'长老',admin:'管理员'};
let accountAvatarDraft=null, accountAvatarPreviewUrl='';
// Page-level state in the shared .qc-loading slot: what happened, plus the way forward.
function pageState(text,actions,isError){
  const box=document.createElement('div');box.className='qc-loading';box.setAttribute('role',isError?'alert':'status');box.textContent=text;
  if(actions&&actions.length){
    const row=document.createElement('div');row.className='qc-loading__actions';
    actions.forEach(a=>{const el=document.createElement(a.href?'a':'button');el.textContent=a.label;if(a.href)el.href=a.href;else{el.type='button';el.addEventListener('click',a.onClick);}row.appendChild(el);});
    box.appendChild(row);
  }
  document.getElementById('content').replaceChildren(box);
}
function reload(){pageState('正在读取账户信息…');init();}
async function init(){
  try{
    const token=new URLSearchParams(location.hash.slice(1)).get('verify-email');
    if(token){
      try{
        const result=await fetch('/api/account/email/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
        const data=await result.json();
        if(data.ok) history.replaceState(null,'',location.pathname+location.search);
        alert(data.ok?'邮箱验证成功：'+data.email:(data.error||'邮箱验证失败'));
      }catch(e){alert('验证请求暂时失败，请检查网络后刷新重试。');}
    }
    const r=await fetch('/api/user'); const u=await r.json();
    if(!u.logged_in)return pageState('请先登录后管理账户。',[{label:'去登录',href:'/?openauth=1'}],true);
    const emailRes=await fetch('/api/account/email');
    const emailState=emailRes.ok?await emailRes.json():{email:'',verified:false,pending:false};
    render(u,emailState);
  }catch(e){
    pageState(e instanceof TypeError?'网络连接失败，暂时无法读取账户信息。':e instanceof SyntaxError?'服务暂时不可用，请稍后再试。':'暂时无法读取账户信息。',[{label:'重新读取',onClick:reload},{label:'去登录',href:'/?openauth=1'}],true);
  }
}
function render(u,emailState){
  const isElder=u.role==='elder', isAdmin=u.is_admin, isScribe=u.edit_role==='scribe';
  const curP=((u.theme_primary||'#f5f0e8').match(/^#[0-9a-fA-F]{6}$/)?u.theme_primary:'#f5f0e8').toLowerCase();
  const curA=((u.theme_accent||'#5a9e8f').match(/^#[0-9a-fA-F]{6}$/)?u.theme_accent:'#5a9e8f').toLowerCase();
  document.getElementById('content').innerHTML=`
    <div class="qc-card">
      <h2 class="qc-h2">账户头像</h2>
      <div class="account-avatar-row"><img loading="lazy" decoding="async" id="accountAvatarPreview" src="${esc(u.account_avatar_url||u.picture||'')}" alt="账户头像" onerror="this.hidden=true"><div><strong>${esc(u.nickname||u.username||'账户')}</strong><div class="qc-hint">这是账户本人在网站中的通用头像，不会更改 OC 或众生之门形象。</div></div></div>
      <input id="accountAvatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      <div class="account-avatar-actions"><button class="qc-btn qc-btn--ghost" id="accountAvatarChoose" type="button">选择并裁切</button><button class="qc-btn" id="accountAvatarSave" type="button" disabled>保存头像</button><button class="qc-btn qc-btn--ghost" id="accountAvatarRemove" type="button">移除自定义头像</button></div>
      <div class="qc-hint" id="accountAvatarHint">支持 JPG、PNG、WebP、GIF；保存为去除元数据的 1:1 头像。</div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">账户安全</h2>
      <p class="qc-hint">设置找回问题、修改密码，或检查你的站内登录账号。</p>
      <a class="qc-btn" href="/security.html" style="margin-top:var(--qc-sp-3)">管理账户安全</a>
    </div>
    <div class="qc-card" id="password-setting">
      <h2 class="qc-h2">登录密码</h2>
      <p class="qc-hint">设置后可以用「昵称或邮箱 + 密码」直接登录，即使 USSO 单点登录不可用也能进站。${u.kind==='usso'?'<br>你当前是 USSO 账号，首次设置无需原密码。':''}</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input id="pwOld" type="password" maxlength="128" autocomplete="current-password" placeholder="原密码（首次设置可留空）" class="qc-input">
        <input id="pwNew" type="password" maxlength="128" autocomplete="new-password" placeholder="新密码（12-128 位）" class="qc-input">
        <button class="qc-btn" onclick="setLoginPassword()">保存密码</button>
      </div>
      <div class="qc-hint" id="pwMsg" role="status"></div>
    </div>

    <div class="qc-card" id="email-binding">
      <h2 class="qc-h2">邮箱验证</h2>
      ${emailState.verified?`<div class="row"><span class="k">已验证邮箱</span><span>${esc(emailState.email)} <span class="qc-tag qc-tag--accent">可用于账号找回</span></span></div>`:'<div class="qc-hint">绑定并验证一个常用邮箱，可用于找回站内账号名和重置密码。旧资料中的邮箱不会自动视为已验证。</div>'}
      <div class="field-row">
        <input id="accountEmail" type="email" maxlength="254" autocomplete="email" placeholder="${emailState.verified?'输入新邮箱以更换':'你的邮箱地址'}" value="" class="qc-input">
        <button class="qc-btn" id="emailSend" onclick="sendEmailVerification()">发送验证链接</button>
      </div>
      <div class="qc-hint">验证链接 30 分钟有效；旧邮箱在新邮箱验证成功前保持绑定。</div>
      <div class="qc-hint" id="emailHint">${emailState.pending?'已有一封待验证邮件，请检查收件箱。':''}</div>
      <div class="qc-err" id="emailErr"></div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">身份信息</h2>
      <div class="row"><span class="k">昵称</span><span>${esc(u.nickname||u.username)}</span></div>
      <div class="row"><span class="k">账号类型</span><span>${u.kind==='local'?'站内账号':'USSO 账号'}</span></div>
      <div class="row"><span class="k">会馆身份</span><span class="qc-tag ${isAdmin?'qc-tag--gold':isElder?'qc-tag--accent':''}">${roleName[u.role]||'执行者'}</span></div>
      <div class="row"><span class="k">编辑权限</span><span class="qc-tag ${isScribe?'qc-tag--accent':''}">${isScribe?'编辑（可直接修订设定）':'无'}</span></div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">等级与积分</h2>
      <div class="row"><span class="k">当前等级</span><span class="qc-tag qc-tag--gold">Lv.${u.level||0}</span></div>
      <div class="row"><span class="k">积分</span><span>${u.points||0} <span style="color:var(--qc-dim)">/ 下一级 ${u.next_level_at||1}</span></span></div>
      <div class="qc-hint">积分来自各个玩法与每日任务：每种玩法每天第一次游玩 +0.5，完成一局 +0.2，胜利再 +0.3，刷新个人最佳 +0.5；每日任务“完成任意一局”“玩三种不同玩法”各 +1；登记新角色设表 +1（每天至多 2 张），自定义配色 +0.5。每天最多 8 分。第 1 级需要 1 分，之后每级比上一级多 1 分。</div>
      <div class="row"><a class="qc-btn" href="/shared/shared-ui/leaderboard/index.html">查看排行榜</a></div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">改名</h2>
      <div class="row"><span class="k">当前昵称</span><span>${esc(u.nickname||u.username)}</span></div>
      <div class="field-row">
        <input id="renameInput" class="qc-input" placeholder="输入新昵称">
        <button class="qc-btn" onclick="doRename()">改名</button>
      </div>
      <div class="qc-hint">昵称全站唯一，每 3 天可改一次；官方世界观角色名禁止使用。</div>
      <div class="qc-err" id="renameErr"></div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">身份申请</h2>
      <div class="row"><span class="k">会馆长老</span>${elderBtn(u)}</div>
      <div class="qc-hint">长老：御灵系可选 2 系、年龄上限 1500 岁；可管理执行者与编辑。需申请并经馆长批准。</div>
      <div class="row" style="margin-top:10px;"><span class="k">编辑（审查补充世界观）</span>${scribeBtn(u)}</div>
      <div class="qc-hint">编辑：可直接编辑/补充官方角色设定（所有改动留版本记录）。需申请并经长老/管理员批准。</div>
      <div class="row" style="margin-top:10px;"><span class="k">突破年龄限制</span>${exemptBtn(u,'age')}</div>
      <div class="qc-hint">获批后，可在人设登记表"年龄"旁勾选突破年龄限制，解除 450/1500 岁上限。</div>
      <div class="row" style="margin-top:10px;"><span class="k">突破技能选择限制</span>${exemptBtn(u,'skill')}</div>
      <div class="qc-hint">获批后，可在人设登记表"能力"旁勾选突破选择限制，解除御灵系/大系数量限制。</div>
      <div class="qc-err" id="applyErr"></div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">外观配色</h2>
      <div class="qc-hint" style="margin-bottom:10px;">设置你的专属主题色。psy 题库站等子站登录后将跟随该配色；未设置时默认宣纸乳白（#f5f0e8 × #5a9e8f）。</div>
      <div class="schemes" id="schemeGrid">
        ${COLOR_SCHEMES.map((s,i)=>`<button type="button" class="chip ${curP===s.primary.toLowerCase()&&curA===s.accent.toLowerCase()?'on':''}" data-i="${i}" onclick="pickScheme(${i})" title="${esc(s.name)}"><span class="dot" style="background:${s.primary}"></span><span class="dot" style="background:${s.accent}"></span><span class="nm">${esc(s.name)}</span></button>`).join('')}
      </div>
      <div class="row" style="margin-top:12px;"><span class="k">主色</span><input type="color" id="tp" value="${curP}" oninput="syncThemeInputs()"><input class="qc-input hex-in" id="tpHex" value="${curP}" oninput="syncThemeInputs()"></div>
      <div class="row"><span class="k">辅色</span><input type="color" id="ta" value="${curA}" oninput="syncThemeInputs()"><input class="qc-input hex-in" id="taHex" value="${curA}" oninput="syncThemeInputs()"></div>
      <div class="theme-prev" id="themePrev"></div>
      <div class="actions">
        <button class="qc-btn" onclick="saveTheme()">保存配色</button>
        <button class="qc-btn qc-btn--ghost" onclick="resetTheme()">恢复默认宣纸乳白</button>
      </div>
      <div class="qc-hint" id="themeHint"></div>
      <div class="qc-err" id="themeErr"></div>
    </div>
    <div class="qc-card">
      <h2 class="qc-h2">登录方式</h2>
      <div class="row"><span class="k">当前账户</span><span>${u.kind==='usso'?'<span class="qc-tag">既有 USSO 账户</span>':'<span class="qc-tag qc-tag--accent">会馆站内账号</span>'}</span></div>
      <div class="qc-hint">USSO 新登录与绑定暂时停用。既有账户资料和角色记录保留；跨站会话仍由共享会话服务处理。</div>
    </div>
  `;
  updatePrev();
}
document.addEventListener('click',async event=>{
  const id=event.target?.id;
  if(id==='accountAvatarChoose') document.getElementById('accountAvatarFile')?.click();
  if(id==='accountAvatarSave'&&accountAvatarDraft){
    const button=event.target,hint=document.getElementById('accountAvatarHint');button.disabled=true;hint.textContent='正在保存头像…';
    try{await window.HuiguanImages.request('/api/account/avatar',{},accountAvatarDraft);accountAvatarDraft=null;if(accountAvatarPreviewUrl)URL.revokeObjectURL(accountAvatarPreviewUrl);accountAvatarPreviewUrl='';await init();}
    catch(error){hint.textContent=error.message||'头像保存失败';button.disabled=false;}
  }
  if(id==='accountAvatarRemove'){
    const button=event.target,hint=document.getElementById('accountAvatarHint');button.disabled=true;
    try{const r=await fetch('/api/account/avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remove:true})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'移除失败');accountAvatarDraft=null;await init();}
    catch(error){hint.textContent=error.message||'移除失败';button.disabled=false;}
  }
});
document.addEventListener('change',async event=>{
  if(event.target?.id!=='accountAvatarFile')return;
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  try{accountAvatarDraft=await window.HuiguanAvatarCropper.open(file);if(accountAvatarDraft){if(accountAvatarPreviewUrl)URL.revokeObjectURL(accountAvatarPreviewUrl);accountAvatarPreviewUrl=URL.createObjectURL(accountAvatarDraft);const preview=document.getElementById('accountAvatarPreview');preview.src=accountAvatarPreviewUrl;preview.hidden=false;document.getElementById('accountAvatarSave').disabled=false;document.getElementById('accountAvatarHint').textContent='预览已更新；点击“保存头像”后同步到你的账户。';}}
  catch(error){document.getElementById('accountAvatarHint').textContent=error.message||'图片处理失败';}
});
async function setLoginPassword(){
  const oldEl=document.getElementById('pwOld'), newEl=document.getElementById('pwNew'), msg=document.getElementById('pwMsg');
  const oldPwd=oldEl?oldEl.value:'', newPwd=newEl?newEl.value:'';
  if(!newPwd || newPwd.length<12 || newPwd.length>128){ if(msg){msg.textContent='新密码长度需在 12-128 位之间';msg.style.color='#b3543f';} return; }
  if(msg){msg.textContent='保存中…';msg.style.color='';}
  try{
    const r=await fetch('/api/account/password',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({old_password:oldPwd,new_password:newPwd})});
    const d=await r.json().catch(()=>({}));
    if(r.status===200){ if(msg){msg.textContent='密码已保存，下次可直接用昵称或邮箱登录';msg.style.color='#5a9e8f';} if(oldEl)oldEl.value=''; if(newEl)newEl.value=''; }
    else if(msg){ msg.textContent=d.error||'保存失败'; msg.style.color='#b3543f'; }
  }catch(e){ if(msg){msg.textContent='网络错误，请稍后再试';msg.style.color='#b3543f';} }
}
async function sendEmailVerification(){
  const input=document.getElementById('accountEmail'), button=document.getElementById('emailSend');
  const hint=document.getElementById('emailHint'), err=document.getElementById('emailErr');
  err.textContent=''; hint.textContent='';
  if(!input.value.trim()){err.textContent='请输入邮箱地址';input.focus();return;}
  button.disabled=true;
  try{
    const r=await fetch('/api/account/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:input.value.trim()})});
    const d=await r.json();
    if(d.ok)hint.textContent=d.message||'验证链接已发送，请检查收件箱。';
    else err.textContent=d.error||'发送失败';
  }catch(e){err.textContent='网络错误，请稍后重试';}
  finally{button.disabled=false;}
}
function elderBtn(u){
  if(u.role==='elder'||u.is_admin) return '<span class="qc-tag qc-tag--accent">已是长老/管理员</span>';
  if(u.honor_kind) return '<span class="qc-tag qc-tag--accent">'+(u.honor_kind==='elder_honor'?'荣誉长老':(u.honor_alias||'妖王'))+'</span>';
  if(u.elder_pending||u.honor_pending) return '<span class="qc-tag">审核中</span>';
  return '<button class="qc-btn" onclick="applyElder()">申请长老</button> <a class="qc-btn" href="/#charForm">荣誉长老 / 妖王</a>';
}
function scribeBtn(u){
  if(u.edit_role==='scribe'||u.is_admin) return '<span class="qc-tag qc-tag--accent">已有编辑权限</span>';
  if(u.scribe_pending) return '<span class="qc-tag">审核中</span>';
  return '<button class="qc-btn" onclick="applyScribe()">申请编辑</button>';
}
function exemptBtn(u,type){
  const has = type==='age' ? u.exempt_age : u.exempt_skill;
  const pend = type==='age' ? u.exempt_age_pending : u.exempt_skill_pending;
  if(has) return '<span class="qc-tag qc-tag--accent">已突破</span>';
  if(pend) return '<span class="qc-tag">审核中</span>';
  return `<button class="qc-btn" onclick="applyExempt('${type}')">申请</button>`;
}
async function applyExempt(type){
  const label = type==='age' ? '突破年龄限制' : '突破技能选择限制';
  const msg=(prompt(`申请${label}的理由（选填）：`)||'').trim();
  const err=document.getElementById('applyErr'); err.textContent='';
  try{
    const r=await fetch('/api/exempt/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,message:msg})});
    const d=await r.json();
    if(d.ok){alert('✔ '+(d.msg||'申请已提交，等待审批。')); init();}
    else err.textContent=d.error||'申请失败';
  }catch(e){err.textContent='网络错误';}
}
async function doRename(){
  const nn=(document.getElementById('renameInput').value||'').trim();
  const err=document.getElementById('renameErr'); err.textContent='';
  if(!nn){err.textContent='请输入新昵称';return;}
  try{

function currentThemeVals(){
  let p=(document.getElementById('tpHex').value||'').trim();
  let a=(document.getElementById('taHex').value||'').trim();
  if(!/^#[0-9a-fA-F]{6}$/.test(p)) p='#f5f0e8';
  if(!/^#[0-9a-fA-F]{6}$/.test(a)) a='#5a9e8f';
  p=p.toLowerCase(); a=a.toLowerCase();
  document.getElementById('tp').value=p;
  document.getElementById('ta').value=a;
  document.getElementById('tpHex').value=p;
  document.getElementById('taHex').value=a;
  return {p:p,a:a};
}
function updatePrev(){
  const {p,a}=currentThemeVals();
  const prev=document.getElementById('themePrev');
  if(!prev) return;
  prev.style.background=p;
  prev.innerHTML=`<span class="qc-btn" style="background:${a};border-color:${a};color:var(--qc-on-accent);">预览按钮</span> <span class="qc-btn qc-btn--ghost" style="border-color:${a};color:${a};background:transparent;">描边</span> <span style="margin-left:8px;font-size:12px;color:${a};">${a}</span>`;
  document.querySelectorAll('#schemeGrid .chip').forEach(ch=>{
    const s=COLOR_SCHEMES[+ch.dataset.i];
    if(s) ch.classList.toggle('on', s.primary.toLowerCase()===p && s.accent.toLowerCase()===a);
  });
}
function syncThemeInputs(){
  const src=document.activeElement;
  const tp=document.getElementById('tp'), tpHex=document.getElementById('tpHex');
  const ta=document.getElementById('ta'), taHex=document.getElementById('taHex');
  if(src===tp) tpHex.value=tp.value;
  if(src===ta) taHex.value=ta.value;
  if(src===tpHex && /^#[0-9a-fA-F]{6}$/.test(tpHex.value.trim())) tp.value=tpHex.value.trim();
  if(src===taHex && /^#[0-9a-fA-F]{6}$/.test(taHex.value.trim())) ta.value=taHex.value.trim();
  updatePrev();
}
function pickScheme(i){
  const s=COLOR_SCHEMES[i];
  if(!s) return;
  document.getElementById('tp').value=s.primary;
  document.getElementById('ta').value=s.accent;
  document.getElementById('tpHex').value=s.primary;
  document.getElementById('taHex').value=s.accent;
  updatePrev();
}
async function saveTheme(){
  const err=document.getElementById('themeErr'); err.textContent='';
  const hint=document.getElementById('themeHint'); hint.textContent='';
  const vals=currentThemeVals();
  try{
    const r=await fetch('/api/user/theme',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({primary:vals.p,accent:vals.a})});
    const d=await r.json();
    if(d.ok){hint.textContent='✔ 配色已保存：psy 题库站等子站登录后将跟随该配色。'; updatePrev();}
    else err.textContent=d.error||'保存失败';
  }catch(e){err.textContent='网络错误';}
}
function resetTheme(){
  document.getElementById('tp').value='#f5f0e8';
  document.getElementById('ta').value='#5a9e8f';
  document.getElementById('tpHex').value='#f5f0e8';
  document.getElementById('taHex').value='#5a9e8f';
  updatePrev();
  saveTheme();
}
