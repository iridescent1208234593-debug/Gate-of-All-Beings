<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/shared/site-domains/index.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>官方角色档案 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="/design-system/design-system.css">
<style>
:root{--bg:#f5f0e8;--panel:#fbf8f2;--border:#d4cfbe;--text:#3a4a3e;--dim:#5a6e5e;--accent:#5a9e8f;--gold:#d4a840;--danger:#b3543f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;padding:48px 16px 60px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:22px;letter-spacing:3px;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:13px;margin-bottom:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:200px;font-family:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-family:inherit;font-size:12px;cursor:pointer;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--dim);transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{color:var(--dim);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit;display:block;content-visibility:auto;contain-intrinsic-size:200px 260px}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.load-more{display:block;margin:18px auto 0;font-family:inherit;font-size:13px;cursor:pointer;padding:9px 30px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);transition:all .15s}
.load-more:hover{background:var(--accent);color:#fff}
.back{display:inline-block;margin-bottom:12px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
.scribe-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px;padding:14px 18px;border:1px solid rgba(212,168,64,.4);border-radius:10px;background:rgba(212,168,64,.07)}
.scribe-banner .sb-text{flex:1;min-width:220px}
.scribe-banner .sb-text strong{display:block;font-size:15px;color:var(--gold);margin-bottom:3px;letter-spacing:1px}
.scribe-banner .sb-text span{font-size:13px;color:var(--text);line-height:1.7}
.scribe-banner .sb-btn{font-family:inherit;font-size:13px;cursor:pointer;padding:8px 20px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#fff;transition:all .15s;white-space:nowrap}
.scribe-banner .sb-btn:hover{filter:brightness(1.08)}
.scribe-banner .sb-ghost{background:transparent;color:var(--gold)}
.scribe-banner .sb-ghost:hover{background:rgba(212,168,64,.12)}
.code-row{flex-basis:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.code-row[hidden]{display:none}
.code-row input{font-family:inherit;font-size:14px;letter-spacing:3px;width:190px;padding:8px 12px;border:1px solid rgba(212,168,64,.55);border-radius:8px;background:var(--panel);color:var(--text);outline:none}
.code-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,64,.18)}
.code-row .code-msg{font-size:12px;color:var(--dim);flex:1;min-width:180px}
.code-row .code-msg.err{color:var(--danger)}
.relation-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px;padding:16px 18px;border:1px solid rgba(90,158,143,.45);border-radius:10px;background:linear-gradient(120deg,rgba(90,158,143,.10),rgba(212,168,64,.08));box-shadow:0 2px 8px rgba(30,40,34,.10);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.relation-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(30,40,34,.14);border-color:rgba(212,168,64,.6)}
.relation-card .rc-icon{width:46px;height:46px;flex:none}
.relation-card .rc-text{flex:1;min-width:220px}
.relation-card .rc-text strong{display:block;font-size:16px;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
.relation-card .rc-text span{font-size:13px;color:var(--text);line-height:1.7}
.relation-card .rc-btn{font-family:inherit;font-size:13px;cursor:pointer;padding:8px 20px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#fff;transition:all .15s;white-space:nowrap}
.relation-card:hover .rc-btn{filter:brightness(1.08)}
.card-img{width:100%;height:220px;object-fit:contain;background:#ece4d6;display:block}
.card-body{padding:10px 12px 12px}
.card-name{font-size:15px;font-weight:600;margin-bottom:2px}
.card-meta{font-size:12px;color:var(--dim);line-height:1.5}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;margin-top:4px}
.badge.high{background:rgba(90,158,143,.15);color:var(--accent);border:1px solid rgba(90,158,143,.3)}
.badge.mid{background:rgba(212,168,64,.12);color:var(--gold);border:1px solid rgba(212,168,64,.3)}
.badge.low{background:rgba(179,84,63,.10);color:var(--danger);border:1px solid rgba(179,84,63,.3)}
.loading{text-align:center;padding:60px;color:var(--dim)}
.empty{text-align:center;padding:60px;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回人设登记</a>
  <div data-archive-volume="official_main"></div>
  <a class="relation-card" href="relation.html">
    <svg class="rc-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 9 L14 16 M24 9 L34 16 M24 9 L24 28 M14 16 L14 30 M34 16 L34 30 M14 30 L24 40 M34 30 L24 40" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" opacity=".6"/>
      <circle cx="24" cy="9" r="3.4" fill="var(--gold)" stroke="#fff" stroke-width="1.2"/>
      <circle cx="14" cy="16" r="3" fill="var(--accent)" stroke="#fff" stroke-width="1.2"/>
      <circle cx="34" cy="16" r="3" fill="var(--accent)" stroke="#fff" stroke-width="1.2"/>
      <circle cx="14" cy="30" r="3" fill="var(--accent)" stroke="#fff" stroke-width="1.2" opacity=".85"/>
      <circle cx="34" cy="30" r="3" fill="var(--accent)" stroke="#fff" stroke-width="1.2" opacity=".85"/>
      <circle cx="24" cy="40" r="3.4" fill="var(--gold)" stroke="#fff" stroke-width="1.2"/>
    </svg>
    <div class="rc-text">
      <strong>人物关系图</strong>
      <span>罗小黑战记 · 官方角色关系网络 · 拖拽节点 / 滚轮缩放 / 点击节点查看角色</span>
    </div>
    <span class="rc-btn">进入 →</span>
  </a>
  <h1>官方角色档案 <span style="font-size:14px;font-weight:400;color:var(--dim)">主册</span></h1>
  <p class="subtitle">罗小黑战记 · 全部已出场角色 · 数据来自世界观数据库</p>
  <div class="scribe-banner" id="scribeBanner">
    <div class="sb-text">
      <strong>成为「编辑」，一起维护官方设定</strong>
      <span>熟悉《罗小黑战记》的你，可以申请成为编辑：审查他人提交的角色补充、修订与勘误官方设定，让数据库更准确、更完整。</span>
    </div>
    <button class="sb-btn" onclick="applyScribe()">申请成为编辑</button>
    <button class="sb-btn sb-ghost" type="button" id="codeToggle" onclick="toggleCode()">我有编辑码</button>
    <form class="code-row" id="codeRow" hidden onsubmit="return submitCode(event)">
      <input id="codeInput" type="text" inputmode="numeric" autocomplete="off" maxlength="32" placeholder="输入编辑码" aria-label="编辑码">
      <button class="sb-btn" type="submit" id="codeBtn">验证</button>
      <span class="code-msg" id="codeMsg">有编辑码的话，无需申请即可直接成为编辑。</span>
    </form>
  </div>
  <a class="scribe-banner" href="stickers.html" style="text-decoration:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px;padding:14px 18px;border:1px solid rgba(90,158,143,.4);border-radius:10px;background:rgba(90,158,143,.07);">
    <div class="sb-text">
      <strong style="color:var(--accent);">罗小黑表情包收录</strong>
      <span>汇集小黑与伙伴们的趣味表情包，点击查看 / 投稿。</span>
    </div>
    <span class="sb-btn" style="display:inline-block;">进入 →</span>
  </a>
  <div class="toolbar">
    <input class="search" id="search" placeholder="搜索角色名…" oninput="onSearch(this.value)">
    <div class="filter-btns">
      <button class="fbtn active" onclick="setFilter(0,8,this)">全部</button>
      <button class="fbtn" onclick="setFilter(1,3,this)">设定少</button>
      <button class="fbtn" onclick="setFilter(4,5,this)">设定中</button>
      <button class="fbtn" onclick="setFilter(6,8,this)">设定多</button>
    </div>
  </div>
  <div class="stat" id="stat"></div>
  <div class="grid" id="grid"><div class="loading">加载中…</div></div>
  <button class="load-more" id="loadMore" style="display:none" onclick="loadMore()">加载更多</button>
  <div id="unclassWrap" style="display:none;margin-top:36px;">
    <h2 style="font-size:16px;letter-spacing:2px;border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:14px;">未分类图片 <span style="font-size:12px;color:var(--dim);font-weight:400;">（被标记为「实为其他角色」的图、以及已删除错误关联的角色图片，待重新归类）</span></h2>
    <div id="unclassBox" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
  </div>
</div>
<script src="reactions-fx.js?v=20261027z"></script>
<script src="group-reminder.js?v=20261027z"></script>
<script src="archive-volumes.js?v=20261027z"></script>
<script>
let curMin=0, curMax=8, curQ='', timer=null;
const PAGE=30;
let curPage=1, loaded=0, total=0, loading=false;
const badgeCls = c => c>=6?'high':c>=4?'mid':'low';
const badgeText = c => c>=6?'设定完整':c>=4?'部分设定':'待补充';

function cardHTML(c){
  const imgSrc = c.thumb_path ? `/api/official/img?cid=${c.id}&n=0&t=1` : '';
  const img = imgSrc
    ? `<img class="card-img" data-original-image src="${imgSrc}" alt="${c.name}" loading="lazy" decoding="async" onerror="this.style.display='none'">`
    : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:40px;">${c.name ? c.name[0] : '?'}</div>`;
  return `<a class="card" data-cid="${c.id}" href="char.html?id=${c.id}">
    ${img}
    <div class="card-body">
      <div class="card-name">${esc(c.name)}</div>
      <div class="card-meta">${esc(c.type||'')}${c.species?' · '+esc(c.species):''}</div>
      <span class="badge ${badgeCls(c.completeness)}">${c.completeness}/8 · ${badgeText(c.completeness)}</span>
      ${RFX.bar('official',c.id)}
    </div>
  </a>`;
}
async function load(reset=true){
  if(loading) return;
  const grid=document.getElementById('grid');
  if(reset){ curPage=1; loaded=0; grid.innerHTML='<div class="loading">加载中…</div>'; }
  loading=true;
  const params=new URLSearchParams({min:curMin, max:curMax, limit:PAGE, page:curPage});
  if(curQ) params.set('q', curQ);
  try{
    const r=await fetch('/api/official/characters?'+params);
    const d=await r.json();
    const list=d.characters||[]; total=d.total||0;
    if(reset){ grid.innerHTML=''; loaded=0; }
    document.getElementById('stat').textContent=`共 ${total} 个角色`;
    if(reset && !list.length){ grid.innerHTML='<div class="empty">没有匹配的角色。</div>'; hideMore(); loading=false; return; }
    grid.insertAdjacentHTML('beforeend', list.map(cardHTML).join(''));
    loaded+=list.length;
    updateMore();
  }catch(e){
    if(reset) grid.innerHTML='<div class="empty">加载失败，请刷新重试。</div>';
  }
  loading=false;
}
function loadMore(){ curPage++; load(false); }
function updateMore(){
  const b=document.getElementById('loadMore');
  if(loaded<total){ b.style.display='block'; b.textContent=`加载更多 · 已显示 ${loaded}/${total}`; }
  else hideMore();
}
function hideMore(){ document.getElementById('loadMore').style.display='none'; }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setFilter(min,max,btn){
  curMin=min; curMax=max;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  load(true);
}
function onSearch(v){
  curQ=(v||'').trim();
  clearTimeout(timer);
  timer=setTimeout(()=>load(true), 300);
}
async function applyScribe(){
  try{
    const u=await (await fetch('/api/user')).json();
    if(!u.logged_in){ location.href='/?openauth=1'; return; }
    if(!confirm('申请【编辑】前请确认：\n1. 已加入西木会馆交流群（QQ群：878029597，微信群二维码见页脚/画廊）；\n2. 编辑权限可修改、删除官方设定，请务必谨慎，避免误删数据。\n确认继续申请？'))return;
    const msg=(prompt('简单介绍下你为什么适合成为编辑（选填）：')||'').trim();
    const r=await fetch('/api/official/scribe-apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json();
    alert(d.ok? '✔ '+(d.msg||'申请已提交，等待审核') : '⚠ '+(d.error||'申请失败'));
  }catch(e){ alert('⚠ 网络错误，请稍后再试'); }
}
function toggleCode(){
  const row=document.getElementById('codeRow'); row.hidden=!row.hidden;
  if(!row.hidden) document.getElementById('codeInput').focus();
}
async function submitCode(e){
  e.preventDefault();
  const input=document.getElementById('codeInput'), msg=document.getElementById('codeMsg'), btn=document.getElementById('codeBtn');
  const code=input.value.trim();
  if(!code){ msg.className='code-msg err'; msg.textContent='请先输入编辑码～'; return false; }
  btn.disabled=true; msg.className='code-msg'; msg.textContent='验证中…';
  try{
    const u=await (await fetch('/api/user')).json();
    if(!u.logged_in){ msg.textContent='需要先登录哦，正在带你去登录页…'; setTimeout(()=>location.href='/?openauth=1',900); return false; }
    const r=await fetch('/api/editor/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const d=await r.json();
    if(d.ok){
      input.value=''; document.getElementById('codeRow').hidden=true;
      markScribe(true);
      if(window.RFX) RFX.toast(d.already?'你已经是编辑啦 ✨':'验证成功，欢迎成为编辑 ✨');
      HuiguanGroup.show({title:'验证成功，欢迎你，编辑！',lead:'编辑可以修改、补充官方设定。'});
    }else{ msg.className='code-msg err'; msg.textContent=d.error||'验证失败，请稍后再试'; }
  }catch(err){ msg.className='code-msg err'; msg.textContent='网络不太顺，请稍后再试～'; }
  finally{ btn.disabled=false; }
  return false;
}
function markScribe(scribeOnly){
  const b=document.getElementById('scribeBanner'); if(!b) return;
  b.querySelector('.sb-text strong').textContent = scribeOnly ? '你已是编辑，感谢你维护官方设定' : '你已是管理员，可直接修订官方设定';
  b.querySelectorAll('.sb-btn,.code-row').forEach(el=>el.style.display='none');
}
async function initScribe(){
  try{
    const u=await (await fetch('/api/user')).json();
    if(u.logged_in && (u.is_admin || u.edit_role==='scribe')) markScribe(!u.is_admin);
  }catch(e){}
}
initScribe();
async function loadUnclassified(){
  try{
    const r=await fetch('/api/official/unclassified'); const d=await r.json();
    const imgs=d.images||[];
    const wrap=document.getElementById('unclassWrap');
    if(!imgs.length){wrap.style.display='none';return;}
    wrap.style.display='block';
    document.getElementById('unclassBox').innerHTML=imgs.map(im=>
      `<div style="position:relative" title="${esc(im.reason||'待归类')}"><img data-original-image src="/api/official/unclassified-img?id=${im.id}" style="width:110px;height:110px;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#ece4d6" loading="lazy"></div>`).join('');
  }catch(e){}
}
loadUnclassified();
RFX.load('official').then(()=>load(true));
</script>
<script src="/shared/shared-ui/site-nav.js?v=20261027z"></script>
<script src="/original-image-viewer.js?v=20261027z"></script>
</body>
</html>
