<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/shared/site-domains/index.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>用户管理 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<style>
  :root {
    --bg: #f5f0e8;
    --panel: #fbf8f2;
    --border: #d4cfbe;
    --text: #3a4a3e;
    --text-dim: #7a8a7e;
    --accent: #5a9e8f;
    --gold: #d4a840;
    --danger: #b3543f;
    --outline: #2a3a2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
    min-height: 100vh; padding: 40px 20px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 26px; }
  h1 { font-size: 22px; letter-spacing: 3px; font-weight: 600; }
  h1 small { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; margin-left: 10px; }
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 18px 0 14px; color: var(--text-dim); font-size: 13px;
  }
  .toolbar .stat b { color: var(--text); }
  .btn {
    font-family: inherit; font-size: 13px; cursor: pointer;
    padding: 6px 14px; border-radius: 4px; transition: all 0.15s;
    background: transparent; border: 1px solid var(--border); color: var(--text);
    text-decoration: none; display: inline-block;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .state-box {
    margin-top: 60px; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 2.2;
  }
  .state-box a { color: var(--gold); }
  table {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    background: rgba(212,168,64,0.10); color: var(--text);
    font-weight: 600; letter-spacing: 1px; font-size: 12px; white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(90,158,143,0.05); }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 3px;
    font-size: 11px; border: 1px solid var(--border); color: var(--text-dim);
    white-space: nowrap;
  }
  .tag.local { border-color: var(--accent); color: var(--accent); }
  .tag.usso { border-color: var(--gold); color: var(--gold); }
  .tag.admin { background: rgba(212,168,64,0.15); border-color: var(--gold); color: var(--gold); }
  .tag.banned { background: rgba(179,84,63,0.10); border-color: var(--danger); color: var(--danger); }
  .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .op {
    font-family: inherit; font-size: 12px; cursor: pointer;
    padding: 3px 10px; border-radius: 3px;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    transition: all 0.15s;
  }
  .op:hover { border-color: var(--accent); color: var(--accent); }
  .op.danger:hover { border-color: var(--danger); color: var(--danger); }
  .op:disabled { opacity: 0.35; cursor: not-allowed; }
  .dim { color: var(--text-dim); }
  .search {
    font-family: inherit; font-size: 13px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--panel);
    color: var(--text); outline: none; min-width: 180px;
  }
  .search:focus { border-color: var(--accent); }
  select.role-sel {
    font-family: inherit; font-size: 12px; padding: 3px 6px;
    border: 1px solid var(--border); border-radius: 3px; background: var(--panel); color: var(--text);
  }
  tr.chars-row td { background: rgba(212,168,64,0.05); }
  .char-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px;
    margin: 3px 6px 3px 0; font-size: 12px; background: var(--panel); text-decoration: none; color: var(--text);
  }
  .char-chip:hover { border-color: var(--accent); color: var(--accent); }
  .expander { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .cnt { color: var(--gold); font-weight: 600; }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .self { outline: 1px dashed var(--gold-dim, #c9b06a); }
  @media (max-width: 720px) {
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>审核中心<small>西木会馆 · www.iridescently.cn</small></h1>
  </header>
  <div class="toolbar">
    <span style="flex:1"></span>
    <a class="btn" id="designSystemLink" href="/design-system/index.html" hidden>设计系统</a>
    <a class="btn" href="/">← 返回会馆</a>
    <a class="btn" href="/member.html">成员管理</a>
    <button class="btn primary" onclick="refresh()">刷新</button>
  </div>
  <div class="err" id="err"></div>
  <div id="content">
    <div class="state-box">加载中…</div>
  </div>
  <h2 style="margin:30px 0 12px;font-size:16px;letter-spacing:2px;">长老申请</h2>
  <div id="reqBox"><div class="state-box" style="margin-top:0;">加载中…</div></div>
  <h2 style="margin:30px 0 12px;font-size:16px;letter-spacing:2px;">妖王申请（自述不足 50 字）</h2>
  <div id="honorBox"><div class="state-box" style="margin-top:0;">加载中…</div></div>
  <h2 style="margin:30px 0 12px;font-size:16px;letter-spacing:2px;">补充审核</h2>
  <div id="suppBox"><div class="state-box" style="margin-top:0;">加载中…</div></div>
  <h2 style="margin:30px 0 12px;font-size:16px;letter-spacing:2px;">编辑申请</h2>
  <div id="scribeBox"><div class="state-box" style="margin-top:0;">加载中…</div></div>
  <h2 style="margin:30px 0 12px;font-size:16px;letter-spacing:2px;">豁免申请</h2>
  <div id="exemptBox"><div class="state-box" style="margin-top:0;">加载中…</div></div>
</div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function fmtTime(s) {
  if (!s) return '—';
  return s.replace('T', ' ').replace(/\+\d{2}:\d{2}$/, '');
}

let selfInfo = null;

async function init() {
  const content = document.getElementById('content');
  try {
    const r = await fetch('/api/user');
    const u = await r.json();
    if (!u.logged_in) {
      content.innerHTML = '<div class="state-box">请先登录后再访问本页面。<br><a href="/">回到西木会馆登录</a></div>';
      return;
    }
    if (!u.is_admin) {
      content.innerHTML = '<div class="state-box">需要管理员权限。<br>如果你认为这是误判，请联系站长。</div>';
      return;
    }
    document.getElementById('designSystemLink').hidden = false;
    selfInfo = { kind: u.kind, uid: String(u.user_id) };
    await loadUsers();
    loadRequests();
    loadHonorRequests();
    loadSupplements();
    loadScribeRequests();
    loadExemptRequests();
  } catch(e) {
    content.innerHTML = '<div class="state-box">加载失败，请刷新重试。</div>';
  }
}

let allUsers = [];
let charMap = {};
let searchTerm = '';
const expanded = new Set();

async function loadUsers() {
  const content = document.getElementById('content');
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const [ru, rc] = await Promise.all([fetch('/api/admin/users'), fetch('/api/admin/characters')]);
    const d = await ru.json();
    const cd = rc.ok ? await rc.json() : { characters: [] };
    if (!ru.ok) { err.textContent = d.error || '加载失败'; return; }
    allUsers = d.users || [];
    selfInfo = d.self || selfInfo;
    charMap = {};
    (cd.characters || []).forEach(c => { (charMap[c.owner] = charMap[c.owner] || []).push(c); });
    renderUsers();
  } catch(e) {
    err.textContent = '网络错误，请重试';
  }
}
function ownerChars(u) {
  const key = u.kind === 'local' ? 'local:' + u.uid : String(u.uid);
  return charMap[key] || [];
}
function onSearch(v) { searchTerm = (v || '').trim().toLowerCase(); renderUsers(); }
function refresh() { loadUsers(); loadRequests(); loadHonorRequests(); loadSupplements(); loadScribeRequests(); loadExemptRequests(); }

function renderUsers() {
  const content = document.getElementById('content');
  const locals = allUsers.filter(u => u.kind === 'local').length;
  const withChars = allUsers.filter(u => ownerChars(u).length > 0).length;
  content.innerHTML = `
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:14px;color:var(--text);">
      共 <b>${allUsers.length}</b> 人注册（站内 ${locals} · USSO ${allUsers.length - locals}）· 有设表 <b>${withChars}</b>
      <a href="/member.html" style="margin-left:14px;color:var(--accent);text-decoration:none;font-weight:600;">前往成员管理 →</a>
    </div>`;
}
function roleTagText(role) {
  return role === 'admin' ? '<span class="tag admin">管理员</span>'
    : role === 'elder' ? '<span class="tag admin">长老</span>'
    : '<span class="tag local">执行者</span>';
}
function roleSelect(u) {
  const opts = ['executor', 'elder', 'admin'].map(r =>
    `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r === 'admin' ? '管理员' : r === 'elder' ? '长老' : '执行者'}</option>`).join('');
  return `<select class="role-sel" onchange="setRole('${u.kind}','${u.uid}',this.value)">${opts}</select>`;
}
function toggleExpand(kind, uid) {
  const k = kind + ':' + uid;
  if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
  renderUsers();
}

async function adminPost(url, payload) {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (!d.ok) { err.textContent = d.error || '操作失败'; return false; }
    return true;
  } catch(e) {
    err.textContent = '网络错误';
    return false;
  }
}

async function setStatus(kind, uid, status) {
  const verb = status === 'banned' ? '封禁' : '解封';
  if (!confirm(`确定要${verb}该用户吗？`)) return;
  if (await adminPost('/api/admin/user/update', { kind, uid, set: { status } })) loadUsers();
}
async function setRole(kind, uid, role) {
  if (await adminPost('/api/admin/user/update', { kind, uid, set: { role } })) { loadUsers(); }
}

async function loadRequests() {
  const box = document.getElementById('reqBox');
  if (!box) return;
  try {
    const r = await fetch('/api/admin/elder-requests');
    const d = await r.json();
    if (!r.ok) { box.innerHTML = ''; return; }
    const reqs = d.requests || [];
    if (!reqs.length) { box.innerHTML = '<div class="state-box" style="margin-top:0;">暂无待审的长老申请。</div>'; return; }
    box.innerHTML = reqs.map(q => `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;">
        <strong>${escapeHtml(q.name || q.uid)}</strong>
        <span class="dim">${q.kind === 'local' ? '站内' : 'USSO'} · ${fmtTime(q.created_at)}</span>
        <span class="dim" style="flex:1;">${escapeHtml(q.message || '（无理由）')}</span>
        <button class="op" onclick="decideReq(${q.id},true)">同意</button>
        <button class="op danger" onclick="decideReq(${q.id},false)">驳回</button>
      </div>`).join('');
  } catch(e) { box.innerHTML = ''; }
}
async function decideReq(id, approve) {
  const verb = approve ? '同意' : '驳回';
  if (!confirm(`确定要${verb}该长老申请吗？`)) return;
  if (await adminPost('/api/admin/elder/decide', { id, approve })) { loadRequests(); loadUsers(); }
}

async function loadHonorRequests() {
  const box = document.getElementById('honorBox');
  if (!box) return;
  try {
    const r = await fetch('/api/admin/honor-requests');
    const d = await r.json();
    if (!r.ok) { box.innerHTML = ''; return; }
    const reqs = d.requests || [];
    if (!reqs.length) { box.innerHTML = '<div class="state-box" style="margin-top:0;">暂无待审的妖王申请。</div>'; return; }
    box.innerHTML = reqs.map(q => `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;">
        <strong>${escapeHtml(q.name || q.uid)}</strong>
        <span class="dim">${q.kind === 'local' ? '站内' : 'USSO'} · ${fmtTime(q.created_at)}</span>
        <span class="tag local">别称：${escapeHtml(q.alias || '妖王（默认）')}</span>
        <span class="dim" style="flex:1;min-width:200px;">${escapeHtml(q.reason || '')}</span>
        <button class="op" onclick="decideHonor(${q.id},true)">加冕</button>
        <button class="op danger" onclick="decideHonor(${q.id},false)">驳回</button>
      </div>`).join('');
  } catch(e) { box.innerHTML = ''; }
}
async function decideHonor(id, approve) {
  if (!confirm(`确定要${approve ? '加冕' : '驳回'}该妖王申请吗？`)) return;
  if (await adminPost('/api/admin/honor/decide', { id, approve })) loadHonorRequests();
}

async function loadSupplements() {
  const box = document.getElementById('suppBox');
  if (!box) return;
  try {
    const r = await fetch('/api/admin/supplements');
    const d = await r.json();
    if (!r.ok) { box.innerHTML = '<div class="state-box" style="margin-top:0;">加载失败</div>'; return; }
    const list = d.supplements || [];
    if (!list.length) { box.innerHTML = '<div class="state-box" style="margin-top:0;">暂无待审补充。</div>'; return; }
    const fieldNames = {personality:'性格',appearance:'外貌',affiliation:'所属',age:'年龄',story_summary:'故事',abilities_summary:'能力摘要',master:'师父',height:'身高',eye_color:'瞳色',hair_color:'发色',residence:'住所',birthday:'生日',notes:'备注'};
    box.innerHTML = `<div style="font-size:12px;color:var(--dim);margin-bottom:8px;">待审 <strong style="color:var(--gold)">${list.length}</strong> 条</div>` + list.map(s => `
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:6px;margin-bottom:10px;background:var(--panel);">
        <div style="flex:1;min-width:220px;">
          <div style="margin-bottom:6px;"><strong>${escapeHtml(s.character_name)}</strong>
            <span class="tag local">${escapeHtml(fieldNames[s.field_name]||s.field_name)}</span>
            <span class="dim" style="margin-left:8px;">${escapeHtml(s.user_name||'未知')} · ${fmtTime(s.submitted_at)}</span></div>
          <div style="font-size:12px;color:var(--dim);padding:4px 8px;background:rgba(179,84,63,.06);border-radius:4px;margin-bottom:4px;">旧：${escapeHtml((s.old_value||'（空）').substring(0,90))}${s.old_value&&s.old_value.length>90?'…':''}</div>
          <div style="font-size:13px;padding:4px 8px;background:rgba(90,158,143,.08);border-radius:4px;">新：${escapeHtml((s.new_value||'').substring(0,140))}${s.new_value&&s.new_value.length>140?'…':''}</div>
          ${s.message?`<div style="font-size:12px;color:var(--dim);margin-top:4px;">说明：${escapeHtml(s.message)}</div>`:''}
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="op" onclick="decideSupplement(${s.id},true)">批准</button>
          <button class="op danger" onclick="decideSupplement(${s.id},false)">驳回</button>
        </div>
      </div>`).join('');
  } catch(e) { box.innerHTML = '<div class="state-box" style="margin-top:0;">加载失败</div>'; }
}
async function decideSupplement(id, approve) {
  const verb = approve ? '批准' : '驳回';
  if (!confirm(`确定${verb}这条补充吗？${approve?'批准后将直接写入数据库。':''}`)) return;
  if (await adminPost('/api/admin/supplement/decide', { id, approve })) loadSupplements();
}

async function loadScribeRequests() {
  const box = document.getElementById('scribeBox');
  if (!box) return;
  try {
    const r = await fetch('/api/admin/scribe-requests');
    const d = await r.json();
    if (!r.ok) { box.innerHTML = '<div class="state-box" style="margin-top:0;">加载失败</div>'; return; }
    const list = d.requests || [];
    if (!list.length) { box.innerHTML = '<div class="state-box" style="margin-top:0;">暂无编辑申请。</div>'; return; }
    box.innerHTML = list.map(q => `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;">
        <strong>${escapeHtml(q.user_name||q.uid)}</strong>
        <span class="dim">${q.user_kind==='local'?'站内':'USSO'} · ${fmtTime(q.created_at)}</span>
        <span class="dim" style="flex:1;">${escapeHtml(q.message||'（无说明）')}</span>
        <button class="op" onclick="decideScribe(${q.id},true)">批准</button>
        <button class="op danger" onclick="decideScribe(${q.id},false)">驳回</button>
      </div>`).join('');
  } catch(e) { box.innerHTML = '<div class="state-box" style="margin-top:0;">加载失败</div>'; }
}
async function decideScribe(id, approve) {
  const verb = approve ? '批准' : '驳回';
  if (!confirm(`确定${verb}该编辑申请吗？${approve?'批准后该用户可直接编辑角色设定。':''}`)) return;
  if (await adminPost('/api/admin/scribe/decide', { id, approve })) loadScribeRequests();
}

async function loadExemptRequests() {
  const box = document.getElementById('exemptBox');
  if (!box) return;
  try {
    const r = await fetch('/api/admin/exempt-requests');
    const d = await r.json();
    if (!r.ok) { box.innerHTML = '<div class="state-box" style="margin-top:0;">加载失败</div>'; return; }
    const list = d.requests || [];
    if (!list.length) { box.innerHTML = '<div class="state-box" style="margin-top:0;">暂无豁免申请。</div>'; return; }
    const typeTxt = t => t === 'age' ? '突破年龄限制' : '突破技能选择限制';
    box.innerHTML = list.map(q => `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;">
        <strong>${escapeHtml(q.user_name||q.user_uid)}</strong>
        <span class="tag gold">${typeTxt(q.type)}</span>
        <span class="dim">${q.user_kind==='local'?'站内':'USSO'} · ${fmtTime(q.created_at)}</span>
        <span class="dim" style="flex:1;">${escapeHtml(q.message||'（无说明）')}</span>
        <button class="op" onclick="decideExempt(${q.id},true)">批准</button>
        <button class="op danger" onclick="decideExempt(${q.id},false)">驳回</button>
      </div>`).join('');
  } catch(e) { box.innerHTML = '<div class="state-box" style="margin-top:0;">加载失败</div>'; }
}
async function decideExempt(id, approve) {
  const verb = approve ? '批准' : '驳回';
  if (!confirm(`确定${verb}该豁免申请吗？${approve?'批准后该用户可在登记表勾选突破相应限制。':''}`)) return;
  if (await adminPost('/api/admin/exempt/decide', { id, approve })) loadExemptRequests();
}
async function delUser(kind, uid, name) {
  if (!confirm(`确定要删除用户「${name}」吗？该用户的账号和角色卡数据将一并删除，无法恢复。`)) return;
  if (await adminPost('/api/admin/user/delete', { kind, uid })) loadUsers();
}

init();
</script>
</body>
</html>
