<!doctype html>
<html lang="zh-CN">
  <head>
<script src="/shared/site-domains/index.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Iridescently：收藏罗小黑战记节气贺图的线上图库，让画面里的色彩慢慢铺展成氛围。"
    />
    <meta name="theme-color" content="#416989" />
    <link rel="canonical" href="https://iridescently.xyz/gallery.html" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="./styles/home.css" />
    <link rel="stylesheet" href="./styles/chrome.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <title>Iridescently · 节气之间，自有天气</title>
  
    <!-- MXANA 站点统计：只在公开图库页加载，不进入账号/登录页 -->
    <script>
      (function () {
        try {
          var url = new URL(location.href), dirty = false;
          ["code", "token", "state", "email", "uid", "openid"].forEach(function (key) {
            if (url.searchParams.has(key)) { url.searchParams.delete(key); dirty = true; }
          });
          if (dirty) history.replaceState(null, "", url.pathname + url.search + url.hash);
        } catch (e) {}
        var s = document.createElement("script");
        s.id = "MXA_COLLECT";
        s.async = true;
        s.src = "/__mxana-sdk.js";
        s.onload = function () {
          if (window.MXA && typeof window.MXA.init === "function") {
            window.MXA.init({ id: "c2-lCwEAOte", useHeatMap: true, useHash: true, useErrorLog: true });
          }
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body class="site-home" data-gallery-state="starting">
    <a class="skip-link" href="#gallery">跳至节气图库</a>

    <canvas
      class="webgl"
      aria-label="Iridescently 节气贺图图库。使用滚轮、轻扫或方向键浏览。"
    ></canvas>

    <div class="content" aria-hidden="true"></div>

    <main
      class="gallery-stage"
      id="gallery"
      tabindex="-1"
      aria-label="节气贺图图库"
    >
      <p
        class="gallery-loading"
        id="gallery-status"
        role="status"
        aria-live="polite"
      >
        <span class="gallery-loading__mark" aria-hidden="true"></span>
        <span class="gallery-loading__message">正在进入节气图库</span>
        <button class="gallery-loading__retry" type="button" hidden>
          重新连接
        </button>
      </p>

      <div class="gallery-controls" role="group" aria-label="浏览节气贺图">
        <button
          class="gallery-controls__step"
          type="button"
          data-gallery-step="previous"
          aria-label="上一张贺图"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m14.5 5-7 7 7 7" />
          </svg>
        </button>
        <button
          class="gallery-controls__autoplay"
          type="button"
          data-gallery-autoplay
          aria-label="开启自动播放"
          aria-pressed="false"
          title="开启自动播放"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path
              class="gallery-controls__play-icon"
              d="M6 3.8v12.4L16 10 6 3.8Z"
            />
            <path
              class="gallery-controls__pause-icon"
              d="M6.5 4.5v11m7-11v11"
            />
          </svg>
        </button>
        <div class="gallery-controls__hint">
          <span class="gallery-controls__count" data-gallery-count
            >384 张贺图</span
          >
          <span class="gallery-controls__desktop-hint"
            >滚动或使用方向键浏览</span
          >
          <span class="gallery-controls__mobile-hint">轻扫，继续浏览</span>
        </div>
        <button
          class="gallery-controls__step"
          type="button"
          data-gallery-step="next"
          aria-label="下一张贺图"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9.5 5 7 7-7 7" />
          </svg>
        </button>
      </div>
      <p class="gallery-capacity-note">
        <span class="gallery-capacity-note__line"><span data-capacity-copy>为了让图库更稳定地陪大家看下去，服务器已经扩容。个人项目资金有限，默认展示轻量画面；站长登录后可查看原图。谢谢理解。</span> <a data-gallery-original href="#" target="_blank" rel="noopener noreferrer" hidden>原图 ↗</a></span>
        <button type="button" data-capacity-dismiss>不再显示</button>
      </p>

      <div class="gallery-music" data-music-player>
        <button
          class="gallery-music__toggle"
          type="button"
          data-music-toggle
          aria-label="播放音乐"
          aria-pressed="false"
          aria-expanded="false"
          aria-controls="gallery-music-panel"
          title="单击播放或暂停，双击打开音乐控制"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M8 15V4l9-2v11" />
            <circle cx="5.5" cy="15.5" r="2.5" />
            <circle cx="14.5" cy="13.5" r="2.5" />
          </svg>
        </button>
        <div
          class="gallery-music__panel"
          id="gallery-music-panel"
          data-music-panel
          role="group"
          aria-label="音乐播放控制"
          hidden
        >
          <div class="gallery-music__track">
            <span class="gallery-music__eyebrow">正在播放</span>
            <span class="gallery-music__title" data-music-title>不再流浪</span>
            <span class="gallery-music__status" data-music-status aria-live="polite"></span>
          </div>
          <div class="gallery-music__transport">
            <button type="button" data-music-previous aria-label="上一首" title="上一首">‹</button>
            <button type="button" data-music-play aria-label="暂停音乐" aria-pressed="true" title="暂停音乐">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path class="gallery-music__play-icon" d="M6 3.8v12.4L16 10 6 3.8Z" />
                <path class="gallery-music__pause-icon" d="M6.5 4.5v11m7-11v11" />
              </svg>
            </button>
            <button type="button" data-music-next aria-label="下一首" title="下一首">›</button>
          </div>
          <div class="gallery-music__timeline">
            <output data-music-current>0:00</output>
            <input type="range" min="0" max="1000" step="1" value="0" data-music-seek aria-label="播放进度" />
            <output data-music-duration>0:00</output>
          </div>
          <audio data-music-audio preload="metadata" playsinline></audio>
        </div>
      </div>

      <div class="gallery-customizer">
        <button
          class="gallery-settings-toggle"
          type="button"
          data-gallery-settings-toggle
          aria-label="打开自定义设置"
          aria-expanded="false"
          aria-controls="gallery-settings-panel"
          title="自定义"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M4 5h12M4 10h12M4 15h12" />
            <circle cx="8" cy="5" r="1.7" />
            <circle cx="12" cy="10" r="1.7" />
            <circle cx="7" cy="15" r="1.7" />
          </svg>
        </button>
        <div
          class="gallery-settings"
          id="gallery-settings-panel"
          data-gallery-settings
          role="group"
          aria-label="自定义"
          hidden
        >
          <header class="gallery-settings__heading">
            <h2>自定义</h2>
            <button
              type="button"
              data-appearance-reset
              aria-label="恢复默认"
              title="恢复默认"
            >
              ↺
            </button>
          </header>
          <div class="gallery-settings__items">
            <label class="gallery-setting">
              <span>过渡</span>
              <input
                id="gallery-setting-transition"
                type="range"
                min="0"
                max="100"
                step="1"
                value="0"
                data-gallery-setting="transition"
              />
            </label>
            <label class="gallery-setting">
              <span>停留</span>
              <input
                id="gallery-setting-pause"
                type="range"
                min="0"
                max="100"
                step="1"
                value="100"
                data-gallery-setting="pause"
              />
            </label>
            <label class="gallery-setting gallery-setting--autoplay">
              <span>自动播放</span>
              <input
                id="gallery-setting-autoplay-seconds"
                type="range"
                min="1"
                max="10"
                step="0.5"
                value="4.5"
                data-gallery-setting="autoplaySeconds"
                aria-label="自动播放速度"
              />
              <output
                class="gallery-setting__value"
                data-gallery-setting-value="autoplaySeconds"
                aria-live="polite"
              >4.5 秒/张</output>
            </label>
            <label class="gallery-setting">
              <span>大小</span>
              <input
                id="gallery-setting-size"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="size"
              />
            </label>
            <label class="gallery-setting">
              <span>微动</span>
              <input
                id="gallery-setting-motion"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="motion"
              />
            </label>
            <label class="gallery-setting">
              <span>晕染</span>
              <input
                id="gallery-setting-atmosphere"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="atmosphere"
              />
            </label>
            <label class="gallery-setting">
              <span>颗粒</span>
              <input
                id="gallery-setting-grain"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="grain"
              />
            </label>
          </div>
        </div>
      </div>
    </main>

    <script src="/shared/shared-ui/site-nav.js?v=20261109a" data-variant="overlay"></script>

    <noscript>
      <p class="noscript-note">
        此节气图库需要启用 JavaScript；站点导航仍可使用。
      </p>
    </noscript>
    <script type="module" src="./scripts/homepage.js"></script>
  </body>
</html>
