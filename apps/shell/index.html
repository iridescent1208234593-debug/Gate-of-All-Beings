<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/shared/site-domains/index.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众生之门 · 统一门户</title>
<link rel="stylesheet" href="/shared/shared-ui/lxh-ui.css">
<style>
  /* Local tab bar under the shared site bar (packages/shared-ui/site-nav.js). Tokens: design-system.css. */
  :root { --shell-h: 44px; }
  html, body { margin: 0; min-height: 100%; background: var(--qc-bg, #f5f0e8);
               color: var(--qc-text, #3a4a3e); font-family: "Noto Serif SC", serif; }
  .shell-topbar { position: sticky; top: var(--qc-nav-h, 48px); z-index: 10; box-sizing: border-box;
            height: var(--shell-h); display: flex; align-items: stretch; gap: 2px; padding: 0 clamp(8px, 3vw, 32px);
            border-bottom: 1px solid var(--qc-border, #d4cfbe); background: var(--qc-bg, #f5f0e8);
            overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .shell-topbar::-webkit-scrollbar { display: none; }
  .shell-topbar a { position: relative; display: inline-flex; align-items: center; flex: none; padding: 0 12px;
            color: #6f7b69; text-decoration: none; font-size: 14px; }
  .shell-topbar a:hover { color: var(--qc-text, #3a4a3e); }
  .shell-topbar a.active { color: #4f6a4b; font-weight: 600; }
  .shell-topbar a.active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px;
            border-radius: 2px 2px 0 0; background: #c4943f; }
  .shell-topbar .shell-return { color: #4f6a4b; padding-left: 0; margin-right: 8px; }
  .shell-topbar .shell-return::before { content: ''; width: 7px; height: 7px; margin-right: 8px; border: solid currentColor;
            border-width: 0 0 1.5px 1.5px; transform: rotate(45deg); }
  #iridescently-shell-navlinks { display: flex; align-items: stretch; gap: 2px; }
  #iridescently-shell-user { display: none; }
  .shell-topbar .shell-board { margin-left: auto; flex: none; }
  main { height: calc(100dvh - var(--qc-nav-h, 48px) - var(--shell-h)); }
  iframe.view { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .module-embed.view { width: 100%; height: 100%; overflow: auto; background: var(--qc-bg, #f5f0e8); }
  :where(a, button):focus-visible { outline: 2px solid #d4a840; outline-offset: -2px; }
  /* Loading and error states sit where the module will appear, without a separate page. */
  .module-state { display: grid; place-content: center; justify-items: center; gap: 14px; min-height: 60%;
            margin: 0; padding: 24px; color: var(--qc-dim, #7a8a7e); font-size: 14px; line-height: 1.8; text-align: center; }
  .module-state[role="status"]::before { content: ''; width: 120px; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, transparent, #c4943f, transparent) 0 0 / 50% 100% no-repeat #d4cfbe;
            animation: shell-loading 1.1s ease-in-out infinite; }
  .module-state a { color: #4f6a4b; }
  @keyframes shell-loading { from { background-position: -60px 0; } to { background-position: 120px 0; } }
  @media (prefers-reduced-motion: reduce) { .module-state[role="status"]::before { animation: none; } }
  @media (max-width: 640px) { .shell-topbar a { padding: 0 9px; font-size: 13px; } .shell-topbar a.active::after { left: 9px; right: 9px; } }
</style>
<script src="/shared/shared-ui/site-nav.js?v=20261028o"></script>
<script src="/shared/shared-ui/landscape-hint.js?v=20261027z" data-auto defer></script>
<script defer src="/shared/shared-ui/server-recovery.js"></script>
</head>
<body>
<header class="shell-topbar" id="iridescently-shell-chrome" aria-label="众生之门模块">
  <a class="shell-return" id="iridescently-shell-return" href="/#home" data-site-service="zszm" data-site-path="/#home">门庭</a>
  <nav id="iridescently-shell-navlinks" aria-label="模块"></nav>
  <a class="shell-board" id="iridescently-shell-board" href="/shared/shared-ui/leaderboard/index.html">排行榜</a>
  <span id="iridescently-shell-user"></span>
</header>
<main id="iridescently-shell-view"></main>
<script>
/* 进入模块（沉浸玩法）时收起全局导航；模块可通过 postMessage 自行控制。
   - 路由 /app/shell/m/<key> 视为沉浸态
   - 模块内开场动画等可发 {type:'qc-nav', hide:true/false}
   兼容未加载 IridescentlyNav 的情况（静默跳过）。*/
(function () {
  var nav = null;
  function api() { return window.IridescentlyNav || null; }
  function setHidden(hide) {
    var a = api(); if (!a) return;
    if (hide) a.hide(); else a.show();
    document.documentElement.setAttribute('data-qc-nav', hide ? 'hidden' : 'shown');
  }
  function syncWithRoute() {
    setHidden(location.pathname.indexOf('/app/shell/m/') === 0);
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.type === 'qc-nav' && typeof d.hide === 'boolean') setHidden(d.hide);
  });
  window.addEventListener('popstate', syncWithRoute);
  var push = history.pushState;
  history.pushState = function () { var r = push.apply(this, arguments); syncWithRoute(); return r; };
  var rep = history.replaceState;
  history.replaceState = function () { var r = rep.apply(this, arguments); syncWithRoute(); return r; };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncWithRoute, { once: true });
  else syncWithRoute();
  window.__qcNavImmersive = { set: setHidden, sync: syncWithRoute };
})();
</script>


<script type="module">
import { refreshSession } from '/shared/shared-session/session.js';
import { get, set } from '/shared/shared-session/save.js';

const view = document.getElementById('iridescently-shell-view');
const navlinks = document.getElementById('iridescently-shell-navlinks');
const BASE_PATH = '/app/shell/';
if (IridescentlyDomains.service(location.hostname) === 'zszm' || ['127.0.0.1', 'localhost'].includes(location.hostname)) {
  document.getElementById('iridescently-shell-return').href = '/#home';
}
let portal = { links: [] };
let mountVersion = 0;
let activeMount = null;
let mountQueue = Promise.resolve();
const scriptMounts = new Map();
const baseEl = document.createElement('base');
baseEl.href = BASE_PATH;
document.head.prepend(baseEl);
const setBase = (href) => { baseEl.href = href; };

const isInternal = (url) => url && url.startsWith('/');
const moduleHref = (key) => BASE_PATH + 'm/' + key;

function route() {
  const p = location.pathname;
  if (!p.startsWith(BASE_PATH)) return { name: 'home' };
  const rest = p.slice(BASE_PATH.length).replace(/\/$/, '');
  const m = rest.match(/^m\/(.+)$/);
  return m ? { name: 'module', key: decodeURIComponent(m[1]) } : { name: 'home' };
}

function navigate(path, replace) {
  if (path === location.pathname) return;
  if (replace) history.replaceState({}, '', path);
  else history.pushState({}, '', path);
  render();
}

const TAB_ORDER = ['slay', 'juling', 'management', 'ecology', 'world-map', 'softie', 'aeon'];
function renderNav() {
  navlinks.replaceChildren();
  const tabs = portal.links.filter(x => isInternal(x.url) && x.key !== 'cards')
    .sort((a, b) => (TAB_ORDER.indexOf(a.key) + 1 || 99) - (TAB_ORDER.indexOf(b.key) + 1 || 99));
  for (const l of tabs) {
    navlinks.append(Object.assign(document.createElement('a'), { className: 'nav', href: moduleHref(l.key), textContent: l.name }));
  }
}

function renderHome() {
  location.replace(document.getElementById('iridescently-shell-return').href);
}

function renderModule(key) {
  // 排行榜入口默认打开当前玩法的榜单
  document.getElementById('iridescently-shell-board').href = '/shared/shared-ui/leaderboard/index.html?board=' + encodeURIComponent(key);
  const l = portal.links.find(x => x.key === key && isInternal(x.url));
  if (!l) { IridescentlyRecovery.render(view, {message:'这个玩法入口不存在，请返回门庭选择其他玩法。'}); return; }
  if (l.embed) { mountEmbed(l); return; }
  setBase(BASE_PATH);
  const version = mountVersion;
  const box = document.createElement('div');box.className = 'module-state';box.textContent = '正在打开 ' + l.name + '…';view.replaceChildren(box);
  fetch(l.url, {method:'HEAD',signal:AbortSignal.timeout(10000)}).then(response => {
    if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) throw Error('玩法入口不可用');
    if (version !== mountVersion) return;
    const f = document.createElement('iframe');
    f.className = 'view'; f.src = l.url; f.title = l.name;
    f.setAttribute('allow', 'fullscreen; clipboard-write');
    f.onerror = () => { if (version === mountVersion) IridescentlyRecovery.render(view); };
    view.replaceChildren(f);
  }).catch(() => { if (version === mountVersion) IridescentlyRecovery.render(view, {message:'这个玩法的入口暂时不可用，请换服务器或重新加载。'}); });
}

// A module owns its scripts, injected styles and disposal callbacks. Only one
// asynchronous script sequence may run at a time; a newer route cancels its owner.
function releaseMount(context) {
  context.controller.abort();
  for (const dispose of context.disposers) {
    if (context.released.has(dispose)) continue;
    context.released.add(dispose);
    try { dispose(); } catch (error) { console.error('模块卸载失败', error); }
  }
  for (const element of context.head) element.remove();
  if (!context.failed || context.version !== mountVersion) context.box.remove();
  if (window.__iridescentlyEmbed === context.box) window.__iridescentlyEmbed = null;
  if (context.disposers.has(window.__iridescentlyDispose)) window.__iridescentlyDispose = null;
}

function captureDispose(context) {
  if (typeof window.__iridescentlyDispose === 'function') context.disposers.add(window.__iridescentlyDispose);
}

function appendScript(context, source, base) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    const type = (source.getAttribute('type') || '').toLowerCase();
    if (type) script.type = type;
    const src = source.getAttribute('src');
    const finish = (error) => {
      context.controller.signal.removeEventListener('abort', cancel);
      script.onload = script.onerror = null;
      if (error) { script.remove(); reject(error); } else resolve();
    };
    const cancel = () => finish(new DOMException('Module route changed', 'AbortError'));
    script.onload = () => finish();
    script.onerror = () => finish(new Error('脚本无法载入：' + (src || '内联模块')));
    if (src) script.src = new URL(src, base).href;
    else script.textContent = source.textContent;
    context.controller.signal.addEventListener('abort', cancel, { once: true });
    context.box.appendChild(script);
    // Classic inline scripts execute synchronously; inline modules emit load.
    if (!src && type !== 'module') finish();
  });
}

function mountEmbed(link) {
  const box = document.createElement('div');
  box.className = 'view module-embed';
  box.setAttribute('aria-busy', 'true');
  box.innerHTML = '<p class="module-state" role="status">正在打开 ' + escapeText(link.name) + '…</p>';
  view.replaceChildren(box);
  const context = { box, version: mountVersion, controller: new AbortController(), head: [], disposers: new Set(), released: new Set() };
  activeMount = context;
  const current = () => context.version === mountVersion && !context.controller.signal.aborted;
  const base = new URL(link.url.endsWith('/') ? link.url : link.url + '/', location.origin).href;

  mountQueue = mountQueue.catch(() => {}).then(async () => {
    if (!current()) return;
    window.__iridescentlyDispose = null;
    try {
      const response = await fetch(new URL('index.html', base), { signal: context.controller.signal });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const html = await response.text();
      if (!current()) return;
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const scripts = [...doc.querySelectorAll('script')];
      // Resolve attributes before copying the DOM; detached document changes do
      // not affect an already-injected body. Do not run script tags twice.
      for (const element of doc.querySelectorAll('[src], [href], [poster]')) {
        for (const attribute of ['src', 'href', 'poster']) {
          const value = element.getAttribute(attribute);
          if (value && !/^(?:[a-z][a-z\d+.-]*:|\/|#)/i.test(value)) element.setAttribute(attribute, new URL(value, base).href);
        }
      }
      for (const source of doc.head.querySelectorAll('link[rel="stylesheet"], style')) {
        const element = source.cloneNode(true);
        element.dataset.moduleOwner = link.key;
        context.head.push(element);
        document.head.appendChild(element);
      }
      for (const source of scripts) source.remove();
      box.innerHTML = doc.body.innerHTML;
      setBase(base);
      window.__iridescentlyEmbed = box;
      for (const source of scripts) {
        if (!current()) break;
        const type = (source.getAttribute('type') || '').toLowerCase();
        if (type === 'application/ld+json' || type === 'application/json') continue;
        const src = source.getAttribute('src');
        if (!src && !source.textContent.trim()) continue;
        if (src && type === 'module') {
          // Import itself is not abortable. Serialize it, then dispose its owner
          // if the route changed while the import was executing.
          const url = new URL(src, base);
          const identity = url.href;
          const mount = scriptMounts.get(identity);
          if (mount) {
            window.__iridescentlyDispose = null;
            await mount();
          } else {
            window.__iridescentlyMount = null;
            url.searchParams.set('embed', String(context.version));
            await import(url.href);
            if (typeof window.__iridescentlyMount === 'function') scriptMounts.set(identity, window.__iridescentlyMount);
          }
        } else await appendScript(context, source, base);
        captureDispose(context);
      }
      if (current()) box.setAttribute('aria-busy', 'false');
    } catch (error) {
      if (current() && error.name !== 'AbortError') {
        context.failed = true;
        releaseMount(context);
        IridescentlyRecovery.render(box, {message:'这个玩法的程序或资源暂时无法加载，请换服务器或重新加载。'});
        box.setAttribute('aria-busy', 'false');
        view.replaceChildren(box);
        console.error('模块加载失败', error);
      }
    } finally {
      captureDispose(context);
      if (!current()) releaseMount(context);
      if (window.__iridescentlyEmbed === box) window.__iridescentlyEmbed = null;
    }
  });
}

function escapeText(value) {
  return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}

function render() {
  mountVersion += 1;
  if (activeMount) { releaseMount(activeMount); activeMount = null; }
  setBase(BASE_PATH);
  const r = route();
  if (r.name === 'module') renderModule(r.key); else renderHome();
  for (const a of navlinks.querySelectorAll('a')) {
    const current = a.getAttribute('href') === location.pathname;
    a.classList.toggle('active', current);
    if (current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  set('lastRoute', location.pathname);
}

addEventListener('pagehide', (event) => {
  if (event.persisted) return;
  mountVersion += 1;
  if (activeMount) releaseMount(activeMount);
});

document.addEventListener('click', (event) => {
  const a = event.target.closest('a');
  if (!a || a.target === '_blank' || a.hasAttribute('download') || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  const href = a.getAttribute('href') || '';
  if (!href.startsWith(BASE_PATH)) return;
  event.preventDefault();
  navigate(href);
});
addEventListener('popstate', render);

(async () => {
  try {
    const response = await fetch('/app/portal.json');
    if (!response.ok) throw Error('玩法清单不可用');
    portal = await response.json();
  } catch { IridescentlyRecovery.render(view, {message:'暂时无法读取玩法清单，请重试。'}); return; }
  renderNav();
  const r = route();
  const last = get('lastRoute');
  if (r.name === 'home' && last && last.startsWith(BASE_PATH) && last !== BASE_PATH) {
    history.replaceState({}, '', last);
  }
  render();
  const s = await refreshSession().catch(() => null);
  document.getElementById('iridescently-shell-user').textContent = s && s.logged_in ? (s.name || '已登录') : '';
})();
</script>
</body>
</html>
