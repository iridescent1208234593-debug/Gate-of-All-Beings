    <section class="login" id="login" aria-hidden="true">
      <button class="back-button login-back-button" id="login-back" type="button" aria-label="返回开场">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M64 18 L28 50 L64 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <form class="login-form" id="login-form" novalidate autocomplete="off">
        <div class="login-body">
          <label class="login-field" for="username">
            <span class="login-badge" aria-hidden="true">ID</span>
            <input class="login-input" id="username" name="username" type="text" inputmode="text" enterkeyhint="go" maxlength="64" placeholder="请输入用户名" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="login-error" />
          </label>
          <p class="login-counter" id="login-counter" aria-hidden="true"></p>
        </div>
        <button class="login-submit" id="login-submit" type="submit" aria-label="确认">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 5v7.4a3 3 0 0 1-3 3H5.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9.1 11.2 4.9 15.4l4.2 4.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>
      <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
    </section>

    <section class="screen race-tree-screen" id="race-tree" aria-hidden="true">
      <button class="back-button" type="button" data-back aria-label="返回">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M64 18 L28 50 L64 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <div class="race-tree-canvas" id="race-tree-canvas"></div>
      <div class="opening-progress race-tree-progress" id="race-tree-progress" aria-label="种族树动画进度">
        <span class="opening-progress__track"><span id="race-tree-progress-fill"></span></span>
        <input id="race-tree-progress-range" class="opening-progress__range" type="range" min="0" max="4300" step="1" value="0" aria-label="种族树动画进度" aria-valuetext="00:00 / 00:04" />
        <span id="race-tree-time" class="opening-progress__time">00:00 / 00:04</span>
      </div>
    </section>

    <section class="screen race-list-screen" id="race-list" aria-hidden="true">
      <button class="back-button" type="button" data-back aria-label="返回">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M64 18 L28 50 L64 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <div class="race-list-canvas" id="race-list-canvas"></div>
    </section>

    <section class="screen appearance-choice-screen" id="appearance-choice" aria-hidden="true">
      <button class="back-button" type="button" data-back aria-label="返回头像选择">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M64 18 L28 50 L64 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <div class="appearance-choice-options" role="group" aria-label="选择头像显示方式">
        <div class="appearance-mode" data-mode="frame">
          <div class="appearance-frame" data-frame="frame" role="img" aria-label="尚未设置已选头像">
            <div class="appearance-frame__art"></div>
          </div>
          <div class="appearance-action-row">
            <span class="appearance-action-side" aria-hidden="true"></span>
            <button class="appearance-action" type="button" data-choice="frame" aria-label="设置" aria-describedby="avatar-frame-hint" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19.5 3.5a10 10 0 0 1 7.8 13.9l5.2 5.2-6 6-5.2-5.2A10 10 0 0 1 7.4 11l5.2 5.2 5-1.3 1.3-5-5.2-5.2a10 10 0 0 1 5.8-1.2Z" fill="currentColor" transform="translate(-1 0) scale(.94)"/></svg>
              <span>设置</span>
              <span class="appearance-action__hint" id="avatar-frame-hint">使用已选择</span>
            </button>
            <span class="appearance-action-side" aria-hidden="true"></span>
          </div>
        </div>
        <div class="appearance-mode appearance-mode--mirror" data-mode="upload">
          <div class="appearance-frame" data-frame="upload" role="img" aria-label="尚未上传自己的头像">
            <div class="appearance-frame__art"></div>
          </div>
          <div class="appearance-action-row">
            <span class="appearance-action-side" aria-hidden="true"></span>
            <button class="appearance-action" type="button" data-choice="upload" aria-label="拍摄" aria-describedby="avatar-upload-hint" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 7h8l2 4h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3h4Z" fill="currentColor"/><circle cx="16" cy="20" r="6" fill="var(--appearance-color)"/></svg>
              <span>拍摄</span>
              <span class="appearance-action__hint" id="avatar-upload-hint">上传自己的头像</span>
            </button>
            <span class="appearance-action-side" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <input id="avatar-upload" class="avatar-upload" type="file" accept="image/*" aria-label="选择头像图片" />
      <button id="avatar-continue" class="avatar-continue" type="button" disabled>确认头像并继续</button>
      <p class="appearance-choice-caption" role="status" aria-live="polite"></p>
    </section>
