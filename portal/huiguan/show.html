<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>人设展示 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f5f0e8;--panel:#fbf8f2;--border:#d4cfbe;--text:#3a4a3e;--dim:#5a6e5e;--accent:#5a9e8f;--gold:#d4a840}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:"Noto Serif SC","Source Han Serif SC",serif}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:42px}
.nav-title{font-size:13px;color:var(--dim);letter-spacing:1px}
.nav-right{display:flex;gap:8px;align-items:center}
.nav-btn{font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;padding:5px 14px;border-radius:6px;border:1px solid #b8892a;background:#b8892a;color:#fff;text-decoration:none;transition:all .15s;display:inline-flex;align-items:center}
.nav-btn:hover{filter:brightness(1.08)}
.nav-btn.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.iframe-wrap{position:fixed;top:42px;left:0;right:0;bottom:0}
.iframe-wrap iframe{width:100%;height:100%;border:none}
.loading-state{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px}
.spinner{width:32px;height:32px;border:3px solid rgba(90,158,143,.27);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--dim)}
.error-text{text-align:center;color:var(--dim);padding:40px;font-size:14px}
</style>
</head>
<body>
<div class="nav-bar">
  <span class="nav-title">西木会馆 · 人设展示</span>
  <div class="nav-right">
    <a class="nav-btn" href="fan.html">会馆</a>
  </div>
</div>
<div class="iframe-wrap" id="wrap"><div class="loading-state"><div class="spinner"></div><span class="loading-text">加载展示页…</span></div></div>
<script>
(function(){
var params=new URLSearchParams(location.search);
var code=params.get('code');
if(!code){location.replace('/');return;}

var apiBase='/api/huiguan';

fetch(apiBase+'/get-character?code='+encodeURIComponent(code))
.then(function(r){if(!r.ok)throw r;return r.text();})
.then(function(html){
  var w=document.getElementById('wrap');
  var iframe=document.createElement('iframe');
  // 展示页的 .reveal 区块要靠页面内脚本激活后才可见，所以 iframe 必须放行脚本；
  // 但沙箱若不授予 allow-same-origin，帧文档处于不透明源：html2canvas 读不到样式、
  // 「保存为图片」的 blob 下载也会被丢弃（此前用 sandbox + doc.write 时，父页访问
  // contentDocument 还会抛 SecurityError，被下面的 catch 吞成「展示页不存在」，
  // 造成全部展示页打不开）。故放行 allow-same-origin，并改用 srcdoc 承载内容，
  // 父页不再访问帧文档；同时不授予 allow-top-navigation，展示页无法劫持本页跳转。
  iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-forms allow-downloads');
  iframe.setAttribute('referrerpolicy','no-referrer');
  iframe.srcdoc=html;
  w.innerHTML='';
  w.appendChild(iframe);
})
.catch(function(){
  document.getElementById('wrap').innerHTML='<div class="error-text">展示页不存在，请返回<a href="/">登记页</a>重新生成。</div>';
});
})();
</script>
</body>
</html>
