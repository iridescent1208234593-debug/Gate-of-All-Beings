<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>同人画廊 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f5f0e8;--panel:#fbf8f2;--border:#d4cfbe;--text:#3a4a3e;--dim:#5a6e5e;--accent:#5a9e8f;--gold:#d4a840;--danger:#b3543f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;padding:58px 16px 60px}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:42px}
.nav-title{font-size:13px;color:var(--dim);letter-spacing:1px}
.nav-right{display:flex;gap:8px;align-items:center}
.nav-btn{font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;padding:5px 14px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:#fff;text-decoration:none;transition:all .15s;display:inline-flex;align-items:center}
.nav-btn:hover{filter:brightness(1.08)}
.nav-btn.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:22px;letter-spacing:3px;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:13px;margin-bottom:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:200px;font-family:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-family:inherit;font-size:12px;cursor:pointer;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--dim);transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{color:var(--dim);font-size:13px;margin-bottom:14px}
.section-title{font-size:16px;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.section-title small{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit;display:block;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card.checkable{border:2px solid transparent;position:relative}
.card.checkable.selected{border-color:var(--gold)}
.card.checkable .check-mark{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s;z-index:2}
.card.checkable.selected .check-mark{background:var(--gold);border-color:var(--gold);color:#fff}
.card-img{width:100%;height:200px;object-fit:contain;background:#ece4d6;display:block}
.card-placeholder{width:100%;height:200px;background:linear-gradient(135deg,rgba(90,158,143,.15),rgba(212,168,64,.12));display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--dim)}
.card-body{padding:10px 12px 12px}
.card-name{font-size:15px;font-weight:600;margin-bottom:2px}
.card-meta{font-size:12px;color:var(--dim);line-height:1.5}
.card-author{font-size:11px;color:var(--gold);margin-top:4px}
.card-published-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;background:var(--accent);color:#fff;margin-top:4px}
.card-unpublish-btn{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--red,#e74c3c);color:var(--red,#e74c3c);background:transparent;cursor:pointer;margin-top:4px;margin-left:4px;font-family:inherit}
.card-unpublish-btn:hover{background:var(--red,#e74c3c);color:#fff}
.load-more{display:block;margin:18px auto 0;font-family:inherit;font-size:13px;cursor:pointer;padding:9px 30px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);transition:all .15s}
.load-more:hover{background:var(--accent);color:#fff}
.back{display:inline-block;margin-bottom:12px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
.publish-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px;padding:14px 18px;border:1px solid rgba(212,168,64,.4);border-radius:10px;background:rgba(212,168,64,.07)}
.publish-bar .pb-text{flex:1;min-width:220px}
.publish-bar .pb-text strong{display:block;font-size:15px;color:var(--gold);margin-bottom:3px;letter-spacing:1px}
.publish-bar .pb-text span{font-size:13px;color:var(--text);line-height:1.7}
.pb-btn{font-family:inherit;font-size:13px;cursor:pointer;padding:8px 20px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#fff;transition:all .15s;white-space:nowrap}
.pb-btn:hover{filter:brightness(1.08)}
.pb-btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:60px;color:var(--dim);font-size:14px}
.loading{text-align:center;padding:60px;color:var(--dim)}
.login-prompt{text-align:center;padding:40px;color:var(--dim);font-size:14px}
.login-prompt a{color:var(--gold);text-decoration:none;font-weight:600}
.card-poster-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;background:var(--gold);color:#fff;margin-bottom:4px}
#posterLightbox{position:fixed;inset:0;z-index:9999;background:rgba(15,20,17,.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;cursor:zoom-out}
#posterLightbox.is-open{display:flex}
#posterLightbox img{max-height:82vh;max-width:92vw;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5);background:#222}
#posterLightbox .lb-cap{color:#f5f0e8;font-size:14px;letter-spacing:1px;text-align:center;line-height:1.7}
#posterLightbox .lb-cap small{color:rgba(245,240,232,.6);font-size:12px}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:9990;background:rgba(20,26,22,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.is-open{display:flex}
.modal-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:500px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(20,26,22,.30)}
.modal-title{font-size:18px;letter-spacing:1px;margin-bottom:16px}
.modal-close{float:right;cursor:pointer;background:none;border:none;font-size:20px;color:var(--dim);line-height:1}
.modal-close:hover{color:var(--danger)}
.modal-body{font-size:14px;color:var(--text);line-height:1.8;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
<body>
<div class="nav-bar">
  <span class="nav-title">西木会馆 · 同人画廊</span>
  <div class="nav-right">
    <a class="nav-btn secondary" href="/">人设登记</a>
    <a class="nav-btn" href="gallery.html">官方画廊</a>
  </div>
</div>
<div class="wrap">
  <h1>同人画廊</h1>
  <p class="subtitle">罗小黑战记 · 同人创作角色 · 由爱好者提交与分享</p>

  <!-- 登录后可见：从已登记人设公开 -->
  <div class="publish-bar" id="publishBar" style="display:none">
    <div class="pb-text">
      <strong>从已登记人设中公开</strong>
      <span>勾选下方角色卡片，一键公开到同人画廊——无需重新填写信息。</span>
    </div>
    <button class="pb-btn" id="publishBtn" onclick="doPublish()" disabled>公开到同人画廊</button>
  </div>

  <!-- 快速跳转卡片 -->
  <a href="gallery.html" style="display:flex;align-items:center;gap:14px;padding:16px 18px;margin:0 0 18px;border:1px solid rgba(90,158,143,.45);border-radius:10px;background:linear-gradient(120deg,rgba(90,158,143,.10),rgba(212,168,64,.08));text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;"
     onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(30,40,34,.14)'"
     onmouseout="this.style.transform='';this.style.boxShadow=''">
    <div style="width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;">🏛️</div>
    <div style="flex:1;min-width:220px">
      <strong style="display:block;font-size:16px;color:var(--gold);letter-spacing:1px;margin-bottom:4px;">官方角色画廊 →</strong>
      <span style="font-size:13px;color:var(--text);line-height:1.7">查看经编辑审核的官方角色档案，了解会馆历代人物设定</span>
    </div>
  </a>

  <!-- 我的已登记人设（登录后可见） -->
  <div id="mySection" style="display:none">
    <div class="section-title">我的已登记人设 <small id="myCount"></small></div>
    <div class="grid" id="myGrid"><div class="loading">加载中…</div></div>
  </div>

  <!-- 公开的同人角色 -->
  <div class="section-title">公开的同人角色 <small id="pubCount"></small></div>
  <div class="toolbar">
    <input class="search" id="search" placeholder="搜索角色名…" oninput="onSearch(this.value)">
    <div class="filter-btns">
      <button class="fbtn active" onclick="setType('',this)">全部</button>
      <button class="fbtn" onclick="setType('妖精',this)">妖精</button>
      <button class="fbtn" onclick="setType('人类',this)">人类</button>
      <button class="fbtn" onclick="setType('神灵',this)">神灵</button>
      <button class="fbtn" onclick="setType('其他',this)">其他</button>
      <button class="fbtn" onclick="setType('配色海报',this)">配色海报</button>
    </div>
  </div>
  <div class="grid" id="grid"><div class="loading">加载中…</div></div>
  <button class="load-more" id="loadMore" style="display:none" onclick="loadMore()">加载更多</button>
</div>

<!-- 配色海报灯箱 -->
<div id="posterLightbox" onclick="closePosterView()">
  <img id="lbImg" src="" alt="配色海报">
  <div class="lb-cap"><span id="lbCap"></span><br><small id="lbSub"></small></div>
</div>

<!-- 确认弹窗 -->
<div class="modal" id="confirmModal" onclick="if(event.target===this)closeConfirm()">
  <div class="modal-panel">
    <button class="modal-close" onclick="closeConfirm()">&times;</button>
    <div class="modal-title">确认公开</div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-actions">
      <button type="button" class="pb-btn" style="background:transparent;color:var(--gold);border:1px solid var(--gold)" onclick="closeConfirm()">取消</button>
      <button type="button" class="pb-btn" id="confirmBtn" onclick="confirmPublish()">确认公开</button>
    </div>
  </div>
</div>

<script src="reactions-fx.js?v=20261018"></script>
<script>
const PAGE=12;
let curType='', curQ='', timer=null;
let curPage=1, loaded=0, total=0, loading=false;
let currentUser=null;
let myChars=[], publishedNames=new Set(), publishedIds={};
let selectedCodes=new Set();

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ====== 公开角色卡片（画廊列表）======
function cardHTML(c){
  const img=c.image_data
    ? `<img class="card-img" data-original-image src="${esc(c.image_data)}" alt="${esc(c.name)}" loading="lazy" onerror="this.parentElement.querySelector('.card-placeholder').style.display='flex';this.style.display='none'">`
    : '';
  const placeholder=!c.image_data
    ? `<div class="card-placeholder">${esc(c.name?c.name[0]:'?')}</div>`
    : `<div class="card-placeholder" style="display:none">${esc(c.name?c.name[0]:'?')}</div>`;
  const isPoster=c.type==='配色海报';
  const clickAct=isPoster
    ? `openPosterView(this.dataset.img,this.dataset.cap,this.dataset.sub)`
    : `location.href='show.html?code='+encodeURIComponent('${esc(c.code||'')}')`;
  return `<div class="card" data-cid="${c.id}" data-img="${esc(c.image_data||'')}" data-cap="${esc(c.name||'')}" data-sub="${esc(c.user_name||'匿名')}" onclick="${clickAct}" style="cursor:pointer">
    ${isPoster?'<div style="padding:8px 12px 0"><span class="card-poster-tag">配色海报</span></div>':''}
    ${img}${placeholder}
    <div class="card-body">
      <div class="card-name">${esc(c.name)}</div>
      <div class="card-author">— ${esc(c.user_name||'匿名')}${isPoster?' · <a href="/haibao/" style="color:var(--gold)" onclick="event.stopPropagation()">去制作</a>':''}</div>
      ${RFX.bar('fan',c.id)}
    </div>
  </div>`;
}

async function loadPub(reset=true){
  if(loading) return;
  const grid=document.getElementById('grid');
  if(reset){curPage=1;loaded=0;grid.innerHTML='<div class="loading">加载中…</div>';}
  loading=true;
  const params=new URLSearchParams({limit:PAGE,page:curPage});
  if(curQ) params.set('q',curQ);
  if(curType) params.set('type',curType);
  try{
    const r=await fetch('/api/fan/list?'+params);
    const d=await r.json();
    const list=d.characters||[];total=d.total||0;
    if(reset){grid.innerHTML='';loaded=0;}
    document.getElementById('pubCount').textContent=`（共 ${total} 个）`;
    if(reset&&!list.length){grid.innerHTML='<div class="empty">还没有公开的同人角色，来做第一个公开者吧！</div>';hideMore();loading=false;return;}
    grid.insertAdjacentHTML('beforeend',list.map(cardHTML).join(''));
    loaded+=list.length;
    updateMore();
  }catch(e){if(reset)grid.innerHTML='<div class="empty">加载失败，请刷新重试。</div>';}
  loading=false;
}
function loadMore(){curPage++;loadPub(false);}
function updateMore(){
  const b=document.getElementById('loadMore');
  if(loaded<total){b.style.display='block';b.textContent=`加载更多 · 已显示 ${loaded}/${total}`;}
  else hideMore();
}
function hideMore(){document.getElementById('loadMore').style.display='none';}

function setType(t,btn){
  curType=t;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadPub(true);
}
function onSearch(v){curQ=(v||'').trim();clearTimeout(timer);timer=setTimeout(()=>loadPub(true),300);}

// ====== 我的已登记人设 ======
function myCardHTML(c,idx){
  const isPublished=publishedNames.has(c.name||'');
  const cls='card checkable'+(selectedCodes.has(c.code)?' selected':'')+(isPublished?' published':'');
  const img=c.image
    ? `<img class="card-img" data-original-image src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy" onerror="this.parentElement.querySelector('.card-placeholder').style.display='flex';this.style.display='none'">`
    : '';
  const placeholder=!c.image
    ? `<div class="card-placeholder">${esc(c.name?c.name[0]:'?')}</div>`
    : `<div class="card-placeholder" style="display:none">${esc(c.name?c.name[0]:'?')}</div>`;
  return `<div class="${cls}" data-idx="${idx}" onclick="onMyCardClick(${idx})">
    <div class="check-mark">✓</div>
    ${img}${placeholder}
    <div class="card-body">
      <div class="card-name">${esc(c.name)}</div>
      ${isPublished?`<span class="card-published-tag">已公开</span><button class="card-unpublish-btn" onclick="event.stopPropagation();unpublishChar(myChars[${idx}])">取消公开</button>`:''}
    </div>
  </div>`;
}

function onMyCardClick(idx){
  const c=myChars[idx];
  if(!c) return;
  if(publishedNames.has(c.name||'')){
    // 已公开：取消公开
    unpublishChar(c);
    return;
  }
  if(selectedCodes.has(c.code)){
    selectedCodes.delete(c.code);
  }else{
    selectedCodes.add(c.code);
  }
  renderMyCards();
}

async function unpublishChar(c){
  try{
    const fid=publishedIds[c.name];
    if(!fid){alert('找不到该角色的已公开记录');return;}
    const r=await fetch('/api/fan/toggle',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:fid,is_public:false})
    });
    const d=await r.json();
    if(!d.ok){alert(d.error||'切换失败');return;}
    // 刷新列表
    await loadMy();
    loadPub(true);
  }catch(e){alert('网络错误，请稍后再试');}
}

function renderMyCards(){
  const grid=document.getElementById('myGrid');
  grid.innerHTML=myChars.map((c,i)=>myCardHTML(c,i)).join('');
  document.getElementById('myCount').textContent=`（共 ${myChars.length} 个，已公开 ${publishedNames.size} 个）`;
  const btn=document.getElementById('publishBtn');
  btn.disabled=selectedCodes.size===0;
  if(selectedCodes.size>0){
    btn.textContent=`公开到同人画廊（${selectedCodes.size}）`;
  }else{
    btn.textContent='公开到同人画廊';
  }
}

async function loadMy(){
  if(!currentUser||!currentUser.logged_in) return;
  try{
    const r=await fetch('/api/get-characters');
    const d=await r.json();
    myChars=(d.characters||[]).map(c=>c.data||c);
    // 获取已公开列表
    const fr=await fetch('/api/fan/my');
    const fd=await fr.json();
    const fchars=fd.characters||[];
    // 仅将「已公开」的记录计入映射，取消公开后自动失效
    const pub=fchars.filter(c=>c.is_public);
    publishedNames=new Set(pub.map(c=>c.name));
    publishedIds={}; pub.forEach(c=>{ publishedIds[c.name]=c.id; });
    
    if(myChars.length===0){
      document.getElementById('myGrid').innerHTML='<div class="empty">你还没有登记人设，去<a href="/">登记页</a>创建吧。</div>';
      document.getElementById('myCount').textContent='（共 0 个）';
      document.getElementById('publishBar').style.display='none';
    }else{
      document.getElementById('publishBar').style.display='flex';
      document.getElementById('mySection').style.display='block';
      renderMyCards();
    }
  }catch(e){
    document.getElementById('myGrid').innerHTML='<div class="empty">加载我的角色失败，请刷新重试。</div>';
  }
}

// ====== 发布 ======
function doPublish(){
  if(selectedCodes.size===0) return;
  const names=[];
  for(const c of myChars){
    if(selectedCodes.has(c.code)) names.push(c.name);
  }
  const body='将公开以下 <strong>'+names.length+'</strong> 个角色到同人画廊：<br>'+
    names.map(n=>'&nbsp;&nbsp;· '+esc(n)).join('<br>');
  document.getElementById('confirmBody').innerHTML=body;
  document.getElementById('confirmModal').classList.add('is-open');
}
function closeConfirm(){
  document.getElementById('confirmModal').classList.remove('is-open');
}
async function confirmPublish(){
  const btn=document.getElementById('confirmBtn');
  btn.disabled=true;btn.textContent='发布中…';
  try{
    const r=await fetch('/api/fan/publish',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({character_codes:[...selectedCodes]})
    });
    const d=await r.json();
    if(d.ok){
      closeConfirm();
      selectedCodes.clear();
      // 刷新我的列表 + 公开列表
      await loadMy();
      loadPub(true);
    }else{
      alert(d.error||'发布失败');
    }
  }catch(e){alert('网络错误，请稍后再试');}
  btn.disabled=false;btn.textContent='确认公开';
}

// ====== 配色海报灯箱 ======
function openPosterView(img,cap,sub){
  if(!img) return;
  document.getElementById('lbImg').src=img;
  document.getElementById('lbCap').textContent=cap||'';
  document.getElementById('lbSub').textContent=sub?('by '+sub+' · 点击任意处关闭'):'';
  document.getElementById('posterLightbox').classList.add('is-open');
}
function closePosterView(){document.getElementById('posterLightbox').classList.remove('is-open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePosterView();});

// ====== 初始化 ======
async function init(){
  try{
    const r=await fetch('/api/user');
    currentUser=await r.json();
  }catch(e){currentUser=null;}
  
  if(currentUser&&currentUser.logged_in){
    document.getElementById('mySection').style.display='block';
    await loadMy();
  }else{
    document.getElementById('mySection').style.display='block';
    document.getElementById('myGrid').innerHTML='<div class="login-prompt">请先<a href="/?openauth=1">登录 / 注册</a>后查看和公开你的已登记人设</div>';
    document.getElementById('myCount').textContent='';
  }
  await RFX.load('fan');
  loadPub(true);
}
init();
</script>
<script src="https://iridescently.xyz/shared/shared-ui/site-nav.js?v=20261017"></script>
<script src="/original-image-viewer.js?v=20261019-2"></script>
