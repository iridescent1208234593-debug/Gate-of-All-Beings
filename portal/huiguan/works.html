<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/shared/site-domains.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>官方角色同人画廊 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="/design-system/design-system.css">
<link rel="stylesheet" href="/design-system/ui/lxh-ui.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;padding:72px var(--qc-sp-4) 60px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:var(--qc-fs-xl);letter-spacing:3px;margin-bottom:var(--qc-sp-1)}
.subtitle{color:var(--qc-dim);font-size:var(--qc-fs-md);margin-bottom:var(--qc-sp-5)}
.toolbar{display:flex;gap:var(--qc-sp-3);flex-wrap:wrap;align-items:center;margin-bottom:var(--qc-sp-3)}
.toolbar .qc-input{flex:1;min-width:200px;width:auto}
.stat{color:var(--qc-dim);font-size:var(--qc-fs-md);margin-bottom:var(--qc-sp-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qc-loading{min-height:30vh}
.load-more{display:flex;margin:var(--qc-sp-5) auto 0}
/* 角色格：与主册同步的官方角色，封面是该角色喜欢最多的同人图 */
.role{padding:0;overflow:hidden;display:block;color:inherit;text-decoration:none}
.role-cover{height:220px;background:var(--qc-bg);border-bottom:1px solid var(--qc-border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.role-cover img{width:100%;height:100%;object-fit:contain}
.role-empty{display:flex;flex-direction:column;align-items:center;gap:var(--qc-sp-1);color:var(--qc-dim);font-size:var(--qc-fs-sm)}
.role-empty b{font-size:40px;font-weight:400;line-height:1.2}
.role-body{padding:var(--qc-sp-3)}
.role-name{font-size:var(--qc-fs-lg);font-weight:600}
.role-meta{display:flex;justify-content:space-between;align-items:center;gap:var(--qc-sp-2);font-size:var(--qc-fs-sm);color:var(--qc-dim);margin-top:2px}
/* 单个角色的同人图 */
.char-head{display:flex;align-items:center;justify-content:space-between;gap:var(--qc-sp-3);flex-wrap:wrap;margin-bottom:var(--qc-sp-4)}
.char-head h2{font-size:var(--qc-fs-xl);letter-spacing:2px}
.char-head nav{display:flex;gap:var(--qc-sp-4);font-size:var(--qc-fs-md)}
.char-head nav a{color:var(--qc-accent);text-decoration:none}
.upload{margin-bottom:var(--qc-sp-5)}
.upload .qc-upload{display:flex;align-items:center;justify-content:center;gap:var(--qc-sp-3);min-height:110px;margin-top:var(--qc-sp-1)}
.upload .qc-upload img{max-height:90px;max-width:140px;object-fit:contain;border-radius:var(--qc-r-sm)}
.upload label{display:block;margin-top:var(--qc-sp-3)}
.upload .qc-input{margin-top:var(--qc-sp-1)}
.upload .ack{display:flex;gap:var(--qc-sp-2);align-items:flex-start;font-size:var(--qc-fs-sm);color:var(--qc-text);margin-top:var(--qc-sp-3)}
.upload .actions{display:flex;align-items:center;gap:var(--qc-sp-3);flex-wrap:wrap;margin-top:var(--qc-sp-4)}
.message{font-size:var(--qc-fs-md);color:var(--qc-dim)}
.message.err{color:var(--qc-danger)}
.message.ok{color:var(--qc-accent)}
.art{padding:0;overflow:hidden;display:flex;flex-direction:column}
.art-img{width:100%;height:240px;object-fit:contain;background:var(--qc-bg);display:block;cursor:zoom-in;border-bottom:1px solid var(--qc-border)}
.art-body{padding:var(--qc-sp-3);display:flex;flex-direction:column;gap:var(--qc-sp-1);flex:1}
.art-cap{font-size:var(--qc-fs-md);overflow-wrap:anywhere}
.art-meta{display:flex;justify-content:space-between;gap:var(--qc-sp-2);font-size:var(--qc-fs-sm);color:var(--qc-dim)}
.art-acts{display:flex;align-items:center;gap:var(--qc-sp-2)}
.art-acts .rfx-bar{flex:1;margin-top:0}
/* 副册评论：只针对这张同人图，独立于主册角色页的评论 */
.cmts{border-top:1px dashed var(--qc-border);margin-top:var(--qc-sp-2);padding-top:var(--qc-sp-2);display:flex;flex-direction:column;gap:var(--qc-sp-2)}
.cmt{font-size:var(--qc-fs-sm);line-height:1.6;overflow-wrap:anywhere}
.cmt b{font-weight:600;color:var(--qc-accent)}
.cmt small{color:var(--qc-dim);margin-left:var(--qc-sp-1)}
.cmt button{border:0;background:none;color:var(--qc-danger);font:inherit;font-size:var(--qc-fs-xs);cursor:pointer;margin-left:var(--qc-sp-1)}
.cmt-form{display:flex;gap:var(--qc-sp-2)}
.cmt-form .qc-input{min-height:var(--qc-tap-sm);font-size:var(--qc-fs-sm);padding:4px 8px}
.cmt-form .qc-btn{flex:none;white-space:nowrap}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.role-cover{height:170px}.art-img{height:180px}}
</style>
</head>
<body class="qc-body">
<div class="wrap">
  <div data-archive-volume="official_fanart"></div>
  <h1>官方角色同人画廊</h1>
  <p class="subtitle">官方角色档案 · 副册 · 角色与主册同步 · 同人图由爱好者自行上传，每张 ≤8MB</p>

  <!-- 全部角色 -->
  <section id="listView">
    <div class="toolbar">
      <input class="qc-input" id="search" type="search" placeholder="搜索角色名…" aria-label="搜索角色" oninput="onSearch(this.value)">
    </div>
    <div class="stat" id="stat"></div>
    <div class="grid" id="roleGrid"></div>
    <div id="listState" class="qc-loading" role="status">正在读取角色…</div>
    <button class="qc-btn qc-btn--ghost load-more" id="roleMore" hidden onclick="loadRoles(false)">加载更多</button>
  </section>

  <!-- 单个角色的同人图 -->
  <section id="charView" hidden>
    <div class="char-head">
      <h2 id="charName"></h2>
      <nav><a href="works.html">← 全部角色</a><a id="mainLink" href="gallery.html">主册档案 ↗</a></nav>
    </div>
    <form class="qc-card upload" id="upForm" onsubmit="return submitArt(event)">
      <h3 class="qc-h2 qc-h2--gold">上传同人图</h3>
      <p class="qc-hint">这里是公开档案图廊，所有访客都能看到。请上传你自己的作品或已获授权的作品，不要上传隐私信息、他人肖像或违规内容。</p>
      <label class="qc-label">图片 *
        <span class="qc-upload" id="pick" tabindex="0" role="button" aria-label="选择图片">
          <img id="pickPreview" alt="" hidden>
          <span id="pickText">点击选择图片（JPG / PNG / WebP / GIF，≤8MB）</span>
        </span>
        <input type="file" id="pickFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      </label>
      <label class="qc-label">一句话说明<input class="qc-input" id="caption" maxlength="100" placeholder="选填，如：夏日午后的小黑"></label>
      <label class="ack"><input type="checkbox" id="ack"> 我确认这是公开档案图，可被所有访客看到</label>
      <div class="actions">
        <button class="qc-btn qc-btn--gold" type="submit" id="upBtn">上传</button>
        <span class="message" id="upMsg" role="status" aria-live="polite"></span>
      </div>
    </form>
    <div class="stat" id="artStat"></div>
    <div class="grid" id="artGrid"></div>
    <div id="artState" class="qc-loading" role="status" hidden></div>
    <button class="qc-btn qc-btn--ghost load-more" id="artMore" hidden onclick="loadArt(false)">加载更多</button>
  </section>
</div>

<script src="reactions-fx.js?v=20261021-fanart3"></script>
<script src="image-upload.js?v=20261024"></script>
<script src="archive-volumes.js?v=20261021"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ROLE_PAGE = 30, ART_PAGE = 12, GIF_LIMIT = 8 * 1024 * 1024;
const cid = Number(new URLSearchParams(location.search).get('cid')) || 0;

function setState(el, text, role, retry){
  if (!text) { el.hidden = true; return; }
  el.hidden = false; el.setAttribute('role', role || 'status');
  el.innerHTML = esc(text) + (retry ? `<div class="qc-loading__actions"><a href="#" onclick="${retry};return false">重新读取</a></div>` : '');
}

// ---------- 全部角色（与主册同一份角色、同一顺序） ----------
let rolePage = 1, roleLoaded = 0, roleTotal = 0, roleQ = '', roleBusy = false, roleTimer = null;
function roleHTML(c, s){
  const cover = s && s.cover
    ? `<img src="${esc(s.cover)}" alt="${esc(c.name)} 的同人图" loading="lazy" decoding="async">`
    : `<span class="role-empty"><b>${esc((c.name || '?')[0])}</b>还没有同人图</span>`;
  const count = s && s.count ? `<span class="qc-tag qc-tag--gold">${s.count} 张同人图</span>` : '<span class="qc-tag">上传第一张</span>';
  return `<a class="qc-card qc-card--hover role" href="works.html?cid=${c.id}">
    <div class="role-cover">${cover}</div>
    <div class="role-body"><div class="role-name">${esc(c.name)}</div>
      <div class="role-meta"><span>${esc(c.type || '')}</span>${count}</div></div>
  </a>`;
}
async function loadRoles(reset = true){
  if (roleBusy) return; roleBusy = true;
  if (reset) { rolePage = 1; roleLoaded = 0; $('roleGrid').innerHTML = ''; setState($('listState'), '正在读取角色…'); }
  else rolePage++;
  const params = new URLSearchParams({ limit: ROLE_PAGE, page: rolePage });
  if (roleQ) params.set('q', roleQ);
  try {
    const d = await (await fetch('/api/official/characters?' + params)).json();
    const list = d.characters || []; roleTotal = d.total || 0;
    let summary = {};
    if (list.length) summary = (await (await fetch('/api/official/fanart/summary?cids=' + list.map(c => c.id).join(','))).json()).summary || {};
    $('roleGrid').insertAdjacentHTML('beforeend', list.map(c => roleHTML(c, summary[String(c.id)])).join(''));
    roleLoaded += list.length;
    $('stat').textContent = roleTotal ? `共 ${roleTotal} 位官方角色 · 点进角色即可浏览和上传同人图` : '';
    setState($('listState'), roleTotal ? '' : '没有匹配的角色。');
    $('roleMore').hidden = roleLoaded >= roleTotal;
    $('roleMore').textContent = `加载更多 · 已显示 ${roleLoaded}/${roleTotal}`;
  } catch (e) {
    if (reset) setState($('listState'), '角色列表没有读到，可能是网络不稳。', 'alert', 'loadRoles(true)');
    else { rolePage--; RFX.toast('⚠ 加载更多失败，请稍后再试'); }
  }
  roleBusy = false;
}
function onSearch(v){ roleQ = (v || '').trim(); clearTimeout(roleTimer); roleTimer = setTimeout(() => loadRoles(true), 300); }

// ---------- 单个角色的同人图（按喜欢数排序，同数时新上传的在前） ----------
let artOffset = 0, artTotal = 0, artBusy = false, pickedFile = null;
function artHTML(it){
  RFX.seed(it.id, it);  // 喜欢 / 点赞 / 踩 与主册角色页共用
  return `<article class="qc-card art" data-id="${it.id}">
    <img class="art-img" data-original-image src="${esc(it.image_url)}" alt="${esc(it.caption || '同人图')}" loading="lazy" decoding="async">
    <div class="art-body">
      ${it.caption ? `<p class="art-cap">${esc(it.caption)}</p>` : ''}
      <div class="art-meta"><span>by ${esc(it.user_name)}</span><span>${esc(String(it.created_at || '').slice(0, 10))}</span></div>
      <div class="art-acts">${RFX.bar('fanart', it.id)}</div>
      <div class="art-acts">
        <button type="button" class="qc-btn qc-btn--sm qc-btn--ghost" aria-expanded="false" onclick="toggleCmts(${it.id}, this)">评论 <span class="cmt-n">${it.sub_comments}</span></button>
        ${it.can_delete ? `<button type="button" class="qc-btn qc-btn--sm qc-btn--danger" onclick="delArt(${it.id}, this)">删除</button>` : ''}</div>
      <div class="cmts" id="cmts${it.id}" hidden></div>
    </div>
  </article>`;
}
async function loadArt(reset = true){
  if (artBusy) return; artBusy = true;
  if (reset) { artOffset = 0; $('artGrid').innerHTML = ''; setState($('artState'), '正在读取同人图…'); }
  try {
    const d = await (await fetch(`/api/official/fanart?cid=${cid}&sort=popular&limit=${ART_PAGE}&offset=${artOffset}&_=${Date.now()}`)).json();
    const items = d.items || []; artTotal = d.total || 0;
    $('artGrid').insertAdjacentHTML('beforeend', items.map(artHTML).join(''));
    artOffset += items.length;
    $('artStat').textContent = artTotal ? `共 ${artTotal} 张 · 按「点赞 + 喜欢 − 踩×2」排序，同分时新上传的在前` : '';
    setState($('artState'), artTotal ? '' : '还没有同人图，来做第一个上传的人吧。');
    $('artMore').hidden = artOffset >= artTotal;
    $('artMore').textContent = `加载更多 · 还有 ${artTotal - artOffset} 张`;
  } catch (e) {
    if (reset) setState($('artState'), '同人图没有读到，可能是网络不稳。', 'alert', 'loadArt(true)');
    else RFX.toast('⚠ 加载更多失败，请稍后再试');
  }
  artBusy = false;
}
function msg(text, cls){ const m = $('upMsg'); m.className = 'message' + (cls ? ' ' + cls : ''); m.textContent = text || ''; }
async function loggedIn(){ try { return !!(await (await fetch('/api/user')).json()).logged_in; } catch (e) { return false; } }
async function choose(){
  if (!(await loggedIn())) { RFX.toast('登录后才能上传同人图哦～', { label: '去登录', run: () => { location.href = '/?openauth=1'; } }); return; }
  $('pickFile').click();
}
$('pick').addEventListener('click', choose);
$('pick').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); } });
$('pickFile').addEventListener('change', e => {
  pickedFile = e.target.files[0] || null;
  if (pickedFile) { $('pickPreview').src = URL.createObjectURL(pickedFile); $('pickPreview').hidden = false; $('pickText').textContent = pickedFile.name; msg(''); }
});
async function submitArt(e){
  e.preventDefault();
  if (!pickedFile) { msg('请先选择图片', 'err'); return false; }
  if (!$('ack').checked) { msg('请先勾选「公开档案图」确认', 'err'); return false; }
  const btn = $('upBtn'); btn.disabled = true; btn.setAttribute('aria-busy', 'true'); msg('上传中…');
  try {
    const blob = await HuiguanImages.shrink(pickedFile);
    const file = blob === pickedFile ? pickedFile : new File([blob], pickedFile.name.replace(/\.[^.]+$/, '') + (blob.type === 'image/webp' ? '.webp' : '.jpg'), { type: blob.type });
    await HuiguanImages.request('/api/official/fanart/upload', { character_id: cid, caption: $('caption').value.trim() }, file, { gifLimit: GIF_LIMIT });
    $('upForm').reset(); pickedFile = null; $('pickPreview').hidden = true; $('pickText').textContent = '点击选择图片（JPG / PNG / WebP / GIF，≤8MB）';
    msg('上传成功，已发布到图廊 ✔', 'ok');
    loadArt(true);
  } catch (err) {
    if (err.status === 401) msg('请先登录后再上传', 'err');
    else msg(err.message || '上传失败，请重试', 'err');
  } finally { btn.disabled = false; btn.removeAttribute('aria-busy'); }
  return false;
}
// ---------- 副册评论（thread=sub，与主册角色页评论分开存储、分开显示） ----------
async function toggleCmts(id, btn){
  const box = $('cmts' + id);
  box.hidden = !box.hidden; btn.setAttribute('aria-expanded', String(!box.hidden));
  if (!box.hidden) await renderCmts(id);
}
async function renderCmts(id){
  const box = $('cmts' + id);
  box.innerHTML = '<span class="qc-hint">加载中…</span>';
  let list = [];
  try { list = (await (await fetch(`/api/official/fanart/comments?thread=sub&id=${id}&_=${Date.now()}`)).json()).comments || []; } catch (e) {}
  box.innerHTML = (list.length ? list.map(c => `<div class="cmt"><b>${esc(c.user_name)}</b>：${esc(c.content)}<small>${esc(String(c.created_at || '').slice(0, 10))}</small>${c.can_delete ? `<button type="button" onclick="delCmt(${id}, ${c.id})">删除</button>` : ''}</div>`).join('') : '<span class="qc-hint">还没有评论，说说你对这张图的看法吧。</span>') +
    `<form class="cmt-form" onsubmit="return addCmt(event, ${id})"><input class="qc-input" maxlength="300" placeholder="评论这张同人图…" aria-label="评论这张同人图"><button class="qc-btn qc-btn--sm" type="submit">发送</button></form>`;
}
function setCmtCount(id, n){ const b = document.querySelector(`.art[data-id="${id}"] .cmt-n`); if (b) b.textContent = n; }
async function addCmt(e, id){
  e.preventDefault();
  const input = e.target.querySelector('input'), content = input.value.trim();
  if (!content) return false;
  try {
    const r = await fetch('/api/official/fanart/comment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, content, thread: 'sub' }) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { RFX.toast('登录后才能评论哦～', { label: '去登录', run: () => { location.href = '/?openauth=1'; } }); return false; }
    if (!d.ok) throw new Error(d.error || '评论失败');
    setCmtCount(id, d.count); await renderCmts(id);
  } catch (err) { RFX.toast('⚠ ' + (err.message || '评论失败')); }
  return false;
}
async function delCmt(id, cmtId){
  if (!confirm('确定删除这条评论？')) return;
  try {
    const d = await (await fetch('/api/official/fanart/comment/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: cmtId, thread: 'sub' }) })).json();
    if (!d.ok) throw new Error(d.error || '删除失败');
    setCmtCount(id, d.count); await renderCmts(id);
  } catch (err) { RFX.toast('⚠ ' + (err.message || '删除失败')); }
}

async function delArt(id, btn){
  if (!confirm('确定删除这张图吗？它在主册和副册的评论，以及点赞 / 喜欢 / 踩都会一起删除。')) return;
  btn.disabled = true;
  try {
    const d = await (await fetch('/api/official/fanart/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })).json();
    if (!d.ok) throw new Error(d.error || '删除失败');
    RFX.toast('已删除'); loadArt(true);
  } catch (err) { btn.disabled = false; RFX.toast('⚠ ' + (err.message || '删除失败')); }
}

async function initChar(){
  $('listView').hidden = true; $('charView').hidden = false;
  $('mainLink').href = 'char.html?id=' + cid;
  try {
    const d = await (await fetch('/api/official/character?id=' + cid)).json();
    const name = d.character && d.character.name;
    if (!name) throw new Error('missing');
    $('charName').textContent = name; document.title = name + ' · 官方角色同人画廊 · 西木会馆';
  } catch (e) {
    $('charName').textContent = '找不到这个角色'; $('upForm').hidden = true;
    setState($('artState'), '这个角色不存在或已合并，请回到全部角色重新选择。', 'alert');
    return;
  }
  loadArt(true);
}
if (cid) initChar(); else loadRoles(true);
</script>
<script src="/shared/shared-ui/site-nav.js?v=20261025-navfix"></script>
<script src="/original-image-viewer.js?v=20261022-1"></script>
