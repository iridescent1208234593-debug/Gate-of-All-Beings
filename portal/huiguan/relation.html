<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>人物关系图 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f5f0e8;--panel:#fbf8f2;--border:#d4cfbe;--text:#3a4a3e;--dim:#7a8a7e;--accent:#5a9e8f;--gold:#d4a840}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;padding:48px 16px 60px}
.wrap{max-width:1200px;margin:0 auto}
.back{display:inline-block;margin-bottom:12px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
h1{font-size:22px;letter-spacing:3px;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:13px;margin-bottom:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;font-family:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.stat{color:var(--dim);font-size:12px}
#chart{width:100%;height:640px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.tip{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.7}
.loading{text-align:center;padding:60px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="gallery.html">← 返回角色画廊</a>
  <h1>人物关系图</h1>
  <p class="subtitle">罗小黑战记 · 官方角色关系网络 · 拖拽节点 / 滚轮缩放 / 点击节点查看角色</p>
  <div class="toolbar">
    <input class="search" id="search" placeholder="搜索角色并高亮其关系…" oninput="focusChar(this.value)">
    <span class="stat" id="stat"></span>
  </div>
  <div id="chart"><div class="loading">加载关系中…</div></div>
  <div class="tip">颜色按物种类别区分：人类（金）/ 妖精（绿）/ 动物（棕）/ 同人角色（紫色虚线框）/ 非角色（灰色方形）。拥有神/仙身份的节点叠加标识：「神·」「仙·」标签前缀，神为菱形、仙为三角。连线标注关系（师徒 / 同门 / 亲友 / 敌对 等）。点击节点跳转到该角色详情页；搜索可高亮某角色及其直接关系。</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script src="https://iridescently.xyz/shared/shared-ui/site-nav.js?v=20261025-navfix"></script>
<script>
let chart=null, nodes=[], edges=[], byName={};
const CAT_COLOR={'人类':'#d4a840','妖精':'#5a9e8f','动物':'#c08050','神':'#e0b63a','同人角色':'#8a7fb5','非角色':'#9a9a9a'};
const CAT_INDEX={'人类':0,'妖精':1,'动物':2,'神':3,'同人角色':4,'非角色':5};
const catOf = n => (n.category && CAT_COLOR[n.category]) ? n.category : (n.type.includes('人类')?'人类':n.type.includes('妖精')?'妖精':'其他');
const catColor = c => CAT_COLOR[c] || '#8a7f6a';
const deityOf = n => (n.deity==='神'||n.deity==='仙') ? n.deity : '';
async function init(){
  if(!window.echarts){ document.getElementById('chart').innerHTML='<div class="loading">图谱库加载失败，请检查网络后刷新。</div>'; return; }
  try{
    const r=await fetch('/api/official/graph'); const d=await r.json();
    nodes=d.nodes||[]; edges=d.edges||[];
    document.getElementById('stat').textContent=`${nodes.length} 个角色 · ${edges.length} 条关系`;
    nodes.forEach(n=>byName[n.name]=n);
    render();
  }catch(e){ document.getElementById('chart').innerHTML='<div class="loading">加载失败，请刷新。</div>'; }
}
function render(highlight){
  const el=document.getElementById('chart'); el.innerHTML='';
  chart=echarts.init(el);
  const linked=new Set(); edges.forEach(e=>{linked.add(e.source);linked.add(e.target);});
  const data=nodes.map(n=>{
    const cat=catOf(n);
    const deity=deityOf(n);
    const sym= cat==='非角色' ? 'rect' : (deity==='神' ? 'diamond' : (deity==='仙' ? 'triangle' : (n.avatar ? ('image://'+n.avatar) : 'circle')));
    const base = cat==='非角色' ? 22 : (deity==='神' ? 32 : (deity==='仙' ? 30 : 26));
    return {
      id:String(n.id), name:n.name,
      symbol:sym,
      symbolSize: linked.has(n.id)? (n.id===highlight?64:44): base,
      category: CAT_INDEX[cat] ?? 2,
      itemStyle:{ color:catColor(cat), borderColor:catColor(cat), borderWidth:2, borderType: cat==='同人角色'?'dashed':'solid', opacity: highlight==null||n.id===highlight?1:0.25 },
      label:{ show:true, position:'bottom', fontSize: n.id===highlight?13:10, color:'#3a4a3e', opacity: highlight==null||n.id===highlight?1:0.2, formatter: deity ? (deity+'·'+n.name) : n.name },
      _raw:n
    };
  });
  const hlSet=new Set();
  if(highlight!=null){ hlSet.add(highlight); edges.forEach(e=>{ if(e.source===highlight)hlSet.add(e.target); if(e.target===highlight)hlSet.add(e.source); }); }
  const links=edges.map(e=>({
    source:String(e.source), target:String(e.target), label:{ show: highlight!=null ? (e.source===highlight||e.target===highlight):false, formatter:e.label, fontSize:10, color:'#7a8a7e' },
    lineStyle:{ color:'#b9b0a0', width: highlight!=null && (e.source===highlight||e.target===highlight)?2:1, opacity: highlight==null?0.6:( (e.source===highlight||e.target===highlight)?0.95:0.12 ), curveness:0.12 }
  }));
  chart.setOption({
    tooltip:{ formatter:p=> p.dataType==='node' ? `<b>${p.name}</b><br/>${p.data._raw.category||p.data._raw.type||''}${p.data._raw.species?' · '+p.data._raw.species:''}<br/><span style="color:#999">点击查看角色详情</span>` : (p.data.label&&p.data.label.formatter||'') },
    legend:{ data:['人类','妖精','动物','神','同人角色','非角色'], bottom:6, textStyle:{color:'#7a8a7e'} },
    color:['#d4a840','#5a9e8f','#c08050','#e0b63a','#8a7fb5','#9a9a9a'],
    series:[{
      type:'graph', layout:'force', data:data, links:links,
      categories:[{name:'人类',itemStyle:{color:'#d4a840'}},{name:'妖精',itemStyle:{color:'#5a9e8f'}},{name:'动物',itemStyle:{color:'#c08050'}},{name:'神',itemStyle:{color:'#e0b63a'}},{name:'同人角色',itemStyle:{color:'#8a7fb5'}},{name:'非角色',itemStyle:{color:'#9a9a9a'}}],
      roam:true, draggable:true,
      force:{ repulsion:220, edgeLength:[60,140], gravity:0.08 },
      emphasis:{ focus:'adjacency', lineStyle:{width:3} },
      edgeLabel:{ show:false }
    }]
  });
  chart.on('click', p=>{ if(p.dataType==='node' && p.data._raw) location.href='char.html?id='+encodeURIComponent(p.data._raw.id); });
  window.addEventListener('resize', ()=>chart && chart.resize());
}
function focusChar(q){
  q=(q||'').trim();
  if(!q){ render(null); return; }
  const hit=nodes.find(n=>n.name && n.name.includes(q)) || nodes.find(n=>(n.species||'').includes(q));
  render(hit? hit.id : null);
}
init();
</script>
</body>
</html>
