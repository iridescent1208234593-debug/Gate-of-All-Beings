<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>个人账户 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="/design-system/design-system.css">
<style>
:root{--bg:#f5f0e8;--panel:#fbf8f2;--border:#d4cfbe;--text:#3a4a3e;--dim:#7a8a7e;--accent:#5a9e8f;--gold:#d4a840;--danger:#b3543f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;padding:48px 16px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;letter-spacing:3px}
h1 small{font-size:12px;color:var(--dim);margin-left:10px;letter-spacing:1px}
.back{display:inline-block;margin-bottom:14px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;letter-spacing:2px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.row .k{color:var(--dim)}
.tag{display:inline-block;padding:1px 10px;border-radius:4px;font-size:12px;border:1px solid var(--border);color:var(--dim)}
.tag.gold{background:rgba(212,168,64,.15);border-color:var(--gold);color:var(--gold)}
.tag.green{background:rgba(90,158,143,.12);border-color:var(--accent);color:var(--accent)}
.btn{font-family:inherit;font-size:13px;cursor:pointer;padding:7px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;transition:all .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
.state-box{text-align:center;padding:60px;color:var(--dim)}
.schemes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);background:transparent;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex-shrink:0}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input[type=color]{width:42px;height:32px;border:1px solid var(--border);border-radius:6px;background:transparent;padding:2px;cursor:pointer}
.hex-in{width:92px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;color:var(--text);background:var(--bg)}
.theme-prev{border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;background:var(--bg);min-height:52px}
.theme-prev .btn{pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回会馆</a>
  <h1>个人账户<small>西木会馆 · iridescently.xyz</small></h1>
  <div id="content"><div class="state-box">加载中…</div></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const roleName={executor:'执行者',elder:'长老',admin:'管理员'};
async function init(){
  try{
    const r=await fetch('/api/user'); const u=await r.json();
    if(!u.logged_in){document.getElementById('content').innerHTML='<div class="state-box">请先登录后管理账户。<br><a href="/" style="color:var(--gold)">去登录 / 注册</a></div>';return;}
    const emailRes=await fetch('/api/account/email');
    const emailState=emailRes.ok?await emailRes.json():{email:'',verified:false,pending:false};
    render(u,emailState);
    const token=new URLSearchParams(location.hash.slice(1)).get('verify-email');
    if(token){
      history.replaceState(null,'',location.pathname+location.search);
      const result=await fetch('/api/account/email/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const data=await result.json();
      alert(data.ok?'邮箱验证成功：'+data.email:(data.error||'邮箱验证失败'));
      if(data.ok)init();
    }
  }catch(e){document.getElementById('content').innerHTML='<div class="state-box">加载失败，请刷新。</div>';}
}
function render(u,emailState){
  const isElder=u.role==='elder', isAdmin=u.is_admin, isScribe=u.edit_role==='scribe';
  const curP=((u.theme_primary||'#f5f0e8').match(/^#[0-9a-fA-F]{6}$/)?u.theme_primary:'#f5f0e8').toLowerCase();
  const curA=((u.theme_accent||'#5a9e8f').match(/^#[0-9a-fA-F]{6}$/)?u.theme_accent:'#5a9e8f').toLowerCase();
  document.getElementById('content').innerHTML=`
    <div class="qc-card" style="margin-bottom:var(--qc-sp-4)">
      <h2 class="qc-h2">账户安全</h2>
      <p class="qc-hint">设置找回问题、修改密码，或检查你的站内登录账号。</p>
      <a class="qc-btn" href="/security.html" style="margin-top:var(--qc-sp-3)">管理账户安全</a>
    </div>
    <div class="card" id="email-binding">
      <h2>邮箱验证</h2>
      ${emailState.verified?`<div class="row"><span class="k">已验证邮箱</span><span>${esc(emailState.email)} <span class="tag green">可用于账号找回</span></span></div>`:'<div class="hint">绑定并验证一个常用邮箱，可用于找回站内账号名和重置密码。旧资料中的邮箱不会自动视为已验证。</div>'}
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input id="accountEmail" type="email" maxlength="254" autocomplete="email" placeholder="${emailState.verified?'输入新邮箱以更换':'你的邮箱地址'}" value="" style="flex:1;min-width:0;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:14px;">
        <button class="btn" id="emailSend" onclick="sendEmailVerification()">发送验证链接</button>
      </div>
      <div class="hint">验证链接 30 分钟有效；旧邮箱在新邮箱验证成功前保持绑定。</div>
      <div class="hint" id="emailHint">${emailState.pending?'已有一封待验证邮件，请检查收件箱。':''}</div>
      <div class="err" id="emailErr"></div>
    </div>
    <div class="card">
      <h2>身份信息</h2>
      <div class="row"><span class="k">昵称</span><span>${esc(u.nickname||u.username)}</span></div>
      <div class="row"><span class="k">账号类型</span><span>${u.kind==='local'?'站内账号':'USSO 账号'}</span></div>
      <div class="row"><span class="k">会馆身份</span><span class="tag ${isAdmin?'gold':isElder?'green':''}">${roleName[u.role]||'执行者'}</span></div>
      <div class="row"><span class="k">编辑权限</span><span class="tag ${isScribe?'green':''}">${isScribe?'编辑（可直接修订设定）':'无'}</span></div>
    </div>
    <div class="card">
      <h2>等级与积分</h2>
      <div class="row"><span class="k">当前等级</span><span class="tag gold">Lv.${u.level||1} <span style="color:var(--dim)">/ 100</span></span></div>
      <div class="row"><span class="k">积分</span><span>${u.points||0}</span></div>
      <div class="hint">升级方式：成功提交人设表 +20 分；使用自定义配色 +10 分。每 10 分升 1 级，最高 100 级。多探索站点功能可更快升级。</div>
    </div>
    <div class="card">
      <h2>改名</h2>
      <div class="row"><span class="k">当前昵称</span><span>${esc(u.nickname||u.username)}</span></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input id="renameInput" placeholder="输入新昵称" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:14px;">
        <button class="btn" onclick="doRename()">改名</button>
      </div>
      <div class="hint">昵称全站唯一，每 3 天可改一次。</div>
      <div class="err" id="renameErr"></div>
    </div>
    <div class="card">
      <h2>身份申请</h2>
      <div class="row"><span class="k">会馆长老</span>${elderBtn(u)}</div>
      <div class="hint">长老：御灵系可选 2 系、年龄上限 1500 岁；可管理执行者与编辑。需申请并经馆长批准。</div>
      <div class="row" style="margin-top:10px;"><span class="k">编辑（审查补充世界观）</span>${scribeBtn(u)}</div>
      <div class="hint">编辑：可直接编辑/补充官方角色设定（所有改动留版本记录）。需申请并经长老/管理员批准。</div>
      <div class="row" style="margin-top:10px;"><span class="k">突破年龄限制</span>${exemptBtn(u,'age')}</div>
      <div class="hint">获批后，可在人设登记表"年龄"旁勾选突破年龄限制，解除 450/1500 岁上限。</div>
      <div class="row" style="margin-top:10px;"><span class="k">突破技能选择限制</span>${exemptBtn(u,'skill')}</div>
      <div class="hint">获批后，可在人设登记表"能力"旁勾选突破选择限制，解除御灵系/大系数量限制。</div>
      <div class="err" id="applyErr"></div>
    </div>
    <div class="card">
      <h2>外观配色</h2>
      <div class="hint" style="margin-bottom:10px;">设置你的专属主题色。psy 题库站等子站登录后将跟随该配色；未设置时默认宣纸乳白（#f5f0e8 × #5a9e8f）。</div>
      <div class="schemes" id="schemeGrid">
        ${COLOR_SCHEMES.map((s,i)=>`<button type="button" class="chip ${curP===s.primary.toLowerCase()&&curA===s.accent.toLowerCase()?'on':''}" data-i="${i}" onclick="pickScheme(${i})" title="${esc(s.name)}"><span class="dot" style="background:${s.primary}"></span><span class="dot" style="background:${s.accent}"></span><span class="nm">${esc(s.name)}</span></button>`).join('')}
      </div>
      <div class="row" style="margin-top:12px;"><span class="k">主色</span><input type="color" id="tp" value="${curP}" oninput="syncThemeInputs()"><input class="hex-in" id="tpHex" value="${curP}" oninput="syncThemeInputs()"></div>
      <div class="row"><span class="k">辅色</span><input type="color" id="ta" value="${curA}" oninput="syncThemeInputs()"><input class="hex-in" id="taHex" value="${curA}" oninput="syncThemeInputs()"></div>
      <div class="theme-prev" id="themePrev"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn" onclick="saveTheme()">保存配色</button>
        <button class="btn ghost" onclick="resetTheme()">恢复默认宣纸乳白</button>
      </div>
      <div class="hint" id="themeHint"></div>
      <div class="err" id="themeErr"></div>
    </div>
    <div class="card">
      <h2>登录方式</h2>
      <div class="row"><span class="k">当前账户</span><span>${u.kind==='usso'?'<span class="tag">既有 USSO 账户</span>':'<span class="tag green">会馆站内账号</span>'}</span></div>
      <div class="hint">USSO 新登录与绑定暂时停用。既有账户资料和角色记录保留；跨站会话仍由共享会话服务处理。</div>
    </div>
  `;
  updatePrev();
}
async function sendEmailVerification(){
  const input=document.getElementById('accountEmail'), button=document.getElementById('emailSend');
  const hint=document.getElementById('emailHint'), err=document.getElementById('emailErr');
  err.textContent=''; hint.textContent='';
  if(!input.value.trim()){err.textContent='请输入邮箱地址';input.focus();return;}
  button.disabled=true;
  try{
    const r=await fetch('/api/account/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:input.value.trim()})});
    const d=await r.json();
    if(d.ok)hint.textContent=d.message||'验证链接已发送，请检查收件箱。';
    else err.textContent=d.error||'发送失败';
  }catch(e){err.textContent='网络错误，请稍后重试';}
  finally{button.disabled=false;}
}
function elderBtn(u){
  if(u.role==='elder'||u.is_admin) return '<span class="tag green">已是长老/管理员</span>';
  if(u.elder_pending) return '<span class="tag">审核中</span>';
  return '<button class="btn" onclick="applyElder()">申请长老</button>';
}
function scribeBtn(u){
  if(u.edit_role==='scribe'||u.is_admin) return '<span class="tag green">已有编辑权限</span>';
  if(u.scribe_pending) return '<span class="tag">审核中</span>';
  return '<button class="btn" onclick="applyScribe()">申请编辑</button>';
}
function exemptBtn(u,type){
  const has = type==='age' ? u.exempt_age : u.exempt_skill;
  const pend = type==='age' ? u.exempt_age_pending : u.exempt_skill_pending;
  if(has) return '<span class="tag green">已突破</span>';
  if(pend) return '<span class="tag">审核中</span>';
  return `<button class="btn" onclick="applyExempt('${type}')">申请</button>`;
}
async function applyExempt(type){
  const label = type==='age' ? '突破年龄限制' : '突破技能选择限制';
  const msg=(prompt(`申请${label}的理由（选填）：`)||'').trim();
  const err=document.getElementById('applyErr'); err.textContent='';
  try{
    const r=await fetch('/api/exempt/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,message:msg})});
    const d=await r.json();
    if(d.ok){alert('✔ '+(d.msg||'申请已提交，等待审批。')); init();}
    else err.textContent=d.error||'申请失败';
  }catch(e){err.textContent='网络错误';}
}
async function doRename(){
  const nn=(document.getElementById('renameInput').value||'').trim();
  const err=document.getElementById('renameErr'); err.textContent='';
  if(!nn){err.textContent='请输入新昵称';return;}
  try{
    const r=await fetch('/api/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:nn})});
    const d=await r.json();
    if(d.ok){alert('✔ 昵称已改为「'+(d.nickname||nn)+'」');init();}
    else err.textContent=d.error||'改名失败';
  }catch(e){err.textContent='网络错误';}
}
async function applyElder(){
  if(!confirm('申请【长老】前请确认：\n1. 已加入西木会馆交流群（QQ群：878029597，微信群二维码见页脚/画廊）；\n2. 长老/编辑权限可修改、删除官方设定，请务必谨慎，避免误删数据。\n确认继续申请？'))return;
  const msg=(prompt('申请长老的理由（选填，300 字内）：')||'').trim();
  const err=document.getElementById('applyErr'); err.textContent='';
  try{
    const r=await fetch('/api/elder/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json();
    if(d.ok){alert('✔ 长老申请已提交，等待馆长审批。');init();}
    else err.textContent=d.error||'申请失败';
  }catch(e){err.textContent='网络错误';}
}
async function applyScribe(){
  if(!confirm('申请【编辑】前请确认：\n1. 已加入西木会馆交流群（QQ群：878029597，微信群二维码见页脚/画廊）；\n2. 编辑权限可修改、删除官方设定，请务必谨慎，避免误删数据。\n确认继续申请？'))return;
  const msg=(prompt('申请编辑的理由（选填，说明你如何补充世界观内容）：')||'').trim();
  const err=document.getElementById('applyErr'); err.textContent='';
  try{
    const r=await fetch('/api/official/scribe-apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json();
    if(d.ok){alert('✔ 编辑申请已提交，等待长老/管理员审批。');init();}
    else err.textContent=d.error||'申请失败';
  }catch(e){err.textContent='网络错误';}
}
// ---------- 外观配色 ----------

  { name: '鹿野·黛蓝×缟白', primary: '#3B3561', primaryDark: '#242042', accent: '#F0EFEB', accentLight: '#F6F5F2', accentPale: '#FBFAF8', text: '#E6E4F0', dim: '#8B87A6', line: 'rgba(240,239,235,0.25)' },

  { name: '靛蓝×藕荷色', primary: '#065279', primaryDark: '#033148', accent: '#E4C6D0', accentLight: '#f1e2e7', accentPale: '#f6edf0', text: '#dce3e4', dim: '#678ca6', line: 'rgba(228,198,208,0.25)' },
  { name: '黧×樱草色', primary: '#5D513C', primaryDark: '#373024', accent: '#EAFF56', accentLight: '#f4ffaa', accentPale: '#f8ffcc', text: '#e9e3db', dim: '#978b85', line: 'rgba(234,255,86,0.25)' },
  { name: '水绿×葱青', primary: '#D4F2E7', primaryDark: '#7f918a', accent: '#3E6E4E', accentLight: '#9eb6a6', accentPale: '#c3d3ca', text: '#2a3a2e', dim: '#6e8a78', line: 'rgba(62,110,78,0.25)' },
  { name: '苍黄×丁香色', primary: '#2E5C48', primaryDark: '#1C392C', accent: '#CCA4E3', accentLight: '#e5d1f1', accentPale: '#efe3f6', text: '#e2e4dc', dim: '#7d918b', line: 'rgba(204,164,227,0.25)' }
];
function currentThemeVals(){
  let p=(document.getElementById('tpHex').value||'').trim();
  let a=(document.getElementById('taHex').value||'').trim();
  if(!/^#[0-9a-fA-F]{6}$/.test(p)) p='#f5f0e8';
  if(!/^#[0-9a-fA-F]{6}$/.test(a)) a='#5a9e8f';
  p=p.toLowerCase(); a=a.toLowerCase();
  document.getElementById('tp').value=p;
  document.getElementById('ta').value=a;
  document.getElementById('tpHex').value=p;
  document.getElementById('taHex').value=a;
  return {p:p,a:a};
}
function updatePrev(){
  const {p,a}=currentThemeVals();
  const prev=document.getElementById('themePrev');
  if(!prev) return;
  prev.style.background=p;
  prev.innerHTML=`<span class="btn" style="background:${a};border-color:${a};color:#fff;">预览按钮</span> <span class="btn ghost" style="border-color:${a};color:${a};background:transparent;">描边</span> <span style="margin-left:8px;font-size:12px;color:${a};">${a}</span>`;
  document.querySelectorAll('#schemeGrid .chip').forEach(ch=>{
    const s=COLOR_SCHEMES[+ch.dataset.i];
    if(s) ch.classList.toggle('on', s.primary.toLowerCase()===p && s.accent.toLowerCase()===a);
  });
}
function syncThemeInputs(){
  const src=document.activeElement;
  const tp=document.getElementById('tp'), tpHex=document.getElementById('tpHex');
  const ta=document.getElementById('ta'), taHex=document.getElementById('taHex');
  if(src===tp) tpHex.value=tp.value;
  if(src===ta) taHex.value=ta.value;
  if(src===tpHex && /^#[0-9a-fA-F]{6}$/.test(tpHex.value.trim())) tp.value=tpHex.value.trim();
  if(src===taHex && /^#[0-9a-fA-F]{6}$/.test(taHex.value.trim())) ta.value=taHex.value.trim();
  updatePrev();
}
function pickScheme(i){
  const s=COLOR_SCHEMES[i];
  if(!s) return;
  document.getElementById('tp').value=s.primary;
  document.getElementById('ta').value=s.accent;
  document.getElementById('tpHex').value=s.primary;
  document.getElementById('taHex').value=s.accent;
  updatePrev();
}
async function saveTheme(){
  const err=document.getElementById('themeErr'); err.textContent='';
  const hint=document.getElementById('themeHint'); hint.textContent='';
  const vals=currentThemeVals();
  try{
    const r=await fetch('/api/user/theme',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({primary:vals.p,accent:vals.a})});
    const d=await r.json();
    if(d.ok){hint.textContent='✔ 配色已保存：psy 题库站等子站登录后将跟随该配色。'; updatePrev();}
    else err.textContent=d.error||'保存失败';
  }catch(e){err.textContent='网络错误';}
}
function resetTheme(){
  document.getElementById('tp').value='#f5f0e8';
  document.getElementById('ta').value='#5a9e8f';
  document.getElementById('tpHex').value='#f5f0e8';
  document.getElementById('taHex').value='#5a9e8f';
  updatePrev();
  saveTheme();
}
init();
</script>
