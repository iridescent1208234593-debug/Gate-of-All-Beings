<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>角色详情 · 西木会馆</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f5f0e8;--panel:#fbf8f2;--border:#d4cfbe;--text:#3a4a3e;--dim:#7a8a7e;--accent:#5a9e8f;--gold:#d4a840;--danger:#b3543f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;padding:48px 16px 80px}
.wrap{max-width:820px;margin:0 auto}
.back{display:inline-block;margin-bottom:16px;color:var(--dim);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:26px;letter-spacing:2px;margin-bottom:4px}
.hero .sub{color:var(--dim);font-size:14px}
.gallery{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}
.gallery img{width:180px;height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;transition:transform .15s}
.gallery img:hover{transform:scale(1.04)}
.gallery .placeholder{width:180px;height:180px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--dim);background:var(--panel)}
.gal-more{font-family:inherit;font-size:13px;cursor:pointer;padding:8px 26px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);transition:all .15s}
.gal-more:hover{background:var(--accent);color:#fff}
section{margin-bottom:28px}
section h2{font-size:16px;letter-spacing:2px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.info-table{width:100%;border-collapse:collapse;font-size:14px}
.info-table td{padding:8px 12px;border-bottom:1px solid var(--border)}
.info-table td:first-child{width:100px;color:var(--dim);white-space:nowrap}
.info-table td:last-child{text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 12px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:var(--panel)}
.rel-item{margin-bottom:8px;font-size:14px;line-height:1.7}
.rel-item .rtype{color:var(--gold);font-weight:600;margin-right:6px}
.event-item{margin-bottom:4px;font-size:14px;line-height:1.7;padding-left:16px;position:relative}
.event-item::before{content:'▸';position:absolute;left:0;color:var(--accent)}
.completeness{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;margin-left:10px}
.c-high{background:rgba(90,158,143,.15);color:var(--accent)}
.c-mid{background:rgba(212,168,64,.12);color:var(--gold)}
.c-low{background:rgba(179,84,63,.10);color:var(--danger)}
#lightbox{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(10,14,12,.88);cursor:zoom-out;padding:24px}
#lightbox.show{display:flex}
#lightbox img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
.loading{text-align:center;padding:80px;color:var(--dim);font-size:16px}
.error-box{text-align:center;padding:80px;color:var(--danger);font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">加载中…</div></div>
<div id="lightbox" onclick="this.classList.remove('show')"><img id="lbImg" alt=""></div>
<script src="/image-upload.js?v=20261013"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function badge(c){const cls=c>=6?'c-high':c>=4?'c-mid':'c-low';const t=c>=6?'设定完整':c>=4?'部分设定':'待补充';return `<span class="completeness ${cls}">${c}/8 · ${t}</span>`;}
function zoom(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('show');}

// ---- 渐进画廊：默认3张，展开每次+5 ----
const IMG_TYPES=[["wiki","设定图"],["portrait","立绘"],["sticker","表情包"],["story","剧情截图"],["other","其他"]];
function typeName(t){const m=IMG_TYPES.find(x=>x[0]===t);return m?m[1]:t;}
function typeOptions(cur){
  let o='';
  if(cur && !IMG_TYPES.some(x=>x[0]===cur)) o+=`<option value="${escAttr(cur)}" selected>原值：${esc(typeName(cur))}</option>`;
  IMG_TYPES.forEach(x=>{o+=`<option value="${x[0]}"${String(x[0])===String(cur)?' selected':''}>${x[1]}</option>`;});
  if(!cur) o=o.replace('<option value="wiki"','<option value="wiki" selected');
  return o;
}
let _galImgs=[], _galCid=null, _galName='', _galShown=0;
function _galImg(i){
  const im=_galImgs[i]; if(!im) return '';
  const fullUrl='/api/official/img-id?id='+im.id;
  return `<img src="${fullUrl}&t=1" data-full="${fullUrl}" alt="${esc(_galName)}" loading="lazy" decoding="async" onerror="this.style.display='none'" onclick="zoom(this.dataset.full)">`;
}
function initGallery(imgs,cid,name){
  _galImgs=imgs||[]; _galCid=cid; _galName=name||''; _galShown=0;
  const box=document.getElementById('galBox');
  if(!box) return;
  appendGal(3);
}
function appendGal(n){
  const box=document.getElementById('galBox');
  if(!box) return;
  const slice=_galImgs.slice(_galShown,_galShown+n);
  box.insertAdjacentHTML('beforeend', slice.map((_,k)=>_galImg(_galShown+k)).join(''));
  _galShown+=slice.length;
  updateGalMore();
}
function updateGalMore(){
  const wrap=document.getElementById('galMoreWrap');
  if(!wrap) return;
  const left=_galImgs.length-_galShown;
  wrap.innerHTML = left>0 ? `<button type="button" class="gal-more" onclick="appendGal(5)">展开更多 · 还有 ${left} 张</button>` : '';
}
function syncGallery(){
  const box=document.getElementById('galBox');
  const wrap=document.getElementById('galMoreWrap');
  _galImgs=_charImages? _charImages.slice() : [];
  _galShown=0;
  if(box){
    box.innerHTML='';
    if(_galImgs.length){
      appendGal(3);
    }else if(_charData&&_charData.character){
      const nm=_charData.character.name||'?';
      box.innerHTML=`<div class="placeholder">${esc((nm||'?')[0])}</div>`;
      if(wrap) wrap.innerHTML='';
    }else if(wrap){ wrap.innerHTML=''; }
  }else if(wrap){ wrap.innerHTML=''; }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').classList.remove('show');});

async function init(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  if(!id){location.href='gallery.html';return;}
  try{
    const r=await fetch('/api/official/character?id='+encodeURIComponent(id)+'&_='+Date.now());
    const d=await r.json();
    if(!r.ok){document.getElementById('app').innerHTML='<div class="error-box">'+esc(d.error||'加载失败')+'</div>';return;}
    const c=d.character||{};
    const abilities=d.abilities||[];
    const relations=d.relations||[];
    const images=d.images||[];
    const events=d.events||[];
    _charCid=String(c.id); _charData=d; _charImages=images.slice();
    const completeness=[c.type,c.species,c.age,c.personality,c.appearance,c.affiliation,c.abilities_summary,c.story_summary].filter(x=>x&&x.trim()).length;

    // 图片画廊（渐进加载：默认3张，展开每次+5）
    let gal='';
    if(images.length){
      gal='<div class="gallery" id="galBox"></div><div id="galMoreWrap" style="text-align:center;margin-top:10px"></div>';
    }else{
      gal=`<div class="gallery"><div class="placeholder">${esc((c.name||'?')[0])}</div></div>`;
    }

    // 能力标签
    let abilTags='';
    if(abilities.length){abilTags='<div class="tags">'+abilities.map(a=>`<span class="tag">${esc(a.ability)}${a.description?' — '+esc(a.description.substring(0,40)):''}</span>`).join('')+'</div>';}

    // 关系
    let relHTML='';
    if(relations.length){relHTML=relations.map(r=>`<div class="rel-item"><span class="rtype">${esc(r.relation_type||'关系')}</span>${esc(r.related_name||'')}：${esc(r.relation_desc||'')}</div>`).join('');}

    // 事件
    let evtHTML='';
    if(events.length){evtHTML=events.map(e=>`<div class="event-item">${esc(e.event)}</div>`).join('');}

    document.getElementById('app').innerHTML=`
      <a class="back" href="gallery.html">← 返回画廊</a>
      <a class="back" href="/" style="margin-left:14px">人设登记 →</a>
      <a class="back" href="relation.html" style="margin-left:14px;color:var(--gold)">人物关系图 →</a>
      <div class="hero">
        <h1>${esc(c.name)}${badge(completeness)}</h1>
        <div class="sub">${esc(c.type||'')}${c.species?' · '+esc(c.species):''}${c.aliases?' · '+esc(c.aliases):''}${c.is_elder?' · 会馆长老':''}</div>
      </div>
      ${gal}
      <section>
        <h2>基本档案</h2>
        <table class="info-table">
          <tr><td>性别</td><td>${esc(c.gender||'—')}</td><td>年龄</td><td>${esc(c.age||'—')}</td></tr>
          <tr><td>物种</td><td>${esc(c.species||'—')}${c.original_form?'（'+esc(c.original_form)+'）':''}</td><td>身高</td><td>${esc(c.height||'—')}</td></tr>
          <tr><td>所属</td><td>${esc(c.affiliation||'—')}</td><td>住所</td><td>${esc(c.residence||'—')}</td></tr>
          <tr><td>师父</td><td>${esc(c.master||'—')}</td><td>生日</td><td>${esc(c.birthday||'—')}</td></tr>
          <tr><td>瞳色</td><td>${esc(c.eye_color||'—')}</td><td>发色</td><td>${esc(c.hair_color||'—')}</td></tr>
          ${c.voice_actor?`<tr><td>配音</td><td>${esc(c.voice_actor)}</td><td>别名</td><td>${esc(c.aliases||'—')}</td></tr>`:''}
        </table>
      </section>
      ${c.personality?`<section><h2>性格</h2><p style="line-height:1.9;font-size:14px">${esc(c.personality)}</p></section>`:''}
      ${c.appearance?`<section><h2>外貌与衣着</h2><p style="line-height:1.9;font-size:14px;white-space:pre-wrap">${esc(c.appearance)}</p></section>`:''}
      ${abilTags?`<section><h2>能力</h2>${abilTags}<p style="margin-top:10px;line-height:1.9;font-size:14px">${esc(c.abilities_summary||'')}</p></section>`:''}
      ${c.story_summary?`<section><h2>故事梗概</h2><p style="line-height:1.9;font-size:14px">${esc(c.story_summary)}</p></section>`:''}
      ${relHTML?`<section><h2>人物关系</h2>${relHTML}</section>`:''}
      ${evtHTML?`<section><h2>关键事件</h2>${evtHTML}</section>`:''}
      ${c.notes?`<section><h2>备注</h2><p style="line-height:1.9;font-size:14px">${esc(c.notes)}</p></section>`:''}
      ${c.source_url?`<section><h2>来源</h2><p style="font-size:13px"><a href="${esc(c.source_url)}" target="_blank" style="color:var(--gold)">${esc(c.source_url)}</a></p></section>`:''}
      <button id="editFab" type="button" style="display:none;position:fixed;right:22px;bottom:26px;z-index:9990;padding:12px 22px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:14px;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.28);" onclick="openEditModal()">✎ 补充 / 编辑设定</button>
      <div id="editModal" style="display:none;position:fixed;inset:0;z-index:9995;background:rgba(20,26,22,.55);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)closeEditModal()">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <strong style="font-size:15px;letter-spacing:1px;">补充 / 编辑设定</strong>
            <button type="button" onclick="closeEditModal()" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--dim);line-height:1;">×</button>
          </div>
          <div id="editRoleInfo" style="margin-bottom:12px;font-size:13px;color:var(--dim)"></div>
          <select id="editField" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-family:inherit;font-size:14px;">
            <option value="">选择要编辑的字段…</option>
            <option value="aliases">别名</option>
            <option value="species">物种</option>
            <option value="gender">性别</option>
            <option value="original_form">本体/原形</option>
            <option value="voice_actor">配音</option>
            <option value="relations">人物关系（每行：类型：对象：描述）</option>
            <option value="personality">性格</option>
            <option value="appearance">外貌与衣着</option>
            <option value="affiliation">所属组织</option>
            <option value="age">年龄</option>
            <option value="story_summary">故事梗概</option>
            <option value="abilities_summary">能力摘要</option>
            <option value="abilities">能力列表（用、或；分隔）</option>
            <option value="master">师父</option>
            <option value="height">身高</option>
            <option value="eye_color">瞳色</option>
            <option value="hair_color">发色</option>
            <option value="residence">住所</option>
            <option value="birthday">生日</option>
            <option value="notes">备注</option>
          </select>
          <textarea id="editValue" rows="4" placeholder="填入新值…" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:14px;margin-bottom:8px;resize:vertical;"></textarea>
          <input id="editMessage" placeholder="补充说明（可选，如来源出处）" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:14px;margin-bottom:10px;">
          <button type="button" id="editSubmitBtn" class="fbtn" style="background:var(--accent);color:#fff;border-color:var(--accent);padding:8px 20px;font-size:14px;">提交</button>
          <span id="editResult" style="margin-left:12px;font-size:13px;"></span>
          <div id="imgMgr" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
            <strong style="font-size:14px;">图片管理（可删除/上传）</strong>
            <div id="imgList" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;"></div>
            <input type="file" id="imgUpload" accept="image/jpeg,image/png,image/webp" style="font-size:13px;">
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
              <select id="uploadType" title="上传图片分类" style="padding:3px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;background:var(--panel);color:var(--text);">
                <option value="wiki" selected>设定图</option>
                <option value="portrait">立绘</option>
                <option value="sticker">表情包</option>
                <option value="story">剧情截图</option>
                <option value="other">其他</option>
              </select>
              <span style="font-size:12px;color:var(--dim)">新图分类</span>
            </div>
          </div>
          <div id="mergeMgr" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
            <strong style="font-size:14px;">合并重复角色</strong>
            <div style="font-size:12px;color:var(--dim);margin:6px 0;">把另一个重复角色的设定、图片、关系并入当前角色「<span id="mergeKeepName" style="color:var(--accent)"></span>」，并删除它。此操作不可恢复。</div>
            <input id="mergeSearch" placeholder="搜索要合并的重复角色…" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;">
            <div id="mergeResults" style="margin:8px 0;max-height:140px;overflow:auto;"></div>
            <div id="mergeTarget" style="font-size:13px;margin-bottom:8px;"></div>
            <button type="button" class="fbtn" id="mergeBtn" style="background:var(--danger);border-color:var(--danger);color:#fff;padding:8px 20px;" disabled onclick="doMerge()">合并到当前角色</button>
            <span id="mergeResult" style="margin-left:12px;font-size:13px;"></span>
          </div>
        </div>
      </div>
      <div id="delModal" style="display:none;position:fixed;inset:0;z-index:9996;background:rgba(20,26,22,.55);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)closeDelModal()">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:420px;width:100%;padding:20px;">
          <strong style="font-size:15px;letter-spacing:1px;">确认删除这张图片？</strong>
          <div style="text-align:center;margin:14px 0;"><img id="delPrevImg" src="" alt="" style="max-width:220px;max-height:220px;border-radius:8px;border:1px solid var(--border);object-fit:contain;background:#ece4d6;"></div>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:10px;"><input type="checkbox" id="delOtherChar"> 此图实为其他角色（删后请上传到正确角色）</label>
          <textarea id="delReason" rows="2" placeholder="删除原因（选填）" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;resize:vertical;"></textarea>
          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
            <button type="button" class="fbtn" onclick="closeDelModal()" style="padding:7px 18px;">取消</button>
            <button type="button" class="fbtn" onclick="confirmDelImg()" style="background:var(--danger);border-color:var(--danger);color:#fff;padding:7px 18px;">确认删除</button>
          </div>
        </div>
      </div>
    `;
    document.title=(c.name||'角色')+' · 西木会馆';
    _editCharName=c.name||'';
    initGallery(images, c.id, c.name);
    // 检查登录状态 + 编辑权限
    checkEditAccess(id);
  }catch(e){
    document.getElementById('app').innerHTML='<div class="error-box">加载失败，请刷新重试。</div>';
  }
}
let _editCharId=null, _canEdit=false, _editCharName='', _mergeTarget=null;
let _charData=null,_charCid=null,_charImages=[];
async function checkEditAccess(charId){
  _editCharId=charId;
  try{
    const r=await fetch('/api/user'); const u=await r.json();
    document.getElementById('editFab').style.display='block';
    if(!u.logged_in){ _canEdit=false; return; }
    const er=u.is_admin?'admin':(u.edit_role||'none');
    _canEdit=(er==='admin'||er==='scribe');
  }catch(e){}
}
function openEditModal(){
  const m=document.getElementById('editModal'); m.style.display='flex';
  const info=document.getElementById('editRoleInfo');
  const btn=document.getElementById('editSubmitBtn');
  if(_canEdit){
    info.innerHTML='<span style="color:var(--accent)">你是管理员/编辑，可直接修改</span>';
    btn.textContent='直接修改'; btn.onclick=()=>submitEdit(_editCharId,true);
    document.getElementById('imgMgr').style.display='block'; loadImgMgr(_editCharId);
    document.getElementById('mergeMgr').style.display='block'; initMerge(_editCharName);
  }else{
    info.innerHTML='你是普通用户，提交的补充需等待审核';
    btn.textContent='提交补充'; btn.onclick=()=>submitEdit(_editCharId,false);
    document.getElementById('imgMgr').style.display='none';
    document.getElementById('mergeMgr').style.display='none';
  }
  document.getElementById('editField').onchange=function(){
    const f=this.value; if(!f)return;
    const dd=_charData;
    if(!dd) return;
    if(f==='abilities'){ document.getElementById('editValue').value=(dd.abilities||[]).map(a=>a.ability).join('；'); }
    else if(f==='relations'){ document.getElementById('editValue').value=(dd.relations||[]).map(r=>(r.relation_type||'')+'：'+(r.related_name||'')+'：'+(r.relation_desc||'')).join('\n'); }
    else{ document.getElementById('editValue').value=(dd.character||{})[f]||''; }
  };
}
function closeEditModal(){ document.getElementById('editModal').style.display='none'; }
let _imgOrder=[]; let _dragIdx=null;
function _imgCard(im,idx,cid){
  const isLast=idx===_charImages.length-1;
  return `<div draggable="true" ondragstart="dragStart(event,${idx})" ondragover="event.preventDefault()" ondragenter="event.preventDefault()" ondrop="dropImg(event,${idx},${cid})" style="position:relative;text-align:center;cursor:grab;padding:2px;border:1px dashed transparent;border-radius:8px;width:110px;">
    <img src="/api/official/img-id?id=${im.id}&t=1" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);pointer-events:none;">
    <button type="button" onclick="askDelImg(${im.id},${cid})" title="删除该图" style="position:absolute;top:-6px;right:6px;width:18px;height:18px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:11px;cursor:pointer;line-height:1;">×</button>
    <div style="margin-top:3px;display:flex;gap:2px;justify-content:center;">
      <button type="button" onclick="moveImg(${idx},-1,${cid})" ${idx===0?'disabled':''} style="font-size:10px;padding:0 5px;border:1px solid var(--border);background:var(--panel);border-radius:3px;cursor:pointer;">←</button>
      <button type="button" onclick="setAvatar(${im.id},${cid})" title="设为头像" style="font-size:10px;padding:0 5px;border:1px solid var(--gold,#d4a840);color:#b3873a;background:var(--panel);border-radius:3px;cursor:pointer;">头像</button>
      <button type="button" onclick="moveImg(${idx},1,${cid})" ${isLast?'disabled':''} style="font-size:10px;padding:0 5px;border:1px solid var(--border);background:var(--panel);border-radius:3px;cursor:pointer;">→</button>
    </div>
    <select onchange="setImgType(${im.id},this.value,${idx},${cid})" title="图片分类" style="width:100%;margin-top:4px;font-size:11px;padding:1px 2px;border:1px solid var(--border);border-radius:4px;font-family:inherit;background:var(--panel);color:var(--text);">${typeOptions(im.image_type)}</select>
  </div>`;
}
function renderImgMgr(){
  const box=document.getElementById('imgList'); if(!box) return;
  const cid=(_charCid!=null?_charCid:_editCharId);
  const imgs=_charImages||[];
  _imgOrder=imgs.map(im=>im.id);
  box.innerHTML=imgs.map((im,idx)=>_imgCard(im,idx,cid)).join('')||'<span style="font-size:12px;color:var(--dim)">暂无图片</span>';
  const up=document.getElementById('imgUpload');
  if(up) up.onchange=()=>uploadImg(cid);
}
async function loadImgMgr(cid){
  if(String(_charCid)===String(cid) && Array.isArray(_charImages)){ renderImgMgr(); return; }
  try{
    const r=await fetch('/api/official/character?id='+cid+'&_='+Date.now()); const d=await r.json();
    _charCid=cid; _charData=d; _charImages=(d.images||[]).slice();
    renderImgMgr();
  }catch(e){ if(Array.isArray(_charImages)) renderImgMgr(); }
}
function dragStart(e,idx){ _dragIdx=idx; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(idx));}catch(_){}}
async function dropImg(e,to,cid){
  e.preventDefault();
  const from=_dragIdx; _dragIdx=null;
  if(from==null||from===to) return;
  const arr=_charImages.slice();
  const item=arr.splice(from,1)[0];
  arr.splice(to,0,item);
  _charImages=arr;
  _imgOrder=_charImages.map(x=>x.id);
  try{
    await fetch('/api/official/image/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character_id:cid,ordered_ids:_imgOrder})});
  }catch(e2){}
  renderImgMgr();
}
async function moveImg(idx,dir,cid){
  const j=idx+dir; if(j<0||j>=_charImages.length) return;
  const arr=_charImages.slice();
  [arr[idx],arr[j]]=[arr[j],arr[idx]];
  _charImages=arr;
  _imgOrder=_charImages.map(x=>x.id);
  try{
    await fetch('/api/official/image/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character_id:cid,ordered_ids:_imgOrder})});
  }catch(e2){}
  renderImgMgr();
}
let _delPending=null;
function askDelImg(imgId,cid){
  _delPending={id:imgId,cid:cid};
  document.getElementById('delPrevImg').src='/api/official/img-id?id='+imgId;
  document.getElementById('delReason').value='';
  document.getElementById('delOtherChar').checked=true;
  document.getElementById('delModal').style.display='flex';
}
function closeDelModal(){ document.getElementById('delModal').style.display='none'; _delPending=null; }
async function confirmDelImg(){
  if(!_delPending) return;
  const cid=_delPending.cid;
  const reason=document.getElementById('delReason').value.trim();
  const other=document.getElementById('delOtherChar').checked;
  const r=await fetch('/api/official/image/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({character_id:cid,image_id:_delPending.id,reason:reason,other_character:other})});
  const d=await r.json();
  const delId=_delPending?_delPending.id:null;
  closeDelModal();
  if(d.ok){
    if(delId!=null) _charImages=_charImages.filter(x=>String(x.id)!==String(delId));
    renderImgMgr(); syncGallery();
  } else alert(d.error||'删除失败');
}
async function setImgType(imageId,type,idx,cid){
  const res=document.getElementById('editResult');
  try{
    const r=await fetch('/api/official/image/type',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_id:imageId,image_type:type})});
    const d=await r.json();
    if(d.ok){
      if(_charImages[idx] && String(_charImages[idx].id)===String(imageId)) _charImages[idx].image_type=type;
      renderImgMgr();
      if(res){res.style.color='var(--accent)';res.textContent='分类已更新';}
    }else{
      if(res){res.style.color='var(--danger)';res.textContent=d.error||'分类更新失败';}
    }
  }catch(e){ if(res){res.style.color='var(--danger)';res.textContent='网络错误';} }
}
async function setAvatar(imageId, cid){
  try{
    const r=await fetch('/api/official/avatar/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character_id:cid,image_id:imageId})});
    const d=await r.json();
    if(d.ok){ alert('✔ 已设为头像，人物关系图将使用该图。'); }
    else alert(d.error||'设置失败');
  }catch(e){ alert('网络错误'); }
}
async function uploadImg(cid){
  const f=document.getElementById('imgUpload').files[0]; if(!f)return;
  const upTypeSel=document.getElementById('uploadType');
  const upType=(upTypeSel&&upTypeSel.value)||'wiki';
    try{
      const d=await HuiguanImages.request('/api/official/image/add',{character_id:cid,filename:f.name,image_type:upType},f);
      if(d.ok){
        _charImages.push({id:d.image_id, image_type:upType, description:f.name||'', image_path:''});
        renderImgMgr(); syncGallery();
        const up=document.getElementById('imgUpload'); if(up) up.value='';
      } else alert(d.error||'上传失败');
    }catch(err){ alert(err.message||'网络错误'); }
}
// ---- 合并重复角色 ----
function initMerge(keepName){
  document.getElementById('mergeKeepName').textContent=keepName||'';
  _mergeTarget=null;
  document.getElementById('mergeBtn').disabled=true;
  document.getElementById('mergeTarget').innerHTML='';
  document.getElementById('mergeResult').textContent='';
  const s=document.getElementById('mergeSearch');
  s.value='';
  s.oninput=()=>{ clearTimeout(s._t); s._t=setTimeout(()=>mergeSearch(s.value),300); };
}
async function mergeSearch(q){
  const box=document.getElementById('mergeResults');
  q=(q||'').trim();
  if(!q){box.innerHTML='';return;}
  try{
    const r=await fetch('/api/official/characters?limit=10&q='+encodeURIComponent(q));
    const d=await r.json();
    const list=(d.characters||[]).filter(c=>String(c.id)!==String(_editCharId));
    box.innerHTML=list.length?list.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;">
      <span style="flex:1;font-size:13px;">${esc(c.name)} <span style="color:var(--dim);font-size:11px;">id=${c.id} · ${esc(c.type||'')}</span></span>
      <button type="button" class="fbtn" style="padding:3px 12px;font-size:12px;" onclick="pickMerge(${c.id},'${escAttr(c.name)}')">选择</button>
    </div>`).join(''):'<div style="color:var(--dim);font-size:12px;">无匹配角色</div>';
  }catch(e){box.innerHTML='<div style="color:var(--dim);font-size:12px;">搜索失败</div>';}
}
function pickMerge(id,name){
  _mergeTarget=id;
  document.getElementById('mergeTarget').innerHTML='将把 <b style="color:var(--danger)">'+esc(name)+'</b> 合并进当前角色并删除它';
  document.getElementById('mergeBtn').disabled=false;
}
async function doMerge(){
  if(!_mergeTarget) return;
  if(!confirm('确定把该角色合并进当前角色？被合并角色将被删除，不可恢复。'))return;
  const res=document.getElementById('mergeResult'); res.textContent='合并中…';
  try{
    const r=await fetch('/api/official/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keep_id:_editCharId,remove_id:_mergeTarget})});
    const d=await r.json();
    if(d.ok){ res.style.color='var(--accent)'; res.textContent='✔ '+d.msg; setTimeout(()=>location.reload(),1500); }
    else { res.style.color='var(--danger)'; res.textContent=d.error||'合并失败'; }
  }catch(e){ res.style.color='var(--danger)'; res.textContent='网络错误'; }
}
async function submitEdit(charId, direct){
  const field=document.getElementById('editField').value;
  const val=document.getElementById('editValue').value.trim();
  const msg=document.getElementById('editMessage').value.trim();
  const result=document.getElementById('editResult');
  if(!field){result.textContent='请选择字段';result.style.color='var(--danger)';return;}
  if(!val){result.textContent='请填写新值';result.style.color='var(--danger)';return;}
  result.textContent='提交中…';result.style.color='var(--dim)';
  try{
    const url=direct?'/api/official/edit':'/api/official/supplement';
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({character_id:charId,field_name:field,new_value:val,message:msg})});
    const d=await r.json();
    if(d.ok){result.textContent=d.msg||'成功';result.style.color='var(--accent)';
      if(direct)setTimeout(()=>location.reload(),1500);
    }else{result.textContent=d.error||'失败';result.style.color='var(--danger)';}
  }catch(e){result.textContent='网络错误';result.style.color='var(--danger)';}
}
init();
</script>
