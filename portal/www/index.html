<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Iridescently：收藏罗小黑战记节气贺图的线上图库，让画面里的色彩慢慢铺展成氛围。"
    />
    <meta name="theme-color" content="#416989" />
    <link rel="canonical" href="https://iridescently.xyz/" />
    <link rel="icon" type="image/png" href="/assets/homepage/assets/favicon-BzE8YVwk.png" />
    <title>Iridescently · 节气之间，自有天气</title>
    <script type="module" crossorigin src="/assets/homepage/homepage.js?v=f66b5d8948ee8efe"></script>
    <link rel="stylesheet" crossorigin href="/assets/homepage/homepage.css?v=f66b5d8948ee8efe">
  </head>
  <body class="site-home" data-gallery-state="starting">
    <a class="skip-link" href="#gallery">跳至节气图库</a>

    <canvas
      class="webgl"
      aria-label="Iridescently 节气贺图图库。使用滚轮、轻扫或方向键浏览。"
    ></canvas>

    <div class="content" aria-hidden="true"></div>

    <main
      class="gallery-stage"
      id="gallery"
      tabindex="-1"
      aria-label="节气贺图图库"
    >
      <p
        class="gallery-loading"
        id="gallery-status"
        role="status"
        aria-live="polite"
      >
        <span class="gallery-loading__mark" aria-hidden="true"></span>
        <span class="gallery-loading__message">正在进入节气图库</span>
        <button class="gallery-loading__retry" type="button" hidden>
          重新连接
        </button>
      </p>

      <div class="gallery-controls" role="group" aria-label="浏览节气贺图">
        <button
          class="gallery-controls__step"
          type="button"
          data-gallery-step="previous"
          aria-label="上一张贺图"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m14.5 5-7 7 7 7" />
          </svg>
        </button>
        <button
          class="gallery-controls__autoplay"
          type="button"
          data-gallery-autoplay
          aria-label="开启自动播放"
          aria-pressed="false"
          title="开启自动播放"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path
              class="gallery-controls__play-icon"
              d="M6 3.8v12.4L16 10 6 3.8Z"
            />
            <path
              class="gallery-controls__pause-icon"
              d="M6.5 4.5v11m7-11v11"
            />
          </svg>
        </button>
        <div class="gallery-controls__hint">
          <span class="gallery-controls__count" data-gallery-count
            >384 张贺图</span
          >
          <span class="gallery-controls__desktop-hint"
            >滚动或使用方向键浏览</span
          >
          <span class="gallery-controls__mobile-hint">轻扫，继续浏览</span>
        </div>
        <button
          class="gallery-controls__step"
          type="button"
          data-gallery-step="next"
          aria-label="下一张贺图"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9.5 5 7 7-7 7" />
          </svg>
        </button>
      </div>

      <div class="gallery-customizer">
        <button
          class="gallery-settings-toggle"
          type="button"
          data-gallery-settings-toggle
          aria-label="打开自定义设置"
          aria-expanded="false"
          aria-controls="gallery-settings-panel"
          title="自定义"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M4 5h12M4 10h12M4 15h12" />
            <circle cx="8" cy="5" r="1.7" />
            <circle cx="12" cy="10" r="1.7" />
            <circle cx="7" cy="15" r="1.7" />
          </svg>
        </button>
        <div
          class="gallery-settings"
          id="gallery-settings-panel"
          data-gallery-settings
          role="group"
          aria-label="自定义"
          hidden
        >
          <header class="gallery-settings__heading">
            <h2>自定义</h2>
            <button
              type="button"
              data-appearance-reset
              aria-label="恢复默认"
              title="恢复默认"
            >
              ↺
            </button>
          </header>
          <div class="gallery-settings__items">
            <label class="gallery-setting">
              <span>过渡</span>
              <input
                id="gallery-setting-transition"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="transition"
              />
            </label>
            <label class="gallery-setting">
              <span>停留</span>
              <input
                id="gallery-setting-pause"
                type="range"
                min="0"
                max="100"
                step="1"
                value="0"
                data-gallery-setting="pause"
              />
            </label>
            <label class="gallery-setting">
              <span>大小</span>
              <input
                id="gallery-setting-size"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="size"
              />
            </label>
            <label class="gallery-setting">
              <span>微动</span>
              <input
                id="gallery-setting-motion"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="motion"
              />
            </label>
            <label class="gallery-setting">
              <span>晕染</span>
              <input
                id="gallery-setting-atmosphere"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="atmosphere"
              />
            </label>
            <label class="gallery-setting">
              <span>颗粒</span>
              <input
                id="gallery-setting-grain"
                type="range"
                min="0"
                max="100"
                step="1"
                value="50"
                data-gallery-setting="grain"
              />
            </label>
          </div>
        </div>
      </div>
    </main>

    <header class="site-chrome">
      <a class="site-brand" href="/" aria-label="Iridescently 首页">
        <img
          class="site-brand__logo"
          src="/assets/homepage/assets/iridescently-mark-D5B9Sdkj.png"
          alt=""
          width="32"
          height="32"
          decoding="async"
        />
        <span class="site-brand__words">
          <span class="site-brand__name" data-brand-proximity>
            <span class="site-brand__name-word">Iridescently</span>
            <span class="site-brand__kaomoji" aria-hidden="true">(｡•̀ᴗ-)✧</span>
          </span>
          <span class="site-brand__motto">节气之间，自有天气</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="站点导航">
        <a class="site-nav__link" href="https://huiguan.iridescently.xyz/"
          >西木会馆</a
        >
        <a
          class="site-nav__link site-nav__link--secondary"
          href="https://oc.iridescently.xyz/"
          >角色设定</a
        >
        <details class="site-menu">
          <summary class="site-menu__toggle">
            <span>更多去处</span>
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="m4 6 4 4 4-4" />
            </svg>
          </summary>
          <div class="site-menu__panel">
            <p class="site-menu__eyebrow">继续探索</p>
            <a href="https://zszm.iridescently.xyz/">众生之门</a>
            <a href="https://psyche.iridescently.xyz/">心理档案云</a>
            <a href="https://lingjing.iridescently.xyz/">灵境会馆</a>
            <a href="https://juling.iridescently.xyz/">聚灵</a>
            <span class="site-menu__rule" aria-hidden="true"></span>
            <a href="/connections.html">连接与鸣谢</a>
            <details class="site-menu__legal">
              <summary>版权与免责声明</summary>
              <p>罗小黑战记相关 IP 版权归寒木春华动画工作室所有。</p>
              <p>
                本站为非商业性粉丝社区项目，仅为用户提供信息交流与身份认证服务。所有涉及“罗小黑战记”及相关角色、形象、作品的内容，其著作权、商标权等知识产权均归原作者及寒木春华动画工作室所有。本站未获官方授权，如有侵权请联系管理员删除。
              </p>
            </details>
            <small class="site-menu__copyright">© 2026 Iridescently</small>
          </div>
        </details>
      </nav>
    </header>

    <noscript>
      <p class="noscript-note">
        此节气图库需要启用 JavaScript；站点导航仍可使用。
      </p>
    </noscript>
  </body>
</html>
