<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>精灵球球 · 预览</title>
<style>
  body{background:#0d1117;display:flex;flex-direction:column;align-items:center;gap:30px;padding:40px;font-family:"PingFang SC",sans-serif;color:#dbe2ec;}
  h2{font-weight:normal;color:#8794a8;font-size:14px;}
  .row{display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap;justify-content:center;}
  .cell{text-align:center;}
  .cell .label{font-size:12px;color:#8794a8;margin-top:8px;}
  .ball{filter:drop-shadow(0 0 12px rgba(140,220,140,.25));}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .float{animation:floaty 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
  .dot{animation:pulse 2s ease-in-out infinite;}
</style>
</head>
<body>
<h1 style="font-size:18px;letter-spacing:2px">☯ 透明的小精灵球球</h1>
<div class="row">

  <!-- 阶段1：初生，几乎透明，只有微光 -->
  <div class="cell">
    <svg class="ball float" width="120" height="120" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="g1" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#c8f0c0" stop-opacity="0.35"/>
          <stop offset="60%" stop-color="#9fdc9a" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#9fdc9a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="url(#g1)"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#b8e6b0" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle class="dot" cx="50" cy="50" r="4" fill="#ffffff" fill-opacity="0.5"/>
    </svg>
    <div class="label">初生 · 透明空灵</div>
  </div>

  <!-- 阶段2：孕育中，生灵光点浮现 -->
  <div class="cell">
    <svg class="ball float" width="120" height="120" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="g2" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#d8ffd0" stop-opacity="0.6"/>
          <stop offset="60%" stop-color="#a8e8a0" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#a8e8a0" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="url(#g2)"/>
      <circle cx="50" cy="50" r="28" fill="#b8f0ae" fill-opacity="0.25" stroke="#c0f0b4" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle class="dot" cx="43" cy="44" r="3" fill="#fff" fill-opacity="0.9"/>
      <circle class="dot" cx="56" cy="48" r="2.5" fill="#fff" fill-opacity="0.8" style="animation-delay:.4s"/>
      <circle class="dot" cx="48" cy="56" r="2" fill="#fff" fill-opacity="0.7" style="animation-delay:.8s"/>
      <circle class="dot" cx="58" cy="40" r="2" fill="#fff" fill-opacity="0.6" style="animation-delay:1.2s"/>
    </svg>
    <div class="label">孕育 · 生灵光点浮现</div>
  </div>

  <!-- 阶段3：即将化形，灵质充盈，五行之色显现 -->
  <div class="cell">
    <svg class="ball float" width="120" height="120" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="g3" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
          <stop offset="40%" stop-color="#c9e8c0" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#8fd48a" stop-opacity="0.15"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="url(#g3)"/>
      <circle cx="50" cy="50" r="30" fill="#cdf0c4" fill-opacity="0.4" stroke="#d8ffd0" stroke-opacity="0.8" stroke-width="2"/>
      <circle class="dot" cx="40" cy="42" r="3.5" fill="#fff" fill-opacity="1"/>
      <circle class="dot" cx="55" cy="40" r="3" fill="#fff" fill-opacity="0.9" style="animation-delay:.3s"/>
      <circle class="dot" cx="60" cy="52" r="3" fill="#fff" fill-opacity="0.9" style="animation-delay:.6s"/>
      <circle class="dot" cx="45" cy="56" r="2.5" fill="#fff" fill-opacity="0.8" style="animation-delay:.9s"/>
      <circle class="dot" cx="52" cy="48" r="2" fill="#fff" fill-opacity="0.8" style="animation-delay:1.2s"/>
      <circle class="dot" cx="36" cy="50" r="2" fill="#fff" fill-opacity="0.7" style="animation-delay:1.5s"/>
    </svg>
    <div class="label">将化形 · 灵质充盈</div>
  </div>

</div>
<h2>（SVG 矢量 · 可随聚灵进度实时变化 · 化形时"破壳"）</h2>
</body>
</html>
