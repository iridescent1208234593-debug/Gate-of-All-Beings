<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="description" content="罗小黑战记·重生之门 · 世界观图鉴" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
	<title>罗小黑战记·重生之门 · 世界观图鉴</title>
	<link rel="manifest" href="manifest.webmanifest" />
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#116f54" />
	<meta name="msapplication-TileColor" content="#116f54">
	<link rel="icon" type="image/png" href="/ui/images/spoder.png" sizes="512x512" />
	<link rel="shortcut icon" href="/ui/images/spoder.png">
	<link rel="apple-touch-icon" href="/ui/images/spoder.png" />
	<link rel="stylesheet" href="ui/index.css" />
	<style>
		body {
			overflow: auto;
			background: var(--bg, #f7f2e7);
			color: var(--text, #3a3326);
			margin: 0;
			padding: 1.5rem;
			font-family: "Heliotrope", "PingFang SC", "Microsoft YaHei", sans-serif;
			line-height: 1.6;
		}
		.Collection {
			max-width: 68em;
			margin: 0 auto;
		}
		.Collection-top {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.6rem;
			margin-bottom: 0.5rem;
		}
		.Collection-bonus {
			margin-top: 0.6rem;
			padding: 0.9rem 1rem;
			border: 1px dashed rgba(122, 99, 60, 0.35);
			border-radius: 10px;
			background: rgba(17, 111, 84, 0.06);
		}
		.Collection-bonusLine {
			margin: 0.3rem 0;
			color: #d8c9a3;
			line-height: 1.5;
		}
		.Collection-top h1 {
			margin: 0;
			font-size: 1.6rem;
		}
		.Collection-nav {
			display: flex;
			flex-wrap: wrap;
			gap: 0.4rem;
			margin: 1rem 0 1.5rem;
			padding: 0;
			list-style: none;
		}
		.Collection-nav a {
			color: var(--teal, #116f54);
			text-decoration: none;
			border: 1px solid rgba(17, 111, 84, 0.5);
			border-radius: 999px;
			padding: 0.2rem 0.8rem;
			font-size: 0.9em;
		}
		.Collection-nav a:hover {
			background: rgba(17, 111, 84, 0.2);
		}
		.Collection-section {
			margin: 2.2rem 0 0.8rem;
			border-bottom: 1px solid rgba(122, 99, 60, 0.18);
			padding-bottom: 0.4rem;
			scroll-margin-top: 1rem;
		}
		.Collection-section small {
			color: var(--color-content-2, #8a7a5f);
			font-weight: normal;
			font-size: 0.85em;
		}
		.Grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(15em, 1fr));
			gap: 0.8rem;
			margin-bottom: 1.5rem;
		}
		.LoreCard {
			background: #fffdf6;
			border: 1px solid rgba(122, 99, 60, 0.22);
			border-radius: 8px;
			padding: 0.7rem 0.9rem;
			font-size: 0.9em;
		}
		.LoreCard h3 {
			margin: 0 0 0.25rem;
			font-size: 1.05em;
			color: var(--teal, #116f54);
		}
		.LoreCard h3 small {
			color: var(--color-content-2, #8a7a5f);
			font-size: 0.75em;
			font-weight: normal;
			margin-left: 0.4em;
		}
		.LoreCard .SourceBadge {
			display: inline-block;
			font-style: normal;
			font-size: 0.7em;
			font-weight: 600;
			line-height: 1;
			padding: 0.22em 0.55em;
			margin-left: 0.45em;
			border-radius: 999px;
			vertical-align: 0.18em;
			letter-spacing: 0.03em;
		}
		.LoreCard .SourceBadge.is-official { color: #0d5c46; background: rgba(17, 111, 84, 0.12); border: 1px solid rgba(17, 111, 84, 0.35); }
		.LoreCard .SourceBadge.is-dubious { color: #8a4b2a; background: rgba(178, 96, 55, 0.12); border: 1px solid rgba(178, 96, 55, 0.4); }
		.LoreCard .SourceBadge.is-mixed { color: #7a6a3a; background: rgba(170, 145, 60, 0.12); border: 1px solid rgba(170, 145, 60, 0.4); }
		.LoreCard .SourceBadge.is-fan { color: #7a5c33; background: rgba(213, 178, 122, 0.16); border: 1px solid rgba(213, 178, 122, 0.45); }
.LoreCard .SourceBadge.owned { color: #0d5c46; background: rgba(17, 111, 84, 0.12); border: 1px solid rgba(17, 111, 84, 0.35); }
		.LoreCard .LockBadge, .LockBadge {
			display: inline-block;
			font-size: 0.68em;
			font-weight: 600;
			line-height: 1;
			padding: 0.24em 0.6em;
			margin: 0 0 0.4em;
			border-radius: 999px;
			color: #9a8a6f;
			background: rgba(122, 99, 60, 0.1);
			border: 1px solid rgba(122, 99, 60, 0.3);
			letter-spacing: 0.05em;
		}
		.LoreCard.is-locked {
			background: rgba(255, 253, 246, 0.55);
			border-style: dashed;
			opacity: 0.88;
		}
		.LoreCard.is-locked h3 { color: #9a8a6f; }
		.EndingCard.is-unlocked { border-color: rgba(170, 145, 60, 0.45); background: linear-gradient(180deg, rgba(232, 163, 61, 0.07), rgba(255, 253, 246, 0.9)); }
		.EndingCard.is-unlocked h3 { color: #9a6a1f; }
.Collection-hint { color: var(--muted, #6b7a72); font-size: 0.85em; margin: 0 0 0.8rem; max-width: 60rem; }
		.LoreCard p {
			margin: 0.15em 0;
		}
		.LoreCard .Tag {
			display: inline-block;
			font-size: 0.75em;
			color: #116f54;
			border: 1px solid rgba(17, 111, 84, 0.45);
			border-radius: 4px;
			padding: 0 0.35em;
			margin: 0 0.3em 0.2em 0;
			background: rgba(17, 111, 84, 0.06);
		}
		.LoreCard .Summary {
			color: var(--color-content-2, #8a7a5f);
			font-size: 0.9em;
		}
		.LoreCard.is-expandable { cursor: pointer; transition: box-shadow 0.15s ease, border-color 0.15s ease; }
		.LoreCard.is-expandable:hover { border-color: rgba(17, 111, 84, 0.45); box-shadow: 0 2px 8px rgba(17, 111, 84, 0.08); }
		.LoreCard.is-expandable.is-open { border-color: rgba(17, 111, 84, 0.55); background: #fbfcf4; }
		.LoreCard .ExpandHint {
			display: inline-block;
			font-style: normal;
			font-size: 0.7em;
			font-weight: 600;
			line-height: 1;
			padding: 0.22em 0.5em;
			margin-left: 0.45em;
			border-radius: 999px;
			color: #116f54;
			background: rgba(17, 111, 84, 0.1);
			border: 1px solid rgba(17, 111, 84, 0.3);
			vertical-align: 0.18em;
			letter-spacing: 0.03em;
		}
		.LoreCard .LoreDetail {
			display: none;
			margin: 0.5rem 0 0.15rem;
			padding: 0.5rem 0.6rem;
			border-left: 3px solid rgba(17, 111, 84, 0.4);
			background: rgba(17, 111, 84, 0.05);
			border-radius: 0 6px 6px 0;
			color: var(--color-content-2, #6b5a3f);
			font-size: 0.88em;
			line-height: 1.65;
		}
		.LoreCard.is-open .LoreDetail { display: block; }
		.LoreCard .Portrait {
			width: 100%;
			height: 11em;
			object-fit: cover;
			object-position: top center;
			border-radius: 6px;
			margin-bottom: 0.5rem;
			display: block;
			background: rgba(0, 0, 0, 0.3);
		}
		.Cards--grid .Card {
			font-size: 0.85em;
		}
		.LyricsBox {
			margin-top: 0.4rem;
			border-top: 1px dashed rgba(207, 195, 178, 0.2);
			padding-top: 0.35rem;
		}
		.EventsBox {
			margin-top: 0.4rem;
			border-top: 1px dashed rgba(207, 195, 178, 0.2);
			padding-top: 0.3rem;
		}
		.EventsBox summary {
			cursor: pointer;
			color: var(--teal, #116f54);
			font-size: 0.85em;
			user-select: none;
			list-style: none;
		}
		.EventsBox summary::before {
			content: "▸ ";
			color: var(--teal, #116f54);
		}
		.EventsBox[open] summary::before {
			content: "▾ ";
		}
		.EventList {
			margin: 0.35rem 0 0;
			padding-left: 1.15rem;
			color: var(--color-content-2, #8a7a5f);
			font-size: 0.85em;
			line-height: 1.5;
			max-height: 13em;
			overflow: auto;
		}
		.EventList li {
			margin: 0.1em 0;
		}
		.LyricsBox summary {
			cursor: pointer;
			color: var(--teal, #116f54);
			font-size: 0.85em;
			user-select: none;
		}
		.LyricsBox pre {
			white-space: pre-wrap;
			word-break: break-word;
			font-family: inherit;
			font-size: 0.82em;
			line-height: 1.55;
			color: var(--color-content-2, #8a7a5f);
			background: rgba(0, 0, 0, 0.3);
			border-radius: 6px;
			padding: 0.5rem 0.6rem;
			margin: 0.4rem 0 0;
			max-height: 16em;
			overflow: auto;
		}
	</style>
  <script src="https://huiguan.iridescently.xyz/design-system/game-nav.js" defer></script>
</head>

<body>
	<div id="Collection"></div>
	<script type="module">
		import {html, render, Component} from './web_modules/htm/preact/standalone.module.js'
		import cards from './content/cards.js'
		import {Card} from './ui/cards.js'
		import {
			characters,
			locations,
			organizations,
			artifacts,
			abilitySystems,
			dualSkills,
			spiritLifecycle,
		} from './content/worldview-data.js'
		import {skillCategories} from './content/skills-data.js'
		import {abilityBranches} from './content/ability-branches.js'
		import {extraCharacters} from './content/characters-full.js'
		import {characterEvents, characterEventStats, eventsForCharacter} from './content/character-events.js'
		import {characterProfiles, profileStats, profileFor} from './content/character-profiles.js'
		import {relations, relationTypes} from './content/relations-data.js'
		import {easyMonsters, monsters, elites, bosses, MONSTER_REGIONS} from './content/dungeon-encounters.js'
		import {enemyProfiles, enemyProfileByName} from './content/enemy-profiles.js'
		import {spiritSpacePool} from './content/spirit-spaces.js'
		import {lingzhiSpaces} from './content/lingzhi-spaces.js'
		import {golems} from './content/golem-craft.js'
		import {branchMembers, organizationMembers, orgStats, branchStats, totalBranchMembers} from './content/organization-members.js'
		import {worldviewEventPool} from './content/worldview-events.js'
		import {elementMasteries, ELEMENTS, SHENG, KE} from './content/element-mastery.js'
		import {realms, treasures} from './content/cultivation.js'
		import {SOUL_REALMS} from './content/soul-legacy.js'
		import {bonds} from './content/bonds.js'
		import {timelineEras, characterStorylines, timelineStats, timelineV2, timelineV2Stats} from './content/timeline-data.js'
		import {REGION_ECHOES, timelineEchoStats} from './content/timeline-echoes.js'
		import {episodeChapters, episodeList, episodeStats} from './content/episodes-data.js'
		import {appearancesForCharacter, appearanceStats} from './content/episode-appearances.js'
		import {characterSources, sourceSiteOrder, sourcesStats} from './content/sources-data.js'
		import {characterImages, characterImageCount} from './content/character-images.js'
		import {musicList, musicStats} from './content/music-data.js'
		import {seriesWorks, staffList, worksStats} from './content/works-data.js'
		import {lxzChapters, lxzEpisodeList, lxzStats} from './content/lxz-chapters.js'
		import {lxzEventPool, lxzEventStats} from './content/lxz-events.js'
		import {articles, articleStats, articleByName} from './content/articles-data.js'
		import {ocCharacter, ocAbilities, ocArtifacts, ocCards, ocSpiritSpaces, ocEvents, ocEggFacts, ocStats} from './content/oc-rainbow.js'
		import {lingzhiCharacters, lingzhiCards, lingzhiRelics} from './content/lingzhi-xiuxing.js'
		import {loadProgress} from './game/lingzhi-progress.js'
		import {getCollection, getProgress, isCollected, resetCollection} from './content/collection-progress.js'
		import {currentCollectionBonus} from './content/collection-bonus.js'
		// 轮回结局图鉴：跨局解锁记录（content/endings.js）
		import {ENDINGS, getUnlockedEndings, unlockedEndingCount} from './content/endings.js'

		const LoreCard = ({title, subtitle, tags, lines, summary, image, locked, badge, detail, children}) => html`
			<article class=${`LoreCard${locked ? ' is-locked' : ''}${detail ? ' is-expandable' : ''}`} onclick=${detail ? (e) => e.currentTarget.classList.toggle('is-open') : null}>
				${locked ? html`<span class="LockBadge">未收录</span>` : ''}
				${image ? html`<img class="Portrait" src=${image} alt=${title} loading="lazy" />` : ''}
				<h3>${title}${subtitle ? html`<small>${subtitle}</small>` : ''}${badge ? html`<em class="SourceBadge ${badge.cls}">${badge.text}</em>` : ''}${detail ? html`<em class="ExpandHint">展开设定</em>` : ''}</h3>
				${tags && tags.length
					? html`<p>${tags.map((tag) => html`<span class="Tag">${tag}</span>`)}</p>`
					: ''}
				${lines && lines.length ? lines.map((line) => html`<p>${line}</p>`) : ''}
				${summary ? html`<p class="Summary">${summary}</p>` : ''}
				${detail ? html`<p class="LoreDetail">${detail}</p>` : ''}
				${children || ''}
			</article>
		`

		// —— 收集进度组件 ——
		const ProgressBar = ({ratio}) => html`<div class="ProgressBar"><div class="ProgressBar-fill" style="width:${Math.round(Math.max(0, Math.min(1, ratio)) * 100)}%"></div></div>`

		const CollectionProgress = () => {
			const enemyTotal = [...new Set([...Object.values(easyMonsters), ...Object.values(monsters), ...Object.values(elites), ...Object.values(bosses)].flatMap((r) => r.monsters?.map((m) => m.name) || []).filter(Boolean))].length
			const stats = [
				['卡牌', 'cards', cards.length],
				['角色', 'characters', characters.length + extraCharacters.length],
				['地点', 'locations', locations.length],
				['法宝', 'artifacts', artifacts.length],
				['敌人', 'enemies', enemyTotal],
				['灵质空间', 'spaces', spiritSpacePool.length + lingzhiSpaces.length],
				['事件', 'events', worldviewEventPool.length],
				['灵偶', 'golems', golems.length],
				['剧集', 'stories', episodeList.length],
				['羁绊', 'bonds', bonds.length],
				['词条', 'articles', articleStats.total],
				['灵质修行', 'lingzhi', lingzhiCharacters.length + lingzhiCards.length + lingzhiRelics.length],
				['幕后', 'staff', staffList.length],
			]
			const lzCollectedCount = (() => {
				const lzp = loadProgress()
				return lzp.unlockedCharacters.length + lzp.unlockedCards.length + lzp.unlockedRelics.length
			})()
			const items = stats.map(([label, type, total]) => {
				const p = type === 'lingzhi' ? {collected: Math.min(lzCollectedCount, total), total, ratio: total ? Math.min(lzCollectedCount / total, 1) : 0} : getProgress(type, total)
				return html`<div class="ProgressItem">
					<div class="ProgressItem-head"><b>${label}</b><span>${p.collected} / ${total}</span></div>
					<${ProgressBar} ratio=${p.ratio} />
				</div>`
			})
			const collectedSum = stats.reduce((s, [, type]) => s + (type === 'lingzhi' ? lzCollectedCount : getCollection()[type].length), 0)
			const totalSum = stats.reduce((s, [, , total]) => s + total, 0)
			const cb = currentCollectionBonus()
			const bonusLine = cb.tier
				? `当前档位「${cb.tier.name}」—— ${cb.tier.desc}`
				: `尚未入门：收录 ${cb.next ? cb.next.threshold : 10} 条见闻后开启灵藏第一档`
			const bonusTotal = cb.total && Object.keys(cb.total).length
				? `生命+${cb.total.maxHealth || 0} · 机缘+${cb.total.fortune || 0} · 道心+${cb.total.daoHeart || 0}`
				: '暂无跨局加成'
			const bonusNext = cb.next
				? html`<div class="ProgressItem"><div class="ProgressItem-head"><b>距「${cb.next.name}」</b><span>还需 ${Math.max(0, cb.next.threshold - cb.count)} 条见闻</span></div><${ProgressBar} ratio=${Math.min(1, cb.count / cb.next.threshold)} /></div>`
				: ''
			return html`
				<div class="Collection-total">
					已收录 ${collectedSum} / ${totalSum}（${Math.round((totalSum ? collectedSum / totalSum : 0) * 100)}%）· 在爬塔中遇见敌人、事件、灵质空间、剧情与法宝即可解锁对应图鉴条目
					<button class="ResetButton" onclick=${() => { if (confirm('确定清空全部收集记录？')) { resetCollection(); location.reload() } }}>重置收集</button>
				</div>
				<div class="Collection-progress">${items}</div>
				<div class="Collection-bonus">
					<h3 class="Collection-section" id="collection-bonus">万灵归藏 · 灵藏档位 <small>累计见闻 ${cb.count} 条 · 跨局生效</small></h3>
					<p class="Collection-bonusLine">${bonusLine}</p>
					<p class="Collection-bonusLine">跨局加成：${bonusTotal}</p>
					${bonusNext}
				</div>
			`
		}

		const CardsSection = () => {
			const p = getProgress('cards', cards.length)
			return html`
				<section>
					<h2 class="Collection-section" id="cards">卡牌图鉴 <small>${cards.length} 张 · 已收录 ${p.collected}/${p.total}</small></h2>
					<div class="Cards Cards--grid">
						${cards.map((card) => {
							const el = Card(card)
							return isCollected('cards', card.name) ? el : html`<div style="position:relative;opacity:0.5;filter:grayscale(0.7)"><span class="LockBadge">未收录</span>${el}</div>`
						})}
					</div>
				</section>
			`
		}

		const CharacterCards = (list) =>
			list.map(
				(c) => {
					const prof = profileFor(c.name)
					return html`<${LoreCard}
					title=${c.name}
					subtitle=${c.aliases && c.aliases.length ? c.aliases.join(' / ') : ''}
					tags=${[c.species, c.affiliation].filter(Boolean)}
					lines=${[
						c.abilities ? html`<strong>能力：</strong>${c.abilities}` : null,
						prof?.identity ? html`<strong>身份：</strong>${prof.identity}` : null,
						prof?.personality ? html`<strong>性格：</strong>${prof.personality}` : null,
						prof?.appearance ? html`<strong>外貌：</strong>${prof.appearance}` : null,
						prof?.voice ? html`<strong>声优：</strong>${prof.voice}` : null,
						html`${SkillDetails(c.name)}`,
						html`${EventTimeline(c.name)}`,
						html`${Appearances(c.name)}`,
						html`${SourceRefs(c.name)}`,
					].filter(Boolean)}
					summary=${c.summary}
					image=${characterImages[c.name] || ''}
					locked=${!isCollected('characters', c.name)}
				/>`
				}
			)

		// 技能明细：命中 skills-data.js 技能大全的角色，卡片内展示可折叠技能清单（名称/描述/来源）
		const SkillDetails = (name) => {
			const found = []
			const norm = (s) => (s || '').replace(/[（(].*?[）)]/g, '').trim()
			const seen = new Set()
			for (const cat of skillCategories) {
				for (const sk of cat.skills || []) {
					const hs = sk.holders || []
					if (!(hs.includes(name) || hs.some((h) => norm(h) === norm(name)))) continue
					if (seen.has(sk.name)) continue
					seen.add(sk.name)
					found.push({cat: cat.name, ...sk})
				}
			}
			if (!found.length) return ''
			return html`<details class="EventsBox">
				<summary>技能明细（${found.length} 条）</summary>
				<ul class="EventList">
					${found.map(
						(f) => html`<li><strong>${f.name}</strong>${f.desc ? ` — ${f.desc}` : ''}${f.source ? html` <em style="color: var(--color-content-2, #8a7a5f); font-style: normal; font-size: 0.85em">· ${f.source}</em>` : ''}</li>`
					)}
				</ul>
			</details>`
		}

		// 技能联动角色数：角色图鉴标题统计用
		const SKILL_HIT_COUNT = (() => {
			const norm = (s) => (s || '').replace(/[（(].*?[）)]/g, '').trim()
			let n = 0
			for (const c of [...characters, ...extraCharacters]) {
				const hit = skillCategories.some((cat) =>
					(cat.skills || []).some((sk) => {
						const hs = sk.holders || []
						return hs.includes(c.name) || hs.some((h) => norm(h) === norm(c.name))
					})
				)
				if (hit) n++
			}
			return n
		})()

		// 角色生平大事记：命中 character-events.js 的角色在卡片内展示可折叠时间线
		const EventTimeline = (name) => {
			const events = eventsForCharacter(name)
			if (!events || !events.length) return ''
			return html`<details class="EventsBox" open>
				<summary>生平大事记（${events.length} 条）</summary>
				<ol class="EventList">
					${events.map((e) => html`<li>${e}</li>`)}
				</ol>
			</details>`
		}

		// 角色登场记录：命中 episode-appearances.js 的角色展示可折叠集数列表（反向视图，来源 episode_characters 表）
		const Appearances = (name) => {

					if (i.weak) return `弱${i.weak}`
