<!DOCTYPE html>
<html lang="en">
	<head>
<script src="/shared/site-domains/index.js"></script>
		<meta charset="utf-8" />
		<meta name="description" content="A video card game for the web" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
		<title>罗小黑战记·重生之门</title>
		<link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes">
		<meta name="theme-color" content="#116f54" />
		<meta name="msapplication-TileColor" content="#116f54">
		<link rel="icon" type="image/png" href="/ui/images/spoder.png" sizes="512x512" />
		<link rel="shortcut icon" href="/ui/images/spoder.png">
		<link rel="apple-touch-icon" href="/ui/images/spoder.png" />
		<link rel="stylesheet" href="ui/index.css" />
		<script>
			// ui/images 是可选美术（见 server/app/module-assets.json）；缺失时隐藏图片而不是显示破图标。
			addEventListener('error', function (event) {
				var target = event.target
				if (target && target.tagName === 'IMG' && /\/ui\/images\//.test(target.src)) target.style.display = 'none'
			}, true)
		</script>
	  <script src="/design-system/game-nav.js" defer></script>
</head>
	<body>

		<div id="QcAccountBar"></div>
		<div id="SlayTheWeb"></div>
		<script async src="ui/index.js" type="module"></script>
		<script type="module">
			// Offline support
			if (location.pathname.startsWith('/app/modules/slay/') && 'serviceWorker' in navigator) {
				navigator.serviceWorker.register(new URL('./service-worker.js', import.meta.url)).catch(() => {})
			}
			window.TONE_SILENCE_LOGGING = true
		</script>
		<noscript>
			<p>
				需要启用 JavaScript 才能游玩罗小黑战记·重生之门。
			</p>
		</noscript>

	</body>
</html>
