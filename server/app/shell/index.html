<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众生之门 · 统一门户</title>
<link rel="stylesheet" href="/shared/shared-ui/lxh-ui.css">
<style>
  :root { --shell-h: 52px; }
  html, body { margin: 0; height: 100%; background: var(--qc-bg, #f5f0e8);
               color: var(--qc-text, #3a4a3e); font-family: "Noto Serif SC", serif; }
  .shell-topbar { height: var(--shell-h); display: flex; align-items: center; gap: 18px;
            padding: 0 18px; border-bottom: 1px solid var(--qc-border, #d4cfbe);
            background: var(--qc-panel, #fbf8f2); position: sticky; top: 0; z-index: 10;
            overflow-x: auto; white-space: nowrap; }
  #iridescently-shell-chrome { z-index: 2147483647; isolation: isolate; }
  .shell-topbar .brand { font-weight: 700; color: var(--qc-accent, #5a9e8f); text-decoration: none; }
  .shell-topbar a.nav { color: inherit; text-decoration: none; font-size: 14px; opacity: .8; }
  .shell-topbar a.nav:hover, .shell-topbar a.nav.active { opacity: 1; color: var(--qc-accent, #5a9e8f); }
  .shell-topbar .spacer { flex: 1; }
  .shell-topbar .user { font-size: 13px; color: var(--qc-dim, #7a8a7e); }
  main { height: calc(100% - var(--shell-h)); }
  iframe.view { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .module-embed.view { width: 100%; height: 100%; overflow: auto; background: #fff; }
  .home { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }
  .home h1 { font-size: 26px; margin: 0 0 4px; }
  .home .sub { color: var(--qc-dim, #7a8a7e); margin: 0 0 28px; }
  .group { font-size: 15px; color: var(--qc-dim, #7a8a7e); margin: 26px 0 12px; letter-spacing: .12em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { display: block; padding: 16px 18px; border: 1px solid var(--qc-border, #d4cfbe);
          border-radius: 10px; background: var(--qc-panel, #fbf8f2); text-decoration: none;
          color: inherit; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--qc-shadow-md, 0 6px 18px rgba(0,0,0,.08)); }
  .card .ico { font-size: 22px; }
  .card .name { font-weight: 600; margin: 6px 0 2px; }
  .card .desc { font-size: 13px; color: var(--qc-dim, #7a8a7e); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px;
         background: var(--qc-accent, #5a9e8f); color: #fff; }
  :where(a, button):focus-visible { outline: 2px solid #d4a840; outline-offset: 4px; }
  .module-state { padding: 24px; line-height: 1.8; }
  #iridescently-shell-navlinks { min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  @media (max-width: 640px) {
    .shell-topbar { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
    #iridescently-shell-navlinks { order: 3; flex-basis: 100%; gap: 10px !important; padding-bottom: 4px; }
    :root { --shell-h: 86px; }
    .shell-topbar { height: var(--shell-h); box-sizing: border-box; overflow: visible; }
    .nav { flex-shrink: 0; }
  }
</style>
</head>
<body>
<header class="shell-topbar" id="iridescently-shell-chrome">
  <a class="brand" href="/app/shell/">众生之门</a>
  <div id="iridescently-shell-navlinks" style="display:flex;gap:14px"></div>
  <span class="spacer"></span>
  <span class="user" id="iridescently-shell-user"></span>
</header>
<main id="iridescently-shell-view"></main>

<script type="module">
import { refreshSession } from '/shared/shared-session/session.js';
import { get, set } from '/shared/shared-session/save.js';

const view = document.getElementById('iridescently-shell-view');
const navlinks = document.getElementById('iridescently-shell-navlinks');
const BASE_PATH = '/app/shell/';
let portal = { links: [] };
let mountVersion = 0;
let activeMount = null;
let mountQueue = Promise.resolve();
const scriptMounts = new Map();
const baseEl = document.createElement('base');
baseEl.href = BASE_PATH;
document.head.prepend(baseEl);
const setBase = (href) => { baseEl.href = href; };

const isInternal = (url) => url && url.startsWith('/');
const moduleHref = (key) => BASE_PATH + 'm/' + key;

function route() {
  const p = location.pathname;
  if (!p.startsWith(BASE_PATH)) return { name: 'home' };
  const rest = p.slice(BASE_PATH.length).replace(/\/$/, '');
  const m = rest.match(/^m\/(.+)$/);
  return m ? { name: 'module', key: decodeURIComponent(m[1]) } : { name: 'home' };
}

function navigate(path, replace) {
  if (path === location.pathname) return;
  if (replace) history.replaceState({}, '', path);
  else history.pushState({}, '', path);
  render();
}

function renderNav() {
  navlinks.replaceChildren();
  navlinks.append(Object.assign(document.createElement('a'), { className: 'nav', href: BASE_PATH, textContent: '首页' }));
  for (const l of portal.links.filter(x => isInternal(x.url))) {
    navlinks.append(Object.assign(document.createElement('a'), { className: 'nav', href: moduleHref(l.key), textContent: l.name }));
  }
}

function renderHome() {
  setBase(BASE_PATH);
  const byGroup = {};
  for (const l of portal.links) (byGroup[l.group] ||= []).push(l);
  const el = document.createElement('div'); el.className = 'home';
  el.innerHTML = `<h1>${portal.title || '统一门户'}</h1><p class="sub">站点与游戏的统一入口</p>`;
  for (const [group, links] of Object.entries(byGroup)) {
    const h = document.createElement('div'); h.className = 'group'; h.textContent = group;
    el.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const l of links) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = isInternal(l.url) ? moduleHref(l.key) : l.url;
      a.innerHTML = `<div class="ico">${l.icon || ''}</div>` +
        `<div class="name">${l.name}${l.status ? `<span class="tag">${l.status}</span>` : ''}</div>` +
        `<div class="desc">${l.desc || ''}</div>`;
      grid.appendChild(a);
    }
    el.appendChild(grid);
  }
  view.replaceChildren(el);
}

function renderModule(key) {
  const l = portal.links.find(x => x.key === key && isInternal(x.url));
  if (!l) return renderHome();
  if (l.embed) { mountEmbed(l); return; }
  setBase(BASE_PATH);
  const f = document.createElement('iframe');
  f.className = 'view'; f.src = l.url; f.title = l.name;
  f.setAttribute('allow', 'fullscreen; clipboard-write');
  view.replaceChildren(f);
}

// A module owns its scripts, injected styles and disposal callbacks. Only one
// asynchronous script sequence may run at a time; a newer route cancels its owner.
function releaseMount(context) {
  context.controller.abort();
  for (const dispose of context.disposers) {
    if (context.released.has(dispose)) continue;
    context.released.add(dispose);
    try { dispose(); } catch (error) { console.error('模块卸载失败', error); }
  }
  for (const element of context.head) element.remove();
  if (!context.failed || context.version !== mountVersion) context.box.remove();
  if (window.__iridescentlyEmbed === context.box) window.__iridescentlyEmbed = null;
  if (context.disposers.has(window.__iridescentlyDispose)) window.__iridescentlyDispose = null;
}

function captureDispose(context) {
  if (typeof window.__iridescentlyDispose === 'function') context.disposers.add(window.__iridescentlyDispose);
}

function appendScript(context, source, base) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    const type = (source.getAttribute('type') || '').toLowerCase();
    if (type) script.type = type;
    const src = source.getAttribute('src');
    const finish = (error) => {
      context.controller.signal.removeEventListener('abort', cancel);
      script.onload = script.onerror = null;
      if (error) { script.remove(); reject(error); } else resolve();
    };
    const cancel = () => finish(new DOMException('Module route changed', 'AbortError'));
    script.onload = () => finish();
    script.onerror = () => finish(new Error('脚本无法载入：' + (src || '内联模块')));
    if (src) script.src = new URL(src, base).href;
    else script.textContent = source.textContent;
    context.controller.signal.addEventListener('abort', cancel, { once: true });
    context.box.appendChild(script);
    // Classic inline scripts execute synchronously; inline modules emit load.
    if (!src && type !== 'module') finish();
  });
}

function mountEmbed(link) {
  const box = document.createElement('div');
  box.className = 'view module-embed';
  box.setAttribute('aria-busy', 'true');
  box.innerHTML = '<p class="module-state" role="status">正在打开 ' + escapeText(link.name) + '…</p>';
  view.replaceChildren(box);
  const context = { box, version: mountVersion, controller: new AbortController(), head: [], disposers: new Set(), released: new Set() };
  activeMount = context;
  const current = () => context.version === mountVersion && !context.controller.signal.aborted;
  const base = new URL(link.url.endsWith('/') ? link.url : link.url + '/', location.origin).href;

  mountQueue = mountQueue.catch(() => {}).then(async () => {
    if (!current()) return;
    window.__iridescentlyDispose = null;
    try {
      const response = await fetch(new URL('index.html', base), { signal: context.controller.signal });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const html = await response.text();
      if (!current()) return;
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const scripts = [...doc.querySelectorAll('script')];
      // Resolve attributes before copying the DOM; detached document changes do
      // not affect an already-injected body. Do not run script tags twice.
      for (const element of doc.querySelectorAll('[src], [href], [poster]')) {
        for (const attribute of ['src', 'href', 'poster']) {
          const value = element.getAttribute(attribute);
          if (value && !/^(?:[a-z][a-z\d+.-]*:|\/|#)/i.test(value)) element.setAttribute(attribute, new URL(value, base).href);
        }
      }
      for (const source of doc.head.querySelectorAll('link[rel="stylesheet"], style')) {
        const element = source.cloneNode(true);
        element.dataset.moduleOwner = link.key;
        context.head.push(element);
        document.head.appendChild(element);
      }
      for (const source of scripts) source.remove();
      box.innerHTML = doc.body.innerHTML;
      setBase(base);
      window.__iridescentlyEmbed = box;
      for (const source of scripts) {
        if (!current()) break;
        const type = (source.getAttribute('type') || '').toLowerCase();
        if (type === 'application/ld+json' || type === 'application/json') continue;
        const src = source.getAttribute('src');
        if (!src && !source.textContent.trim()) continue;
        if (src && type === 'module') {
          // Import itself is not abortable. Serialize it, then dispose its owner
          // if the route changed while the import was executing.
          const url = new URL(src, base);
          const identity = url.href;
          const mount = scriptMounts.get(identity);
          if (mount) {
            window.__iridescentlyDispose = null;
            await mount();
          } else {
            window.__iridescentlyMount = null;
            url.searchParams.set('embed', String(context.version));
            await import(url.href);
            if (typeof window.__iridescentlyMount === 'function') scriptMounts.set(identity, window.__iridescentlyMount);
          }
        } else await appendScript(context, source, base);
        captureDispose(context);
      }
      if (current()) box.setAttribute('aria-busy', 'false');
    } catch (error) {
      if (current() && error.name !== 'AbortError') {
        context.failed = true;
        releaseMount(context);
        box.innerHTML = '<p class="module-state" role="alert">模块暂时无法载入。<a href="' + link.url + '">单独打开 ' + escapeText(link.name) + '</a>，或选择其他入口。</p>';
        box.setAttribute('aria-busy', 'false');
        view.replaceChildren(box);
        console.error('模块加载失败', error);
      }
    } finally {
      captureDispose(context);
      if (!current()) releaseMount(context);
      if (window.__iridescentlyEmbed === box) window.__iridescentlyEmbed = null;
    }
  });
}

function escapeText(value) {
  return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}

function render() {
  mountVersion += 1;
  if (activeMount) { releaseMount(activeMount); activeMount = null; }
  setBase(BASE_PATH);
  const r = route();
  if (r.name === 'module') renderModule(r.key); else renderHome();
  for (const a of navlinks.querySelectorAll('a')) {
    const current = a.getAttribute('href') === location.pathname;
    a.classList.toggle('active', current);
    if (current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  set('lastRoute', location.pathname);
}

addEventListener('pagehide', (event) => {
  if (event.persisted) return;
  mountVersion += 1;
  if (activeMount) releaseMount(activeMount);
});

document.addEventListener('click', (event) => {
  const a = event.target.closest('a');
  if (!a || a.target === '_blank' || a.hasAttribute('download') || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  const href = a.getAttribute('href') || '';
  if (!href.startsWith(BASE_PATH)) return;
  event.preventDefault();
  navigate(href);
});
addEventListener('popstate', render);

(async () => {
  try { portal = await (await fetch('/app/portal.json')).json(); } catch {}
  renderNav();
  const r = route();
  const last = get('lastRoute');
  if (r.name === 'home' && last && last.startsWith(BASE_PATH) && last !== BASE_PATH) {
    history.replaceState({}, '', last);
  }
  render();
  const s = await refreshSession();
  document.getElementById('iridescently-shell-user').textContent = s && s.logged_in ? (s.name || '已登录') : '';
})();
</script>
</body>
</html>
